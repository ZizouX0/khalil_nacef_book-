<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420"><title>Los tres pasados</title><text x="24" y="30" font-family="DejaVu Sans" font-size="14" fill="#9A6207" font-weight="bold">Los tres pasados</text><text x="24" y="46" font-family="DejaVu Sans" font-size="10" fill="#57534E">Choose the tense by the job it does in the story, not by the time word.</text><text x="24" y="78" font-family="DejaVu Sans" font-size="12" fill="#A0182A" font-weight="bold">INDEFINIDO</text><text x="113" y="78" font-family="DejaVu Sans" font-size="9.5" fill="#57534E">los acontecimientos — the events, one after another  ·  ayer, de repente, un día</text><line x1="24" y1="241" x2="606" y2="241" stroke="#57534E" stroke-width="1.2"/><polygon points="614,241 604,236.5 604,245.5" fill="#57534E"/><rect x="48" y="216" width="384" height="50" rx="6" fill="#F4EEE4" stroke="#9A6207" stroke-width="1.4"/><line x1="50" y1="218" x2="50" y2="218" stroke="#CBAE7B" stroke-width="0.9"/><line x1="50" y1="230" x2="62" y2="218" stroke="#CBAE7B" stroke-width="0.9"/><line x1="50" y1="242" x2="74" y2="218" stroke="#CBAE7B" stroke-width="0.9"/><line x1="50" y1="254" x2="86" y2="218" stroke="#CBAE7B" stroke-width="0.9"/><line x1="52" y1="264" x2="98" y2="218" stroke="#CBAE7B" stroke-width="0.9"/><line x1="64" y1="264" x2="110" y2="218" stroke="#CBAE7B" stroke-width="0.9"/><line x1="76" y1="264" x2="122" y2="218" stroke="#CBAE7B" stroke-width="0.9"/><line x1="88" y1="264" x2="134" y2="218" stroke="#CBAE7B" stroke-width="0.9"/><line x1="100" y1="264" x2="146" y2="218" stroke="#CBAE7B" stroke-width="0.9"/><line x1="112" y1="264" x2="158" y2="218" stroke="#CBAE7B" stroke-width="0.9"/><line x1="124" y1="264" x2="170" y2="218" stroke="#CBAE7B" stroke-width="0.9"/><line x1="136" y1="264" x2="182" y2="218" stroke="#CBAE7B" stroke-width="0.9"/><line x1="148" y1="264" x2="194" y2="218" stroke="#CBAE7B" stroke-width="0.9"/><line x1="160" y1="264" x2="206" y2="218" stroke="#CBAE7B" stroke-width="0.9"/><line x1="172" y1="264" x2="218" y2="218" stroke="#CBAE7B" stroke-width="0.9"/><line x1="184" y1="264" x2="230" y2="218" stroke="#CBAE7B" stroke-width="0.9"/><line x1="196" y1="264" x2="242" y2="218" stroke="#CBAE7B" stroke-width="0.9"/><line x1="208" y1="264" x2="254" y2="218" stroke="#CBAE7B" stroke-width="0.9"/><line x1="220" y1="264" x2="266" y2="218" stroke="#CBAE7B" stroke-width="0.9"/><line x1="232" y1="264" x2="278" y2="218" stroke="#CBAE7B" stroke-width="0.9"/><line x1="244" y1="264" x2="290" y2="218" stroke="#CBAE7B" stroke-width="0.9"/><line x1="256" y1="264" x2="302" y2="218" stroke="#CBAE7B" stroke-width="0.9"/><line x1="268" y1="264" x2="314" y2="218" stroke="#CBAE7B" stroke-width="0.9"/><line x1="280" y1="264" x2="326" y2="218" stroke="#CBAE7B" stroke-width="0.9"/><line x1="292" y1="264" x2="338" y2="218" stroke="#CBAE7B" stroke-width="0.9"/><line x1="304" y1="264" x2="350" y2="218" stroke="#CBAE7B" stroke-width="0.9"/><line x1="316" y1="264" x2="362" y2="218" stroke="#CBAE7B" stroke-width="0.9"/><line x1="328" y1="264" x2="374" y2="218" stroke="#CBAE7B" stroke-width="0.9"/><line x1="340" y1="264" x2="386" y2="218" stroke="#CBAE7B" stroke-width="0.9"/><line x1="352" y1="264" x2="398" y2="218" stroke="#CBAE7B" stroke-width="0.9"/><line x1="364" y1="264" x2="410" y2="218" stroke="#CBAE7B" stroke-width="0.9"/><line x1="376" y1="264" x2="422" y2="218" stroke="#CBAE7B" stroke-width="0.9"/><line x1="388" y1="264" x2="430" y2="222" stroke="#CBAE7B" stroke-width="0.9"/><line x1="400" y1="264" x2="430" y2="234" stroke="#CBAE7B" stroke-width="0.9"/><line x1="412" y1="264" x2="430" y2="246" stroke="#CBAE7B" stroke-width="0.9"/><line x1="424" y1="264" x2="430" y2="258" stroke="#CBAE7B" stroke-width="0.9"/><rect x="48" y="216" width="384" height="50" rx="6" fill="none" stroke="#9A6207" stroke-width="1.4"/><line x1="140.46" y1="130" x2="140.46" y2="246" stroke="#A0182A" stroke-width="1.6"/><polygon points="140.46,259 137.06,245 143.86,245" fill="#A0182A"/><line x1="287.52" y1="130" x2="287.52" y2="246" stroke="#A0182A" stroke-width="1.6"/><polygon points="287.52,259 284.12,245 290.92,245" fill="#A0182A"/><line x1="387.05" y1="130" x2="387.05" y2="246" stroke="#A0182A" stroke-width="1.6"/><polygon points="387.05,259 383.65,245 390.45,245" fill="#A0182A"/><polyline points="44,232 37,241 44,250" fill="none" stroke="#9A6207" stroke-width="1.8"/><polyline points="436,232 443,241 436,250" fill="none" stroke="#9A6207" stroke-width="1.8"/><rect x="56" y="104" width="168.93" height="26" rx="5" fill="#A0182A"/><text x="140.46" y="120.96" font-family="DejaVu Sans" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="bold">cuando sonó el teléfono</text><rect x="242.96" y="104" width="89.13" height="26" rx="5" fill="#A0182A"/><text x="287.52" y="120.96" font-family="DejaVu Sans" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="bold">me levanté</text><rect x="350.11" y="104" width="73.89" height="26" rx="5" fill="#A0182A"/><text x="387.05" y="120.96" font-family="DejaVu Sans" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="bold">contesté</text><text x="566" y="216" font-family="DejaVu Sans" font-size="11" fill="#1A1A1E" text-anchor="middle" font-weight="bold">AHORA</text><text x="566" y="229" font-family="DejaVu Sans" font-size="9.5" fill="#57534E" text-anchor="middle">now</text><line x1="566" y1="234" x2="566" y2="253" stroke="#1A1A1E" stroke-width="1.8"/><line x1="566" y1="255" x2="566" y2="346" stroke="#125C82" stroke-width="1" stroke-dasharray="3 3"/><text x="48" y="290" font-family="DejaVu Sans" font-size="12" fill="#9A6207" font-weight="bold">IMPERFECTO</text><text x="143.23" y="290" font-family="DejaVu Sans" font-size="9.5" fill="#57534E">el fondo — the background: weather, time, feelings, what was going on</text><text x="48" y="312" font-family="DejaVu Sans" font-size="13" fill="#1A1A1E" font-weight="bold">Era de noche y llovía…</text><text x="48" y="328" font-family="DejaVu Sans" font-size="9.5" fill="#57534E" font-style="italic">It was night and it was raining when the phone rang. I got up and answered.</text><rect x="24" y="346" width="592" height="60" rx="8" fill="#E7EFF2" stroke="#125C82" stroke-width="1.2"/><text x="40" y="370" font-family="DejaVu Sans" font-size="12" fill="#125C82" font-weight="bold">PRETÉRITO PERFECTO</text><text x="40" y="386" font-family="DejaVu Sans" font-size="9.5" fill="#57534E">hoy · esta semana · este año · alguna vez</text><text x="40" y="398" font-family="DejaVu Sans" font-size="9.5" fill="#57534E">a past still inside the time we are in</text><text x="330" y="370" font-family="DejaVu Sans" font-size="12" fill="#1A1A1E" font-weight="bold">Hoy he comido paella.</text><text x="330" y="386" font-family="DejaVu Sans" font-size="9.5" fill="#57534E" font-style="italic">Today I have eaten paella.</text><text x="330" y="398" font-family="DejaVu Sans" font-size="9.5" fill="#57534E">Still “today” — the day is not over.</text></svg>