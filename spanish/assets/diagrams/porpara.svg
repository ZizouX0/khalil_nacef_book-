<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420"><title>por o para</title><text x="24" y="30" font-family="DejaVu Sans" font-size="14" fill="#9A6207" font-weight="bold">por  /  para</text><text x="24" y="46" font-family="DejaVu Sans" font-size="10" fill="#57534E">Both are “for” in English. Choose by what you mean, never by the English word.</text><rect x="215" y="58" width="210" height="40" rx="8" fill="#F4EEE4" stroke="#9A6207" stroke-width="1.3"/><text x="320" y="76" font-family="DejaVu Sans" font-size="12" fill="#1A1A1E" text-anchor="middle" font-weight="bold">¿Qué quiero decir?</text><text x="320" y="90" font-family="DejaVu Sans" font-size="9.5" fill="#57534E" text-anchor="middle">What am I trying to say?</text><line x1="320" y1="98" x2="320" y2="110" stroke="#57534E" stroke-width="1.2"/><line x1="150" y1="110" x2="490" y2="110" stroke="#57534E" stroke-width="1.2"/><line x1="150" y1="110" x2="150" y2="120" stroke="#57534E" stroke-width="1.2"/><line x1="490" y1="110" x2="490" y2="120" stroke="#57534E" stroke-width="1.2"/><polygon points="150,128 145.5,118 154.5,118" fill="#57534E"/><polygon points="490,128 485.5,118 494.5,118" fill="#57534E"/><polygon points="24,128 282,128 300,145 282,162 24,162" fill="#125C82"/><text x="38" y="150" font-family="DejaVu Sans" font-size="13" fill="#FFFFFF" font-weight="bold">PARA</text><text x="87.66" y="150" font-family="DejaVu Sans" font-size="9.5" fill="#FFFFFF">·  la meta — where it is going</text><line x1="38" y1="162" x2="38" y2="366" stroke="#125C82" stroke-width="1.2"/><line x1="38" y1="182" x2="48" y2="182" stroke="#125C82" stroke-width="1.2"/><rect x="48" y="179" width="6" height="6" fill="#125C82"/><text x="62" y="186" font-family="DejaVu Sans" font-size="10.5" fill="#125C82" font-weight="bold">finalidad</text><text x="122.04" y="186" font-family="DejaVu Sans" font-size="9.5" fill="#57534E">purpose · + infinitive</text><text x="62" y="200" font-family="DejaVu Sans" font-size="11" fill="#1A1A1E" font-weight="bold">Estudio para aprender.</text><text x="62" y="212" font-family="DejaVu Sans" font-size="9.5" fill="#57534E" font-style="italic">I study in order to learn.</text><line x1="38" y1="228" x2="48" y2="228" stroke="#125C82" stroke-width="1.2"/><rect x="48" y="225" width="6" height="6" fill="#125C82"/><text x="62" y="232" font-family="DejaVu Sans" font-size="10.5" fill="#125C82" font-weight="bold">destinatario</text><text x="142.16" y="232" font-family="DejaVu Sans" font-size="9.5" fill="#57534E">recipient</text><text x="62" y="246" font-family="DejaVu Sans" font-size="11" fill="#1A1A1E" font-weight="bold">Este regalo es para ti.</text><text x="62" y="258" font-family="DejaVu Sans" font-size="9.5" fill="#57534E" font-style="italic">This present is for you.</text><line x1="38" y1="274" x2="48" y2="274" stroke="#125C82" stroke-width="1.2"/><rect x="48" y="271" width="6" height="6" fill="#125C82"/><text x="62" y="278" font-family="DejaVu Sans" font-size="10.5" fill="#125C82" font-weight="bold">plazo</text><text x="101.53" y="278" font-family="DejaVu Sans" font-size="9.5" fill="#57534E">deadline</text><text x="62" y="292" font-family="DejaVu Sans" font-size="11" fill="#1A1A1E" font-weight="bold">Lo necesito para el lunes.</text><text x="62" y="304" font-family="DejaVu Sans" font-size="9.5" fill="#57534E" font-style="italic">I need it by Monday.</text><line x1="38" y1="320" x2="48" y2="320" stroke="#125C82" stroke-width="1.2"/><rect x="48" y="317" width="6" height="6" fill="#125C82"/><text x="62" y="324" font-family="DejaVu Sans" font-size="10.5" fill="#125C82" font-weight="bold">destino</text><text x="114.19" y="324" font-family="DejaVu Sans" font-size="9.5" fill="#57534E">destination</text><text x="62" y="338" font-family="DejaVu Sans" font-size="11" fill="#1A1A1E" font-weight="bold">Salgo para Madrid.</text><text x="62" y="350" font-family="DejaVu Sans" font-size="9.5" fill="#57534E" font-style="italic">I am leaving for Madrid.</text><line x1="38" y1="366" x2="48" y2="366" stroke="#125C82" stroke-width="1.2"/><rect x="48" y="363" width="6" height="6" fill="#125C82"/><text x="62" y="370" font-family="DejaVu Sans" font-size="10.5" fill="#125C82" font-weight="bold">opinión</text><text x="114.09" y="370" font-family="DejaVu Sans" font-size="9.5" fill="#57534E">in my view</text><text x="62" y="384" font-family="DejaVu Sans" font-size="11" fill="#1A1A1E" font-weight="bold">Para mí, es fácil.</text><text x="62" y="396" font-family="DejaVu Sans" font-size="9.5" fill="#57534E" font-style="italic">In my view, it is easy.</text><rect x="340" y="128" width="276" height="34" rx="17" fill="#1F7A68"/><text x="360" y="150" font-family="DejaVu Sans" font-size="13" fill="#FFFFFF" font-weight="bold">POR</text><text x="400.59" y="150" font-family="DejaVu Sans" font-size="9.5" fill="#FFFFFF">·  el motivo — why, how, through</text><line x1="354" y1="162" x2="354" y2="366" stroke="#1F7A68" stroke-width="1.2"/><line x1="354" y1="182" x2="364" y2="182" stroke="#1F7A68" stroke-width="1.2"/><rect x="364" y="179" width="6" height="6" fill="#1F7A68"/><text x="378" y="186" font-family="DejaVu Sans" font-size="10.5" fill="#1F7A68" font-weight="bold">causa</text><text x="420.12" y="186" font-family="DejaVu Sans" font-size="9.5" fill="#57534E">cause · reason</text><text x="378" y="200" font-family="DejaVu Sans" font-size="11" fill="#1A1A1E" font-weight="bold">Lo hago por ti.</text><text x="378" y="212" font-family="DejaVu Sans" font-size="9.5" fill="#57534E" font-style="italic">I am doing it for your sake.</text><line x1="354" y1="228" x2="364" y2="228" stroke="#1F7A68" stroke-width="1.2"/><rect x="364" y="225" width="6" height="6" fill="#1F7A68"/><text x="378" y="232" font-family="DejaVu Sans" font-size="10.5" fill="#1F7A68" font-weight="bold">precio</text><text x="422.85" y="232" font-family="DejaVu Sans" font-size="9.5" fill="#57534E">exchange · price</text><text x="378" y="246" font-family="DejaVu Sans" font-size="11" fill="#1A1A1E" font-weight="bold">Lo compré por 20 euros.</text><text x="378" y="258" font-family="DejaVu Sans" font-size="9.5" fill="#57534E" font-style="italic">I bought it for 20 euros.</text><line x1="354" y1="274" x2="364" y2="274" stroke="#1F7A68" stroke-width="1.2"/><rect x="364" y="271" width="6" height="6" fill="#1F7A68"/><text x="378" y="278" font-family="DejaVu Sans" font-size="10.5" fill="#1F7A68" font-weight="bold">medio</text><text x="422.39" y="278" font-family="DejaVu Sans" font-size="9.5" fill="#57534E">means</text><text x="378" y="292" font-family="DejaVu Sans" font-size="11" fill="#1A1A1E" font-weight="bold">Hablamos por teléfono.</text><text x="378" y="304" font-family="DejaVu Sans" font-size="9.5" fill="#57534E" font-style="italic">We talk on the phone.</text><line x1="354" y1="320" x2="364" y2="320" stroke="#1F7A68" stroke-width="1.2"/><rect x="364" y="317" width="6" height="6" fill="#1F7A68"/><text x="378" y="324" font-family="DejaVu Sans" font-size="10.5" fill="#1F7A68" font-weight="bold">duración</text><text x="437.77" y="324" font-family="DejaVu Sans" font-size="9.5" fill="#57534E">duration</text><text x="378" y="338" font-family="DejaVu Sans" font-size="11" fill="#1A1A1E" font-weight="bold">Te lo dejo por una semana.</text><text x="378" y="350" font-family="DejaVu Sans" font-size="9.5" fill="#57534E" font-style="italic">I will lend it to you for a week.</text><line x1="354" y1="366" x2="364" y2="366" stroke="#1F7A68" stroke-width="1.2"/><rect x="364" y="363" width="6" height="6" fill="#1F7A68"/><text x="378" y="370" font-family="DejaVu Sans" font-size="10.5" fill="#1F7A68" font-weight="bold">movimiento</text><text x="455.97" y="370" font-family="DejaVu Sans" font-size="9.5" fill="#57534E">through · along</text><text x="378" y="384" font-family="DejaVu Sans" font-size="11" fill="#1A1A1E" font-weight="bold">Paseamos por el parque.</text><text x="378" y="396" font-family="DejaVu Sans" font-size="9.5" fill="#57534E" font-style="italic">We stroll through the park.</text></svg>