<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="DejaVu Sans">
  <!-- LOS TRANSPORTES — silhouettes + the ir en … pattern shown once at the top,
       with a pie isolated at the bottom as the one exception. -->

  <!-- ===== header ===== -->
  <text x="20" y="24" font-size="13" font-weight="bold" fill="#1A1A1E">Los transportes</text>
  <text x="148" y="24" font-size="10.5" fill="#6E6C72">¿Cómo vas al trabajo?</text>
  <text x="620" y="23" text-anchor="end" font-size="9.5" font-style="italic" fill="#6E6C72">— Voy en metro y luego a pie.</text>

  <!-- ===== the pattern, shown once ===== -->
  <rect x="16" y="42" width="608" height="38" rx="8" fill="#E7EFF2" stroke="#125C82" stroke-width="1.2"/>
  <text x="34" y="61" font-size="13" font-weight="bold" fill="#125C82">ir en + transporte</text>
  <text x="34" y="73" font-size="9" fill="#125C82">= to go by + means of transport</text>
  <line x1="300" y1="50" x2="300" y2="72" stroke="#125C82" stroke-width="0.9"/>
  <text x="606" y="61" text-anchor="end" font-size="10" fill="#1A1A1E">Voy en tren. · Vamos en coche. · ¿Vas en metro?</text>
  <text x="606" y="73" text-anchor="end" font-size="9" fill="#6E6C72">I go by train. · We go by car. · Do you go by underground?</text>

  <!-- ============ el avión ============ -->
  <g transform="translate(92,136)">
    <path d="M -7 -2 L -34 9 L -34 13 L -7 7 L 7 7 L 34 13 L 34 9 L 7 -2 Z" fill="#E7EFF2" stroke="#1A1A1E" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M -3 12 L -15 20 L -15 23 L -3 19 L 3 19 L 15 23 L 15 20 L 3 12 Z" fill="#E7EFF2" stroke="#1A1A1E" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M 0 -24 C 5 -24 7 -17 7 -8 L 7 10 C 7 16 4 20 0 20 C -4 20 -7 16 -7 10 L -7 -8 C -7 -17 -5 -24 0 -24 Z" fill="#FFFFFF" stroke="#1A1A1E" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M -5 -14 C -3 -18 3 -18 5 -14" fill="none" stroke="#1A1A1E" stroke-width="1.1"/>
  </g>
  <text x="92" y="178" text-anchor="middle" font-size="11" fill="#1A1A1E"><tspan fill="#125C82" font-weight="bold">el</tspan> avión</text>
  <text x="92" y="191" text-anchor="middle" font-size="9" fill="#6E6C72">plane</text>

  <!-- ============ el tren ============ -->
  <g transform="translate(244,136)">
    <polyline points="-6,-20 -13,-28 -1,-28" fill="none" stroke="#1A1A1E" stroke-width="1.6" stroke-linejoin="round"/>
    <rect x="-32" y="-20" width="64" height="32" rx="7" fill="#E9F2F0" stroke="#1A1A1E" stroke-width="1.4"/>
    <rect x="-25" y="-14" width="14" height="11" fill="#FFFFFF" stroke="#1A1A1E" stroke-width="1.1"/>
    <rect x="-7" y="-14" width="14" height="11" fill="#FFFFFF" stroke="#1A1A1E" stroke-width="1.1"/>
    <rect x="11" y="-14" width="14" height="11" fill="#FFFFFF" stroke="#1A1A1E" stroke-width="1.1"/>
    <circle cx="25" cy="6" r="3" fill="#F4EEE4" stroke="#1A1A1E" stroke-width="1.1"/>
    <g fill="#FFFFFF" stroke="#1A1A1E" stroke-width="1.3">
      <circle cx="-22" cy="16" r="4.5"/><circle cx="-11" cy="16" r="4.5"/>
      <circle cx="11" cy="16" r="4.5"/><circle cx="22" cy="16" r="4.5"/>
    </g>
    <line x1="-38" y1="22" x2="38" y2="22" stroke="#1A1A1E" stroke-width="1.8"/>
  </g>
  <text x="244" y="178" text-anchor="middle" font-size="11" fill="#1A1A1E"><tspan fill="#125C82" font-weight="bold">el</tspan> tren</text>
  <text x="244" y="191" text-anchor="middle" font-size="9" fill="#6E6C72">train</text>

  <!-- ============ el autobús ============ -->
  <g transform="translate(396,136)">
    <rect x="-34" y="-20" width="68" height="30" rx="5" fill="#F4EEE4" stroke="#1A1A1E" stroke-width="1.4"/>
    <rect x="-29" y="-15" width="13" height="11" fill="#FFFFFF" stroke="#1A1A1E" stroke-width="1.1"/>
    <rect x="-14" y="-15" width="13" height="11" fill="#FFFFFF" stroke="#1A1A1E" stroke-width="1.1"/>
    <rect x="1" y="-15" width="13" height="11" fill="#FFFFFF" stroke="#1A1A1E" stroke-width="1.1"/>
    <rect x="18" y="-15" width="12" height="11" fill="#FFFFFF" stroke="#1A1A1E" stroke-width="1.1"/>
    <rect x="19" y="-1" width="10" height="11" fill="#FFFFFF" stroke="#1A1A1E" stroke-width="1.1"/>
    <g fill="#FFFFFF" stroke="#1A1A1E" stroke-width="1.5">
      <circle cx="-18" cy="12" r="6"/><circle cx="18" cy="12" r="6"/>
    </g>
    <circle cx="-18" cy="12" r="2" fill="#1A1A1E"/>
    <circle cx="18" cy="12" r="2" fill="#1A1A1E"/>
  </g>
  <text x="396" y="178" text-anchor="middle" font-size="11" fill="#1A1A1E"><tspan fill="#125C82" font-weight="bold">el</tspan> autobús</text>
  <text x="396" y="191" text-anchor="middle" font-size="9" fill="#6E6C72">bus</text>

  <!-- ============ el coche ============ -->
  <g transform="translate(548,136)">
    <path d="M -34 6 L -32 -4 L -20 -4 L -12 -16 L 10 -16 L 18 -4 L 32 -4 L 34 6 L 34 10 L -34 10 Z" fill="#F6EAEC" stroke="#1A1A1E" stroke-width="1.4" stroke-linejoin="round"/>
    <polygon points="-17,-5 -11,-14 -2,-14 -2,-5" fill="#FFFFFF" stroke="#1A1A1E" stroke-width="1.1"/>
    <polygon points="2,-14 9,-14 15,-5 2,-5" fill="#FFFFFF" stroke="#1A1A1E" stroke-width="1.1"/>
    <g fill="#FFFFFF" stroke="#1A1A1E" stroke-width="1.5">
      <circle cx="-18" cy="10" r="7"/><circle cx="18" cy="10" r="7"/>
    </g>
    <circle cx="-18" cy="10" r="2.5" fill="#1A1A1E"/>
    <circle cx="18" cy="10" r="2.5" fill="#1A1A1E"/>
  </g>
  <text x="548" y="178" text-anchor="middle" font-size="11" fill="#1A1A1E"><tspan fill="#125C82" font-weight="bold">el</tspan> coche</text>
  <text x="548" y="191" text-anchor="middle" font-size="9" fill="#6E6C72">car</text>

  <!-- ============ la bicicleta ============ -->
  <g transform="translate(92,242)">
    <circle cx="-20" cy="6" r="14" fill="#FFFFFF" stroke="#1A1A1E" stroke-width="2"/>
    <circle cx="20" cy="6" r="14" fill="#FFFFFF" stroke="#1A1A1E" stroke-width="2"/>
    <g stroke="#1A1A1E" stroke-width="0.9">
      <line x1="-34" y1="6" x2="-6" y2="6"/><line x1="-20" y1="-8" x2="-20" y2="20"/>
      <line x1="6" y1="6" x2="34" y2="6"/><line x1="20" y1="-8" x2="20" y2="20"/>
    </g>
    <g fill="none" stroke="#1A1A1E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="-20,6 0,6 -5,-10 12,-10 20,6"/>
      <line x1="-20" y1="6" x2="-5" y2="-10"/>
      <line x1="0" y1="6" x2="12" y2="-10"/>
      <line x1="-10" y1="-13" x2="-1" y2="-13"/>
      <polyline points="12,-10 14,-15 21,-16"/>
    </g>
    <circle cx="0" cy="6" r="3" fill="#1A1A1E"/>
  </g>
  <text x="92" y="284" text-anchor="middle" font-size="11" fill="#1A1A1E"><tspan fill="#A62466" font-weight="bold">la</tspan> bicicleta</text>
  <text x="92" y="297" text-anchor="middle" font-size="9" fill="#6E6C72">bicycle</text>

  <!-- ============ el barco ============ -->
  <g transform="translate(244,242)">
    <line x1="-20" y1="-12" x2="-20" y2="-25" stroke="#1A1A1E" stroke-width="1.6"/>
    <polygon points="-20,-25 -8,-21 -20,-17" fill="#A0182A" stroke="#1A1A1E" stroke-width="1"/>
    <rect x="2" y="-22" width="9" height="10" fill="#DED8CE" stroke="#1A1A1E" stroke-width="1.3"/>
    <rect x="-14" y="-12" width="28" height="14" fill="#FFFFFF" stroke="#1A1A1E" stroke-width="1.3"/>
    <g fill="#E7EFF2" stroke="#1A1A1E" stroke-width="0.9">
      <rect x="-10" y="-8" width="6" height="6"/><rect x="-1" y="-8" width="6" height="6"/>
    </g>
    <path d="M -32 2 L 32 2 L 24 16 L -24 16 Z" fill="#E7EFF2" stroke="#1A1A1E" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M -34 21 C -26 18 -20 24 -12 21 C -4 18 2 24 10 21 C 18 18 26 24 34 21" fill="none" stroke="#1A1A1E" stroke-width="1.6" stroke-linecap="round"/>
  </g>
  <text x="244" y="284" text-anchor="middle" font-size="11" fill="#1A1A1E"><tspan fill="#125C82" font-weight="bold">el</tspan> barco</text>
  <text x="244" y="297" text-anchor="middle" font-size="9" fill="#6E6C72">boat / ship</text>

  <!-- ============ el metro ============ -->
  <g transform="translate(396,242)">
    <path d="M -30 20 L -30 -4 C -30 -26 30 -26 30 -4 L 30 20 Z" fill="#F4EEE4" stroke="#1A1A1E" stroke-width="1.4" stroke-linejoin="round"/>
    <circle cx="0" cy="-14" r="8" fill="#FFFFFF" stroke="#1A1A1E" stroke-width="1.5"/>
    <text x="0" y="-10" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A1E">M</text>
    <rect x="-17" y="-4" width="34" height="24" rx="4" fill="#FFFFFF" stroke="#1A1A1E" stroke-width="1.3"/>
    <rect x="-12" y="0" width="24" height="10" fill="#E7EFF2" stroke="#1A1A1E" stroke-width="1.1"/>
    <circle cx="-9" cy="15" r="2.5" fill="#F4EEE4" stroke="#1A1A1E" stroke-width="1"/>
    <circle cx="9" cy="15" r="2.5" fill="#F4EEE4" stroke="#1A1A1E" stroke-width="1"/>
  </g>
  <text x="396" y="284" text-anchor="middle" font-size="11" fill="#1A1A1E"><tspan fill="#125C82" font-weight="bold">el</tspan> metro</text>
  <text x="396" y="297" text-anchor="middle" font-size="9" fill="#6E6C72">underground</text>

  <!-- ============ el taxi ============ -->
  <g transform="translate(548,242)">
    <rect x="-15" y="-27" width="30" height="11" rx="2" fill="#9A6207" stroke="#1A1A1E" stroke-width="1.2"/>
    <text x="0" y="-19" text-anchor="middle" font-size="9" font-weight="bold" fill="#FFFFFF">TAXI</text>
    <path d="M -34 6 L -32 -4 L -20 -4 L -12 -16 L 10 -16 L 18 -4 L 32 -4 L 34 6 L 34 10 L -34 10 Z" fill="#F4EEE4" stroke="#1A1A1E" stroke-width="1.4" stroke-linejoin="round"/>
    <polygon points="-17,-5 -11,-14 -2,-14 -2,-5" fill="#FFFFFF" stroke="#1A1A1E" stroke-width="1.1"/>
    <polygon points="2,-14 9,-14 15,-5 2,-5" fill="#FFFFFF" stroke="#1A1A1E" stroke-width="1.1"/>
    <g stroke="#1A1A1E" stroke-width="0.9">
      <rect x="-11" y="0" width="5.5" height="5" fill="#1A1A1E"/>
      <rect x="-5.5" y="0" width="5.5" height="5" fill="#FFFFFF"/>
      <rect x="0" y="0" width="5.5" height="5" fill="#1A1A1E"/>
      <rect x="5.5" y="0" width="5.5" height="5" fill="#FFFFFF"/>
    </g>
    <g fill="#FFFFFF" stroke="#1A1A1E" stroke-width="1.5">
      <circle cx="-18" cy="10" r="7"/><circle cx="18" cy="10" r="7"/>
    </g>
    <circle cx="-18" cy="10" r="2.5" fill="#1A1A1E"/>
    <circle cx="18" cy="10" r="2.5" fill="#1A1A1E"/>
  </g>
  <text x="548" y="284" text-anchor="middle" font-size="11" fill="#1A1A1E"><tspan fill="#125C82" font-weight="bold">el</tspan> taxi</text>
  <text x="548" y="297" text-anchor="middle" font-size="9" fill="#6E6C72">taxi</text>

  <!-- ============ the exception: a pie ============ -->
  <rect x="16" y="314" width="608" height="68" rx="8" fill="#F6EAEC" stroke="#A0182A" stroke-width="1.2"/>
  <g transform="translate(70,348)" stroke="#1A1A1E" stroke-linecap="round" fill="none">
    <circle cx="0" cy="-22" r="5.5" fill="#FFFFFF" stroke-width="2"/>
    <g stroke-width="2.6">
      <line x1="0" y1="-16" x2="-1" y2="-2"/>
      <line x1="-1" y1="-2" x2="8" y2="12"/>
      <line x1="-1" y1="-2" x2="-10" y2="12"/>
      <line x1="8" y1="12" x2="14" y2="13"/>
      <line x1="-10" y1="12" x2="-15" y2="13"/>
      <line x1="0" y1="-12" x2="-9" y2="-4"/>
      <line x1="0" y1="-12" x2="8" y2="-6"/>
    </g>
  </g>
  <text x="120" y="336" font-size="12" font-weight="bold" fill="#A0182A">la excepción — ir a pie</text>
  <text x="120" y="352" font-size="9.5" fill="#1A1A1E">Voy a pie al trabajo. <tspan fill="#6E6C72">— I walk to work / I go to work on foot.</tspan></text>
  <text x="120" y="368" font-size="9.5" fill="#1A1A1E">Nunca «ir en pie»: <tspan font-style="italic">en pie</tspan> significa <tspan font-style="italic">standing</tspan>, no es un transporte.</text>
</svg>
