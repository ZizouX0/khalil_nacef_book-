<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 408"><title>el verbo gustar</title><text x="24" y="30" font-family="DejaVu Sans" font-size="14" fill="#9A6207" font-weight="bold">gustar no funciona como “to like”</text><text x="24" y="46" font-family="DejaVu Sans" font-size="10" fill="#57534E">The THING is the subject; the person is an indirect object.</text><rect x="43.56" y="118" width="67.55" height="34" rx="6" fill="#FFFFFF" stroke="#57534E" stroke-width="1.4" stroke-dasharray="4 3"/><text x="77.33" y="139.68" font-family="DejaVu Sans" font-size="13" fill="#57534E" text-anchor="middle" font-weight="bold">(A mí)</text><text x="77.33" y="168" font-family="DejaVu Sans" font-size="10" fill="#9A6207" text-anchor="middle" font-weight="bold">opcional</text><text x="77.33" y="181" font-family="DejaVu Sans" font-size="9.5" fill="#57534E" text-anchor="middle">optional</text><rect x="127.1" y="118" width="139.43" height="34" rx="6" fill="#1F7A68"/><text x="196.82" y="139.68" font-family="DejaVu Sans" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">me</text><text x="196.82" y="168" font-family="DejaVu Sans" font-size="10" fill="#9A6207" text-anchor="middle" font-weight="bold">la persona</text><text x="196.82" y="181" font-family="DejaVu Sans" font-size="9.5" fill="#57534E" text-anchor="middle">me · te · le · nos · os · les</text><rect x="282.53" y="118" width="125.62" height="34" rx="6" fill="#FFFFFF" stroke="#1A1A1E" stroke-width="1.4"/><text x="345.34" y="139.68" font-family="DejaVu Sans" font-size="13" fill="#1A1A1E" text-anchor="middle" font-weight="bold">gusta / gustan</text><text x="345.34" y="168" font-family="DejaVu Sans" font-size="10" fill="#9A6207" text-anchor="middle" font-weight="bold">el verbo</text><text x="345.34" y="181" font-family="DejaVu Sans" font-size="9.5" fill="#57534E" text-anchor="middle">3ª persona</text><rect x="424.16" y="118" width="172.29" height="34" rx="6" fill="#125C82"/><text x="510.3" y="139.68" font-family="DejaVu Sans" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">el cine / las películas</text><text x="510.3" y="168" font-family="DejaVu Sans" font-size="10" fill="#9A6207" text-anchor="middle" font-weight="bold">LA COSA = el sujeto</text><text x="510.3" y="181" font-family="DejaVu Sans" font-size="9.5" fill="#57534E" text-anchor="middle">the thing is the subject</text><path d="M 510.3 112 Q 427.82 92 345.34 112" fill="none" stroke="#125C82" stroke-width="1.6"/><polygon points="345.34,112 350.58,108.14 351.77,113.04" fill="#125C82"/><text x="427.82" y="70" font-family="DejaVu Sans" font-size="10.5" fill="#125C82" text-anchor="middle" font-weight="bold">concuerda con LA COSA</text><text x="427.82" y="82" font-family="DejaVu Sans" font-size="9.5" fill="#57534E" text-anchor="middle">the verb agrees with the thing, not with “me”</text><line x1="24" y1="196" x2="616" y2="196" stroke="#DED8CE" stroke-width="1"/><rect x="24" y="204" width="114.83" height="16.62" rx="8.31" fill="#F4EEE4" stroke="#DFCDB0" stroke-width="1"/><text x="81.41" y="215.73" font-family="DejaVu Sans" font-size="9.5" fill="#9A6207" text-anchor="middle" font-weight="bold">una cosa  →  gusta</text><rect x="24" y="226" width="151.06" height="32" rx="6" fill="#E7EFF2" stroke="#B8CEDA" stroke-width="1"/><rect x="106.99" y="236.21" width="52.23" height="14.17" rx="2.4" fill="#125C82"/><text x="37" y="247" font-family="DejaVu Sans" font-size="13" fill="#1A1A1E" font-weight="bold" xml:space="preserve">Me gusta </text><text x="109.09" y="247" font-family="DejaVu Sans" font-size="13" fill="#FFFFFF" font-weight="bold">el cine</text><text x="157.12" y="247" font-family="DejaVu Sans" font-size="13" fill="#1A1A1E" font-weight="bold">.</text><rect x="63.28" y="251" width="41.29" height="2.4" fill="#1F7A68"/><path d="M 133.11 264 Q 108.51 279 83.92 264" fill="none" stroke="#1F7A68" stroke-width="1.4"/><polygon points="83.92,264 89.28,264.81 87.1,268.4" fill="#1F7A68"/><text x="24" y="296" font-family="DejaVu Sans" font-size="10" fill="#57534E" font-style="italic">I like the cinema.</text><text x="24" y="309" font-family="DejaVu Sans" font-size="9.5" fill="#57534E">literally: the cinema pleases me</text><rect x="330" y="204" width="139.92" height="16.62" rx="8.31" fill="#F4EEE4" stroke="#DFCDB0" stroke-width="1"/><text x="399.96" y="215.73" font-family="DejaVu Sans" font-size="9.5" fill="#9A6207" text-anchor="middle" font-weight="bold">varias cosas  →  gustan</text><rect x="330" y="226" width="202.74" height="32" rx="6" fill="#E7EFF2" stroke="#B8CEDA" stroke-width="1"/><rect x="422.25" y="236.21" width="94.65" height="14.17" rx="2.4" fill="#125C82"/><text x="343" y="247" font-family="DejaVu Sans" font-size="13" fill="#1A1A1E" font-weight="bold" xml:space="preserve">Me gustan </text><text x="424.35" y="247" font-family="DejaVu Sans" font-size="13" fill="#FFFFFF" font-weight="bold">las películas</text><text x="514.8" y="247" font-family="DejaVu Sans" font-size="13" fill="#1A1A1E" font-weight="bold">.</text><rect x="369.28" y="251" width="50.54" height="2.4" fill="#1F7A68"/><path d="M 469.57 264 Q 432.06 279 394.55 264" fill="none" stroke="#1F7A68" stroke-width="1.4"/><polygon points="394.55,264 399.97,263.91 398.41,267.81" fill="#1F7A68"/><text x="330" y="296" font-family="DejaVu Sans" font-size="10" fill="#57534E" font-style="italic">I like films.</text><text x="330" y="309" font-family="DejaVu Sans" font-size="9.5" fill="#57534E">literally: films please me</text><rect x="24" y="322" width="5" height="5" fill="#9A6207"/><text x="36" y="327" font-family="DejaVu Sans" font-size="11" fill="#1A1A1E" font-weight="bold">A mí me gusta el cine.</text><text x="182.74" y="327" font-family="DejaVu Sans" font-size="9.5" fill="#57534E">— “A mí” only adds emphasis or says who; “me” never disappears.</text><rect x="24" y="340" width="592" height="54" rx="8" fill="#F6EAEC" stroke="#A0182A" stroke-width="1.2"/><text x="40" y="364" font-family="DejaVu Sans" font-size="13" fill="#A0182A" font-weight="bold">Yo gusto el cine.</text><line x1="37" y1="359.5" x2="164.81" y2="359.5" stroke="#A0182A" stroke-width="1.8"/><text x="169.81" y="364" font-family="DejaVu Sans" font-size="13" fill="#A0182A" font-weight="bold">✗</text><text x="196.7" y="364" font-family="DejaVu Sans" font-size="13" fill="#3F3F3F">→</text><text x="223.6" y="364" font-family="DejaVu Sans" font-size="13" fill="#1F7A68" font-weight="bold">Me gusta el cine.</text><text x="356.66" y="364" font-family="DejaVu Sans" font-size="13" fill="#1F7A68" font-weight="bold">✓</text><text x="40" y="384" font-family="DejaVu Sans" font-size="9.5" fill="#57534E">“Yo” never does the liking: the person is never the subject of gustar.</text></svg>