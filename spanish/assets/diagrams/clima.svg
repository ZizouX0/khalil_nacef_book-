<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" font-family="DejaVu Sans">
  <!-- EL TIEMPO — grouped by the verb the expression takes, because that is the
       error learners make: hace + noun / está + adjective / hay + noun / bare verb. -->

  <!-- ===== header ===== -->
  <text x="20" y="24" font-size="13" font-weight="bold" fill="#1A1A1E">¿Qué tiempo hace?</text>
  <text x="168" y="24" font-size="10.5" fill="#6E6C72">what's the weather like?</text>
  <text x="620" y="23" text-anchor="end" font-size="9.5" font-style="italic" fill="#6E6C72">Cada expresión lleva su propio verbo.</text>

  <!-- ===== panels ===== -->
  <rect x="16" y="44" width="236" height="262" rx="8" fill="#FFFFFF" stroke="#DED8CE" stroke-width="1.2"/>
  <path d="M 16 52 A 8 8 0 0 1 24 44 L 244 44 A 8 8 0 0 1 252 52 L 252 80 L 16 80 Z" fill="#E7EFF2" stroke="#125C82" stroke-width="1.2" stroke-linejoin="round"/>
  <text x="134" y="64" text-anchor="middle" font-size="13" font-weight="bold" fill="#125C82">hace</text>
  <text x="134" y="75" text-anchor="middle" font-size="9" fill="#125C82">+ sustantivo</text>

  <rect x="264" y="44" width="108" height="262" rx="8" fill="#FFFFFF" stroke="#DED8CE" stroke-width="1.2"/>
  <path d="M 264 52 A 8 8 0 0 1 272 44 L 364 44 A 8 8 0 0 1 372 52 L 372 80 L 264 80 Z" fill="#F4EEE4" stroke="#9A6207" stroke-width="1.2" stroke-linejoin="round"/>
  <text x="318" y="64" text-anchor="middle" font-size="13" font-weight="bold" fill="#9A6207">está</text>
  <text x="318" y="75" text-anchor="middle" font-size="9" fill="#9A6207">+ adjetivo</text>

  <rect x="384" y="44" width="114" height="262" rx="8" fill="#FFFFFF" stroke="#DED8CE" stroke-width="1.2"/>
  <path d="M 384 52 A 8 8 0 0 1 392 44 L 490 44 A 8 8 0 0 1 498 52 L 498 80 L 384 80 Z" fill="#E9F2F0" stroke="#1F7A68" stroke-width="1.2" stroke-linejoin="round"/>
  <text x="441" y="64" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F7A68">hay</text>
  <text x="441" y="75" text-anchor="middle" font-size="9" fill="#1F7A68">+ sustantivo</text>

  <rect x="510" y="44" width="114" height="262" rx="8" fill="#FFFFFF" stroke="#DED8CE" stroke-width="1.2"/>
  <path d="M 510 52 A 8 8 0 0 1 518 44 L 616 44 A 8 8 0 0 1 624 52 L 624 80 L 510 80 Z" fill="#F6EAEC" stroke="#A0182A" stroke-width="1.2" stroke-linejoin="round"/>
  <text x="567" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#A0182A">el verbo solo</text>
  <text x="567" y="75" text-anchor="middle" font-size="9" fill="#A0182A">no lleva hace ni hay</text>

  <!-- ============ hace sol ============ -->
  <g transform="translate(75,126)" stroke="#1A1A1E" stroke-linecap="round">
    <circle cx="0" cy="0" r="13" fill="#F4EEE4" stroke-width="1.6"/>
    <g stroke-width="1.8">
      <line x1="17" y1="0" x2="24" y2="0"/>
      <line x1="12" y1="12" x2="17" y2="17"/>
      <line x1="0" y1="17" x2="0" y2="24"/>
      <line x1="-12" y1="12" x2="-17" y2="17"/>
      <line x1="-17" y1="0" x2="-24" y2="0"/>
      <line x1="-12" y1="-12" x2="-17" y2="-17"/>
      <line x1="0" y1="-17" x2="0" y2="-24"/>
      <line x1="12" y1="-12" x2="17" y2="-17"/>
    </g>
  </g>
  <text x="75" y="176" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A1E">hace sol</text>
  <text x="75" y="189" text-anchor="middle" font-size="9" fill="#6E6C72">it's sunny</text>

  <!-- ============ hace frío ============ -->
  <g transform="translate(193,126)">
    <rect x="-20" y="-24" width="9" height="30" rx="4.5" fill="#FFFFFF" stroke="#1A1A1E" stroke-width="1.4"/>
    <circle cx="-15.5" cy="12" r="8" fill="#FFFFFF" stroke="#1A1A1E" stroke-width="1.4"/>
    <circle cx="-15.5" cy="12" r="5" fill="#125C82"/>
    <rect x="-17.5" y="0" width="4" height="12" fill="#125C82"/>
    <g stroke="#1A1A1E" stroke-width="1.1">
      <line x1="-9" y1="-18" x2="-5" y2="-18"/>
      <line x1="-9" y1="-10" x2="-5" y2="-10"/>
      <line x1="-9" y1="-2" x2="-5" y2="-2"/>
    </g>
    <g stroke="#1A1A1E" stroke-width="1.6" stroke-linecap="round">
      <line x1="5" y1="-4" x2="23" y2="-4"/>
      <line x1="9.5" y1="-11.8" x2="18.5" y2="3.8"/>
      <line x1="18.5" y1="-11.8" x2="9.5" y2="3.8"/>
    </g>
  </g>
  <text x="193" y="176" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A1E">hace frío</text>
  <text x="193" y="189" text-anchor="middle" font-size="9" fill="#6E6C72">it's cold</text>

  <!-- ============ hace calor ============ -->
  <g transform="translate(75,236)">
    <rect x="-20" y="-24" width="9" height="30" rx="4.5" fill="#FFFFFF" stroke="#1A1A1E" stroke-width="1.4"/>
    <circle cx="-15.5" cy="12" r="8" fill="#FFFFFF" stroke="#1A1A1E" stroke-width="1.4"/>
    <circle cx="-15.5" cy="12" r="5" fill="#A0182A"/>
    <rect x="-17.5" y="-21" width="4" height="33" fill="#A0182A"/>
    <g stroke="#1A1A1E" stroke-width="1.1">
      <line x1="-9" y1="-18" x2="-5" y2="-18"/>
      <line x1="-9" y1="-10" x2="-5" y2="-10"/>
      <line x1="-9" y1="-2" x2="-5" y2="-2"/>
    </g>
    <circle cx="14" cy="-6" r="7" fill="#F4EEE4" stroke="#1A1A1E" stroke-width="1.4"/>
    <g stroke="#1A1A1E" stroke-width="1.5" stroke-linecap="round">
      <line x1="14" y1="-16" x2="14" y2="-20"/>
      <line x1="22.5" y1="-11" x2="26" y2="-13"/>
      <line x1="22.5" y1="-1" x2="26" y2="1"/>
      <line x1="14" y1="4" x2="14" y2="8"/>
      <line x1="5.5" y1="-1" x2="2" y2="1"/>
      <line x1="5.5" y1="-11" x2="2" y2="-13"/>
    </g>
  </g>
  <text x="75" y="286" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A1E">hace calor</text>
  <text x="75" y="299" text-anchor="middle" font-size="9" fill="#6E6C72">it's hot</text>

  <!-- ============ hace viento ============ -->
  <g transform="translate(193,236)" fill="none" stroke="#1A1A1E" stroke-width="2" stroke-linecap="round">
    <path d="M -24 -14 C 4 -20 18 -12 10 -6 C 6 -3 2 -7 6 -9"/>
    <path d="M -26 1 C 8 -7 26 3 16 9 C 11 12 6 7 10 4"/>
    <path d="M -20 15 C 0 11 12 15 6 19"/>
  </g>
  <text x="193" y="286" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A1E">hace viento</text>
  <text x="193" y="299" text-anchor="middle" font-size="9" fill="#6E6C72">it's windy</text>

  <!-- ============ está nublado ============ -->
  <g transform="translate(318,126)">
    <path d="M -22 -2 C -29 -2 -30 -11 -23 -13 C -23 -21 -12 -24 -7 -17 C -2 -22 9 -19 8 -11 C 14 -10 13 -2 7 -2 Z" fill="#DED8CE" stroke="#1A1A1E" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M -16 13 C -24 13 -26 3 -18 1 C -18 -9 -4 -12 2 -5 C 8 -11 22 -7 21 2 C 28 3 27 13 20 13 Z" fill="#FFFFFF" stroke="#1A1A1E" stroke-width="1.6" stroke-linejoin="round"/>
  </g>
  <text x="318" y="176" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A1E">está nublado</text>
  <text x="318" y="189" text-anchor="middle" font-size="9" fill="#6E6C72">it's cloudy</text>
  <text x="318" y="216" text-anchor="middle" font-size="9" fill="#9A6207">«nublado» es adjetivo,</text>
  <text x="318" y="228" text-anchor="middle" font-size="9" fill="#9A6207">por eso va con está</text>

  <!-- ============ hay niebla ============ -->
  <g transform="translate(441,126)">
    <path d="M -16 -6 C -23 -6 -24 -15 -17 -17 C -17 -24 -6 -27 -1 -20 C 4 -26 15 -22 14 -14 C 20 -13 19 -6 13 -6 Z" fill="#FFFFFF" stroke="#1A1A1E" stroke-width="1.5" stroke-linejoin="round"/>
    <g stroke="#1A1A1E" stroke-width="2.4" stroke-linecap="round">
      <line x1="-20" y1="2" x2="20" y2="2"/>
      <line x1="-24" y1="9" x2="16" y2="9"/>
      <line x1="-18" y1="16" x2="22" y2="16"/>
      <line x1="-22" y1="23" x2="14" y2="23"/>
    </g>
  </g>
  <text x="441" y="176" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A1E">hay niebla</text>
  <text x="441" y="189" text-anchor="middle" font-size="9" fill="#6E6C72">it's foggy</text>

  <!-- ============ hay tormenta ============ -->
  <g transform="translate(441,236)">
    <path d="M -18 0 C -26 0 -28 -10 -20 -12 C -20 -22 -6 -25 0 -18 C 6 -24 20 -20 19 -11 C 26 -10 25 0 18 0 Z" fill="#DED8CE" stroke="#1A1A1E" stroke-width="1.6" stroke-linejoin="round"/>
    <polygon points="2,2 -9,15 -1,15 -5,26 10,10 2,10" fill="#9A6207" stroke="#1A1A1E" stroke-width="1.2" stroke-linejoin="round"/>
    <g stroke="#1A1A1E" stroke-width="2" stroke-linecap="round">
      <line x1="-15" y1="4" x2="-18" y2="12"/>
      <line x1="16" y1="4" x2="13" y2="12"/>
    </g>
  </g>
  <text x="441" y="286" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A1E">hay tormenta</text>
  <text x="441" y="299" text-anchor="middle" font-size="9" fill="#6E6C72">there's a storm</text>

  <!-- ============ llueve ============ -->
  <g transform="translate(567,126)">
    <path d="M -18 -4 C -26 -4 -28 -14 -20 -16 C -20 -26 -6 -29 0 -22 C 6 -28 20 -24 19 -15 C 26 -14 25 -4 18 -4 Z" fill="#E7EFF2" stroke="#1A1A1E" stroke-width="1.6" stroke-linejoin="round"/>
    <g stroke="#1A1A1E" stroke-width="2.2" stroke-linecap="round">
      <line x1="-12" y1="3" x2="-16" y2="15"/>
      <line x1="-2" y1="6" x2="-6" y2="18"/>
      <line x1="8" y1="3" x2="4" y2="15"/>
      <line x1="17" y1="6" x2="13" y2="18"/>
    </g>
  </g>
  <text x="567" y="176" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A1E">llueve</text>
  <text x="567" y="189" text-anchor="middle" font-size="9" fill="#6E6C72">it's raining · llover</text>

  <!-- ============ nieva ============ -->
  <g transform="translate(567,236)">
    <path d="M -18 -4 C -26 -4 -28 -14 -20 -16 C -20 -26 -6 -29 0 -22 C 6 -28 20 -24 19 -15 C 26 -14 25 -4 18 -4 Z" fill="#FFFFFF" stroke="#1A1A1E" stroke-width="1.6" stroke-linejoin="round"/>
    <g stroke="#1A1A1E" stroke-width="1.5" stroke-linecap="round">
      <line x1="-16" y1="8" x2="-6" y2="8"/><line x1="-13.5" y1="3.7" x2="-8.5" y2="12.3"/><line x1="-8.5" y1="3.7" x2="-13.5" y2="12.3"/>
      <line x1="-4" y1="18" x2="6" y2="18"/><line x1="-1.5" y1="13.7" x2="3.5" y2="22.3"/><line x1="3.5" y1="13.7" x2="-1.5" y2="22.3"/>
      <line x1="8" y1="7" x2="18" y2="7"/><line x1="10.5" y1="2.7" x2="15.5" y2="11.3"/><line x1="15.5" y1="2.7" x2="10.5" y2="11.3"/>
    </g>
  </g>
  <text x="567" y="286" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A1E">nieva</text>
  <text x="567" y="299" text-anchor="middle" font-size="9" fill="#6E6C72">it's snowing · nevar</text>

  <!-- ===== footnote ===== -->
  <line x1="20" y1="322" x2="620" y2="322" stroke="#DED8CE" stroke-width="0.9"/>
  <text x="20" y="338" font-size="9.5" fill="#1A1A1E"><tspan font-weight="bold" fill="#A0182A">Ojo:</tspan> nunca «hace lluvia» ni «hace nieve» — esos dos verbos van solos: <tspan font-weight="bold">llueve</tspan>, <tspan font-weight="bold">nieva</tspan>.</text>
  <text x="20" y="354" font-size="9.5" fill="#1A1A1E">Hoy hace sol pero hace frío, y mañana va a llover. <tspan fill="#6E6C72">— Today it's sunny but cold, and tomorrow it's going to rain.</tspan></text>
</svg>
