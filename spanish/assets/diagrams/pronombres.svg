<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420"><title>Los pronombres de objeto</title><text x="24" y="30" font-family="DejaVu Sans" font-size="14" fill="#9A6207" font-weight="bold">¿Dónde se coloca el pronombre?</text><text x="24" y="46" font-family="DejaVu Sans" font-size="10" fill="#57534E">Object pronouns (lo, la, le, me, te…) have three positions — only three.</text><circle cx="32" cy="95" r="10" fill="#9A6207"/><text x="32" y="99" font-family="DejaVu Sans" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="bold">a</text><text x="50" y="73" font-family="DejaVu Sans" font-size="11.5" fill="#9A6207" font-weight="bold">delante del verbo conjugado</text><text x="244.46" y="73" font-family="DejaVu Sans" font-size="9.5" fill="#57534E">— before a conjugated verb</text><rect x="50" y="80" width="82.97" height="30" rx="6" fill="#E7EFF2" stroke="#B8CEDA" stroke-width="1"/><rect x="60.9" y="88.42" width="22.74" height="15.26" rx="2.4" fill="#125C82"/><text x="63" y="100.04" font-family="DejaVu Sans" font-size="14" fill="#FFFFFF" font-weight="bold">Lo</text><text x="81.54" y="100.04" font-family="DejaVu Sans" font-size="14" fill="#1A1A1E" font-weight="bold" xml:space="preserve"> veo.</text><text x="148.97" y="99" font-family="DejaVu Sans" font-size="10" fill="#57534E" font-style="italic">I can see it. / I can see him.</text><circle cx="32" cy="157" r="10" fill="#9A6207"/><text x="32" y="161" font-family="DejaVu Sans" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="bold">b</text><text x="50" y="135" font-family="DejaVu Sans" font-size="11.5" fill="#9A6207" font-weight="bold">con infinitivo o gerundio</text><text x="218.01" y="135" font-family="DejaVu Sans" font-size="9.5" fill="#57534E">— two positions, both correct</text><rect x="50" y="142" width="160.29" height="30" rx="6" fill="#E7EFF2" stroke="#B8CEDA" stroke-width="1"/><rect x="175.46" y="150.42" width="18.62" height="15.26" rx="2.4" fill="#125C82"/><text x="63" y="162.04" font-family="DejaVu Sans" font-size="14" fill="#1A1A1E" font-weight="bold">Voy a comprar</text><text x="177.56" y="162.04" font-family="DejaVu Sans" font-size="14" fill="#FFFFFF" font-weight="bold">lo</text><text x="191.97" y="162.04" font-family="DejaVu Sans" font-size="14" fill="#1A1A1E" font-weight="bold">.</text><text x="224.29" y="163" font-family="DejaVu Sans" font-size="14" fill="#3F3F3F" font-weight="bold">=</text><rect x="250.02" y="142" width="167.58" height="30" rx="6" fill="#E7EFF2" stroke="#B8CEDA" stroke-width="1"/><rect x="260.92" y="150.42" width="22.74" height="15.26" rx="2.4" fill="#125C82"/><text x="263.02" y="162.04" font-family="DejaVu Sans" font-size="14" fill="#FFFFFF" font-weight="bold">Lo</text><text x="281.56" y="162.04" font-family="DejaVu Sans" font-size="14" fill="#1A1A1E" font-weight="bold" xml:space="preserve"> voy a comprar.</text><text x="433.6" y="163" font-family="DejaVu Sans" font-size="10" fill="#57534E" font-style="italic">I am going to buy it.</text><text x="50" y="190" font-family="DejaVu Sans" font-size="9.5" fill="#57534E">gerundio:</text><rect x="101.41" y="180.87" width="18.77" height="11.99" rx="2.4" fill="#125C82"/><text x="103.51" y="190" font-family="DejaVu Sans" font-size="11" fill="#FFFFFF" font-weight="bold">Lo</text><text x="118.07" y="190" font-family="DejaVu Sans" font-size="11" fill="#1A1A1E" font-weight="bold" xml:space="preserve"> estoy haciendo.</text><text x="230.17" y="190" font-family="DejaVu Sans" font-size="11" fill="#3F3F3F" font-weight="bold">=</text><rect x="341.43" y="180.87" width="15.53" height="11.99" rx="2.4" fill="#125C82"/><text x="249.39" y="190" font-family="DejaVu Sans" font-size="11" fill="#1A1A1E" font-weight="bold">Estoy haciéndo</text><text x="343.53" y="190" font-family="DejaVu Sans" font-size="11" fill="#FFFFFF" font-weight="bold">lo</text><text x="354.86" y="190" font-family="DejaVu Sans" font-size="11" fill="#1A1A1E" font-weight="bold">.</text><text x="369.04" y="190" font-family="DejaVu Sans" font-size="9.5" fill="#57534E" font-style="italic">I am doing it.</text><circle cx="32" cy="235" r="10" fill="#9A6207"/><text x="32" y="239" font-family="DejaVu Sans" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="bold">c</text><text x="50" y="213" font-family="DejaVu Sans" font-size="11.5" fill="#9A6207" font-weight="bold">con el imperativo</text><text x="171.88" y="213" font-family="DejaVu Sans" font-size="9.5" fill="#57534E">— attached when YES, in front when NO</text><rect x="50" y="220" width="114.04" height="30" rx="6" fill="#E7EFF2" stroke="#B8CEDA" stroke-width="1"/><rect x="128.14" y="228.42" width="18.62" height="15.26" rx="2.4" fill="#125C82"/><text x="63" y="240.04" font-family="DejaVu Sans" font-size="14" fill="#1A1A1E" font-weight="bold">¡Cómpra</text><text x="130.24" y="240.04" font-family="DejaVu Sans" font-size="14" fill="#FFFFFF" font-weight="bold">lo</text><text x="144.66" y="240.04" font-family="DejaVu Sans" font-size="14" fill="#1A1A1E" font-weight="bold">!</text><text x="50" y="264" font-family="DejaVu Sans" font-size="9.5" fill="#9A6207" font-weight="bold">afirmativo → unido detrás</text><text x="50" y="277" font-family="DejaVu Sans" font-size="9.5" fill="#57534E" font-style="italic">Buy it!</text><rect x="330" y="220" width="144.08" height="30" rx="6" fill="#E7EFF2" stroke="#B8CEDA" stroke-width="1"/><rect x="367.11" y="228.42" width="18.62" height="15.26" rx="2.4" fill="#125C82"/><text x="343" y="240.04" font-family="DejaVu Sans" font-size="14" fill="#1A1A1E" font-weight="bold" xml:space="preserve">No </text><text x="369.21" y="240.04" font-family="DejaVu Sans" font-size="14" fill="#FFFFFF" font-weight="bold">lo</text><text x="383.63" y="240.04" font-family="DejaVu Sans" font-size="14" fill="#1A1A1E" font-weight="bold" xml:space="preserve"> compres.</text><text x="330" y="264" font-family="DejaVu Sans" font-size="9.5" fill="#9A6207" font-weight="bold">negativo → delante, separado</text><text x="330" y="277" font-family="DejaVu Sans" font-size="9.5" fill="#57534E" font-style="italic">Do not buy it.</text><polygon points="30,288 36.5,300 23.5,300" fill="#A0182A"/><text x="42" y="300" font-family="DejaVu Sans" font-size="10" fill="#A0182A" font-weight="bold">Ojo:</text><text x="71.8" y="300" font-family="DejaVu Sans" font-size="9.5" fill="#57534E">al unir el pronombre, el verbo suele llevar tilde —  compra → cómpralo  ·  haciendo → haciéndolo</text><rect x="24" y="312" width="592" height="96" rx="8" fill="#F4EEE4" stroke="#9A6207" stroke-width="1.2"/><text x="40" y="334" font-family="DejaVu Sans" font-size="11.5" fill="#9A6207" font-weight="bold">dos pronombres juntos</text><text x="198.97" y="334" font-family="DejaVu Sans" font-size="9.5" fill="#57534E">— indirect first, then direct</text><rect x="40" y="344" width="176" height="36" rx="5" fill="#FFFFFF" stroke="#DFCDB0" stroke-width="1"/><text x="49" y="357" font-family="DejaVu Sans" font-size="9.5" fill="#9A6207" font-weight="bold">1º · indirecto</text><text x="49" y="373" font-family="DejaVu Sans" font-size="10.5" fill="#1A1A1E" font-weight="bold" xml:space="preserve">me · te · </text><text x="101.8" y="373" font-family="DejaVu Sans" font-size="10.5" fill="#A0182A" font-weight="bold">le</text><rect x="101.8" y="376.5" width="10.72" height="1.4" fill="#A0182A"/><text x="112.52" y="373" font-family="DejaVu Sans" font-size="10.5" fill="#1A1A1E" font-weight="bold" xml:space="preserve"> · nos · os · </text><text x="180.82" y="373" font-family="DejaVu Sans" font-size="10.5" fill="#A0182A" font-weight="bold">les</text><rect x="180.82" y="376.5" width="16.97" height="1.4" fill="#A0182A"/><rect x="224" y="344" width="112" height="36" rx="5" fill="#FFFFFF" stroke="#DFCDB0" stroke-width="1"/><text x="233" y="357" font-family="DejaVu Sans" font-size="9.5" fill="#9A6207" font-weight="bold">2º · directo</text><text x="233" y="373" font-family="DejaVu Sans" font-size="10.5" fill="#1A1A1E" font-weight="bold">lo · la · los · las</text><text x="40" y="398" font-family="DejaVu Sans" font-size="11" fill="#1A1A1E" font-weight="bold">Me lo da.</text><text x="105.87" y="398" font-family="DejaVu Sans" font-size="9.5" fill="#57534E" font-style="italic">— He gives it to me.</text><line x1="354" y1="344" x2="354" y2="398" stroke="#DFCDB0" stroke-width="1"/><text x="368" y="360" font-family="DejaVu Sans" font-size="12" fill="#A0182A" font-weight="bold">le lo doy</text><line x1="366" y1="356" x2="427.62" y2="356" stroke="#A0182A" stroke-width="1.6"/><text x="432.62" y="360" font-family="DejaVu Sans" font-size="12" fill="#A0182A" font-weight="bold">✗</text><text x="454.68" y="360" font-family="DejaVu Sans" font-size="12" fill="#3F3F3F">→</text><text x="476.73" y="360" font-family="DejaVu Sans" font-size="12" fill="#1F7A68" font-weight="bold">se lo doy</text><text x="544.38" y="360" font-family="DejaVu Sans" font-size="12" fill="#1F7A68" font-weight="bold">✓</text><text x="368" y="378" font-family="DejaVu Sans" font-size="9.5" fill="#57534E">le / les → se delante de lo, la, los, las</text><text x="368" y="398" font-family="DejaVu Sans" font-size="11" fill="#1A1A1E" font-weight="bold">Se lo doy a Ana.</text><text x="477" y="398" font-family="DejaVu Sans" font-size="9.5" fill="#57534E" font-style="italic">— I give it to her.</text></svg>