<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420"><title>ser o estar</title><text x="24" y="30" font-family="DejaVu Sans" font-size="13.5" fill="#9A6207" font-weight="bold">ser o estar: la misma palabra, dos significados</text><text x="24" y="46" font-family="DejaVu Sans" font-size="10" fill="#57534E">Same adjective. Change the verb and you change the meaning.</text><rect x="24" y="62" width="252" height="34" fill="#125C82"/><text x="42" y="84" font-family="DejaVu Sans" font-size="13" fill="#FFFFFF" font-weight="bold">SER</text><text x="80.25" y="84" font-family="DejaVu Sans" font-size="9.5" fill="#FFFFFF">identidad — what it IS, always</text><rect x="250" y="75" width="16" height="2.4" fill="#FFFFFF"/><rect x="250" y="81" width="16" height="2.4" fill="#FFFFFF"/><rect x="364" y="62" width="252" height="34" rx="17" fill="#1F7A68"/><text x="384" y="84" font-family="DejaVu Sans" font-size="13" fill="#FFFFFF" font-weight="bold">ESTAR</text><text x="441.18" y="84" font-family="DejaVu Sans" font-size="9.5" fill="#FFFFFF">estado — how it IS right now</text><circle cx="594" cy="79" r="9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/><line x1="594" y1="79" x2="594" y2="73.5" stroke="#FFFFFF" stroke-width="1.6"/><line x1="594" y1="79" x2="598" y2="81" stroke="#FFFFFF" stroke-width="1.6"/><text x="320" y="84" font-family="DejaVu Sans" font-size="9.5" fill="#57534E" text-anchor="middle">el adjetivo</text><circle cx="48" cy="126" r="15" fill="#E7EFF2" stroke="#B8CEDA" stroke-width="1"/><rect x="40" y="119" width="16" height="11" rx="3" fill="none" stroke="#125C82" stroke-width="1.3"/><polygon points="44,130 47,134 49,130" fill="#125C82"/><line x1="43" y1="124.5" x2="53" y2="124.5" stroke="#125C82" stroke-width="1.3"/><text x="72" y="123" font-family="DejaVu Sans" font-size="12" fill="#1A1A1E" font-weight="bold">es aburrido</text><text x="72" y="139" font-family="DejaVu Sans" font-size="9.5" fill="#57534E">aburre a los demás — he is boring</text><rect x="281" y="112" width="78" height="26" rx="13" fill="#FFFFFF" stroke="#DED8CE" stroke-width="1.2"/><text x="320" y="129" font-family="DejaVu Sans" font-size="11" fill="#1A1A1E" text-anchor="middle" font-weight="bold">aburrido/a</text><circle cx="388" cy="126" r="15" fill="#E9F2F0" stroke="#BCD7D2" stroke-width="1"/><circle cx="388" cy="126" r="8" fill="none" stroke="#1F7A68" stroke-width="1.3"/><circle cx="385" cy="123.5" r="1.1" fill="#1F7A68"/><circle cx="391" cy="123.5" r="1.1" fill="#1F7A68"/><ellipse cx="388" cy="129.2" rx="3" ry="3.6" fill="none" stroke="#1F7A68" stroke-width="1.3"/><text x="412" y="123" font-family="DejaVu Sans" font-size="12" fill="#1A1A1E" font-weight="bold">está aburrido</text><text x="412" y="139" font-family="DejaVu Sans" font-size="9.5" fill="#57534E">se aburre ahora — he is bored</text><line x1="24" y1="151" x2="616" y2="151" stroke="#DED8CE" stroke-width="0.8"/><circle cx="48" cy="180" r="15" fill="#E7EFF2" stroke="#B8CEDA" stroke-width="1"/><circle cx="48" cy="178" r="5.5" fill="none" stroke="#125C82" stroke-width="1.3"/><rect x="45.4" y="183.6" width="5.2" height="4" rx="1" fill="#125C82"/><line x1="48" y1="169.5" x2="48" y2="171.4" stroke="#125C82" stroke-width="1.2"/><line x1="40.4" y1="173.4" x2="42.1" y2="174.4" stroke="#125C82" stroke-width="1.2"/><line x1="55.6" y1="173.4" x2="53.9" y2="174.4" stroke="#125C82" stroke-width="1.2"/><text x="72" y="177" font-family="DejaVu Sans" font-size="12" fill="#1A1A1E" font-weight="bold">es listo</text><text x="72" y="193" font-family="DejaVu Sans" font-size="9.5" fill="#57534E">es inteligente — he is clever</text><rect x="281" y="166" width="78" height="26" rx="13" fill="#FFFFFF" stroke="#DED8CE" stroke-width="1.2"/><text x="320" y="183" font-family="DejaVu Sans" font-size="11" fill="#1A1A1E" text-anchor="middle" font-weight="bold">listo/a</text><circle cx="388" cy="180" r="15" fill="#E9F2F0" stroke="#BCD7D2" stroke-width="1"/><polyline points="381.5,180 386,185 395,174" fill="none" stroke="#1F7A68" stroke-width="2.2"/><text x="412" y="177" font-family="DejaVu Sans" font-size="12" fill="#1A1A1E" font-weight="bold">está listo</text><text x="412" y="193" font-family="DejaVu Sans" font-size="9.5" fill="#57534E">está preparado — he is ready</text><line x1="24" y1="205" x2="616" y2="205" stroke="#DED8CE" stroke-width="0.8"/><circle cx="48" cy="234" r="15" fill="#E7EFF2" stroke="#B8CEDA" stroke-width="1"/><polygon points="48,225.8 50.12,231.09 55.8,231.47 51.42,235.11 52.82,240.63 48,237.6 43.18,240.63 44.58,235.11 40.2,231.47 45.88,231.09" fill="#125C82"/><text x="72" y="231" font-family="DejaVu Sans" font-size="12" fill="#1A1A1E" font-weight="bold">es guapo</text><text x="72" y="247" font-family="DejaVu Sans" font-size="9.5" fill="#57534E">es atractivo siempre — good-looking</text><rect x="281" y="220" width="78" height="26" rx="13" fill="#FFFFFF" stroke="#DED8CE" stroke-width="1.2"/><text x="320" y="237" font-family="DejaVu Sans" font-size="11" fill="#1A1A1E" text-anchor="middle" font-weight="bold">guapo/a</text><circle cx="388" cy="234" r="15" fill="#E9F2F0" stroke="#BCD7D2" stroke-width="1"/><polygon points="380,229 386.4,234 380,239" fill="none" stroke="#1F7A68" stroke-width="1.3"/><polygon points="396,229 389.6,234 396,239" fill="none" stroke="#1F7A68" stroke-width="1.3"/><circle cx="388" cy="234" r="2" fill="#1F7A68"/><text x="412" y="231" font-family="DejaVu Sans" font-size="12" fill="#1A1A1E" font-weight="bold">está guapo</text><text x="412" y="247" font-family="DejaVu Sans" font-size="9.5" fill="#57534E">está muy bien hoy — looks great today</text><line x1="24" y1="259" x2="616" y2="259" stroke="#DED8CE" stroke-width="0.8"/><circle cx="48" cy="288" r="15" fill="#E7EFF2" stroke="#B8CEDA" stroke-width="1"/><path d="M 41 293 Q 40 281 55 282 Q 54 294 41 293 Z" fill="none" stroke="#125C82" stroke-width="1.3"/><line x1="42" y1="292" x2="53" y2="283" stroke="#125C82" stroke-width="1.1"/><text x="72" y="285" font-family="DejaVu Sans" font-size="12" fill="#1A1A1E" font-weight="bold">es verde</text><text x="72" y="301" font-family="DejaVu Sans" font-size="9.5" fill="#57534E">de color verde — it is green</text><rect x="281" y="274" width="78" height="26" rx="13" fill="#FFFFFF" stroke="#DED8CE" stroke-width="1.2"/><text x="320" y="291" font-family="DejaVu Sans" font-size="11" fill="#1A1A1E" text-anchor="middle" font-weight="bold">verde</text><circle cx="388" cy="288" r="15" fill="#E9F2F0" stroke="#BCD7D2" stroke-width="1"/><path d="M 379 286 Q 381 295 389 295.5 Q 396 295 397 285 Q 394 291.5 388.5 292 Q 382 291.5 379 286 Z" fill="none" stroke="#1F7A68" stroke-width="1.3"/><line x1="397" y1="285" x2="398.5" y2="282.5" stroke="#1F7A68" stroke-width="1.3"/><text x="412" y="285" font-family="DejaVu Sans" font-size="12" fill="#1A1A1E" font-weight="bold">está verde</text><text x="412" y="301" font-family="DejaVu Sans" font-size="9.5" fill="#57534E">no está maduro — it is unripe</text><line x1="24" y1="313" x2="616" y2="313" stroke="#DED8CE" stroke-width="0.8"/><circle cx="48" cy="342" r="15" fill="#E7EFF2" stroke="#B8CEDA" stroke-width="1"/><polygon points="48,334 56.5,348.5 39.5,348.5" fill="none" stroke="#125C82" stroke-width="1.3"/><text x="48" y="347" font-family="DejaVu Sans" font-size="10" fill="#125C82" text-anchor="middle" font-weight="bold">!</text><text x="72" y="339" font-family="DejaVu Sans" font-size="12" fill="#1A1A1E" font-weight="bold">es malo</text><text x="72" y="355" font-family="DejaVu Sans" font-size="9.5" fill="#57534E">es mala persona — he is bad</text><rect x="281" y="328" width="78" height="26" rx="13" fill="#FFFFFF" stroke="#DED8CE" stroke-width="1.2"/><text x="320" y="345" font-family="DejaVu Sans" font-size="11" fill="#1A1A1E" text-anchor="middle" font-weight="bold">malo/a</text><circle cx="388" cy="342" r="15" fill="#E9F2F0" stroke="#BCD7D2" stroke-width="1"/><rect x="385.8" y="334" width="4.4" height="10" rx="2.2" fill="none" stroke="#1F7A68" stroke-width="1.3"/><circle cx="388" cy="346.4" r="4" fill="#1F7A68"/><line x1="391.6" y1="337" x2="394" y2="337" stroke="#1F7A68" stroke-width="1"/><line x1="391.6" y1="340.5" x2="394" y2="340.5" stroke="#1F7A68" stroke-width="1"/><text x="412" y="339" font-family="DejaVu Sans" font-size="12" fill="#1A1A1E" font-weight="bold">está malo</text><text x="412" y="355" font-family="DejaVu Sans" font-size="9.5" fill="#57534E">está enfermo — he is ill</text><line x1="24" y1="378" x2="616" y2="378" stroke="#9A6207" stroke-width="1.2"/><text x="320" y="396" font-family="DejaVu Sans" font-size="11.5" fill="#9A6207" text-anchor="middle" font-weight="bold">SER = lo que algo es  ·  ESTAR = cómo está ahora</text><text x="320" y="410" font-family="DejaVu Sans" font-size="9.5" fill="#57534E" text-anchor="middle">permanent identity  vs  current state</text></svg>