<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="DejaVu Sans">
  <!-- EL BARRIO — street plan seen from above + direction phrases drawn on the streets.
       Route: solid crimson = the instruction given; dashed ochre = the alternative turn.
       Double-headed blue arrows = position phrases (enfrente de / al lado de).
       All arrowheads are polygon triangles; no marker elements are used. -->

  <!-- ===== header ===== -->
  <text x="20" y="24" font-size="13" font-weight="bold" fill="#1A1A1E">El barrio</text>
  <text x="96" y="24" font-size="10.5" fill="#6E6C72">Perdone, ¿dónde está la farmacia?</text>
  <text x="620" y="23" text-anchor="end" font-size="9.5" font-style="italic" fill="#6E6C72">— Todo recto y la primera a la derecha.</text>

  <!-- ===== map frame ===== -->
  <rect x="16" y="44" width="608" height="334" rx="6" fill="#FFFFFF" stroke="#DED8CE" stroke-width="1.2"/>

  <!-- ===== street surfaces ===== -->
  <rect x="16" y="138" width="608" height="36" fill="#F4EEE4"/>
  <rect x="16" y="276" width="608" height="36" fill="#F4EEE4"/>
  <rect x="196" y="44" width="40" height="334" fill="#F4EEE4"/>

  <!-- ===== kerb lines (broken at the junctions) ===== -->
  <g stroke="#DED8CE" stroke-width="1.2">
    <line x1="16" y1="138" x2="196" y2="138"/><line x1="236" y1="138" x2="624" y2="138"/>
    <line x1="16" y1="174" x2="196" y2="174"/><line x1="236" y1="174" x2="624" y2="174"/>
    <line x1="16" y1="276" x2="196" y2="276"/><line x1="236" y1="276" x2="624" y2="276"/>
    <line x1="16" y1="312" x2="196" y2="312"/><line x1="236" y1="312" x2="624" y2="312"/>
    <line x1="196" y1="44" x2="196" y2="138"/><line x1="196" y1="174" x2="196" y2="276"/><line x1="196" y1="312" x2="196" y2="378"/>
    <line x1="236" y1="44" x2="236" y2="138"/><line x1="236" y1="174" x2="236" y2="276"/><line x1="236" y1="312" x2="236" y2="378"/>
  </g>

  <!-- ================= BUILDINGS ================= -->

  <!-- el museo -->
  <rect x="40" y="56" width="130" height="70" rx="2" fill="#F6EAEC" stroke="#1A1A1E" stroke-width="1.3"/>
  <text x="105" y="76" text-anchor="middle" font-size="11" fill="#1A1A1E"><tspan fill="#125C82" font-weight="bold">el</tspan> museo</text>
  <g transform="translate(105,104)">
    <polygon points="-27,-6 0,-18 27,-6" fill="#DED8CE" stroke="#1A1A1E" stroke-width="1.2" stroke-linejoin="round"/>
    <rect x="-22" y="-6" width="6" height="15" fill="#FFFFFF" stroke="#1A1A1E" stroke-width="1.1"/>
    <rect x="-10" y="-6" width="6" height="15" fill="#FFFFFF" stroke="#1A1A1E" stroke-width="1.1"/>
    <rect x="4" y="-6" width="6" height="15" fill="#FFFFFF" stroke="#1A1A1E" stroke-width="1.1"/>
    <rect x="16" y="-6" width="6" height="15" fill="#FFFFFF" stroke="#1A1A1E" stroke-width="1.1"/>
    <rect x="-29" y="9" width="58" height="4" fill="#DED8CE" stroke="#1A1A1E" stroke-width="1.1"/>
  </g>

  <!-- el parque -->
  <rect x="260" y="54" width="350" height="72" rx="8" fill="#E9F2F0" stroke="#1A1A1E" stroke-width="1.3"/>
  <text x="274" y="74" font-size="11" fill="#1A1A1E"><tspan fill="#125C82" font-weight="bold">el</tspan> parque</text>
  <path d="M 270 112 C 330 98 380 118 440 108 C 500 98 550 118 600 108" fill="none" stroke="#DED8CE" stroke-width="5" stroke-linecap="round"/>
  <g stroke="#1A1A1E" stroke-width="1.2">
    <line x1="306" y1="103" x2="306" y2="110"/><circle cx="306" cy="94" r="9" fill="#FFFFFF"/>
    <line x1="352" y1="119" x2="352" y2="124"/><circle cx="352" cy="110" r="9" fill="#FFFFFF"/>
    <line x1="470" y1="103" x2="470" y2="110"/><circle cx="470" cy="94" r="9" fill="#FFFFFF"/>
    <line x1="516" y1="119" x2="516" y2="124"/><circle cx="516" cy="110" r="9" fill="#FFFFFF"/>
    <line x1="582" y1="105" x2="582" y2="112"/><circle cx="582" cy="96" r="9" fill="#FFFFFF"/>
  </g>

  <!-- la farmacia -->
  <rect x="30" y="186" width="150" height="80" rx="2" fill="#E9F2F0" stroke="#1A1A1E" stroke-width="1.3"/>
  <text x="105" y="206" text-anchor="middle" font-size="11" fill="#1A1A1E"><tspan fill="#A62466" font-weight="bold">la</tspan> farmacia</text>
  <polygon points="100.5,223 109.5,223 109.5,233.5 120,233.5 120,242.5 109.5,242.5 109.5,253 100.5,253 100.5,242.5 90,242.5 90,233.5 100.5,233.5" fill="#1F7A68" stroke="#1A1A1E" stroke-width="1.1" stroke-linejoin="round"/>

  <!-- el supermercado -->
  <rect x="250" y="186" width="150" height="80" rx="2" fill="#E7EFF2" stroke="#1A1A1E" stroke-width="1.3"/>
  <text x="325" y="206" text-anchor="middle" font-size="11" fill="#1A1A1E"><tspan fill="#125C82" font-weight="bold">el</tspan> supermercado</text>
  <g transform="translate(330,238)">
    <polyline points="-24,-15 -19,-15 -14,-9" fill="none" stroke="#1A1A1E" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>
    <polygon points="-14,-9 14,-9 10,4 -10,4" fill="#FFFFFF" stroke="#1A1A1E" stroke-width="1.3" stroke-linejoin="round"/>
    <line x1="-5" y1="-9" x2="-4" y2="4" stroke="#1A1A1E" stroke-width="0.9"/>
    <line x1="4" y1="-9" x2="3" y2="4" stroke="#1A1A1E" stroke-width="0.9"/>
    <circle cx="-6" cy="9" r="2.6" fill="#1A1A1E"/>
    <circle cx="7" cy="9" r="2.6" fill="#1A1A1E"/>
  </g>

  <!-- el banco -->
  <rect x="456" y="186" width="154" height="80" rx="2" fill="#F6EAEC" stroke="#1A1A1E" stroke-width="1.3"/>
  <text x="533" y="206" text-anchor="middle" font-size="11" fill="#1A1A1E"><tspan fill="#125C82" font-weight="bold">el</tspan> banco</text>
  <circle cx="533" cy="238" r="13" fill="#FFFFFF" stroke="#1A1A1E" stroke-width="1.3"/>
  <text x="533" y="243" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A1A1E">€</text>

  <!-- la estación de metro -->
  <rect x="34" y="320" width="144" height="52" rx="2" fill="#E7EFF2" stroke="#1A1A1E" stroke-width="1.3"/>
  <text x="106" y="338" text-anchor="middle" font-size="10.5" fill="#1A1A1E"><tspan fill="#A62466" font-weight="bold">la</tspan> estación de metro</text>
  <circle cx="86" cy="357" r="9" fill="#FFFFFF" stroke="#1A1A1E" stroke-width="1.4"/>
  <text x="86" y="361" text-anchor="middle" font-size="12" font-weight="bold" fill="#1A1A1E">M</text>
  <g stroke="#1A1A1E" stroke-width="1.4">
    <line x1="104" y1="350" x2="126" y2="350"/>
    <line x1="104" y1="357" x2="126" y2="357"/>
    <line x1="104" y1="364" x2="126" y2="364"/>
  </g>

  <!-- la plaza -->
  <rect x="470" y="316" width="142" height="58" rx="2" fill="#E9F2F0" stroke="#1A1A1E" stroke-width="1.3"/>
  <text x="541" y="334" text-anchor="middle" font-size="11" fill="#1A1A1E"><tspan fill="#A62466" font-weight="bold">la</tspan> plaza</text>
  <rect x="493" y="353" width="12" height="5" fill="#DED8CE" stroke="#1A1A1E" stroke-width="1"/>
  <rect x="577" y="353" width="12" height="5" fill="#DED8CE" stroke="#1A1A1E" stroke-width="1"/>
  <circle cx="541" cy="356" r="11" fill="#E7EFF2" stroke="#1A1A1E" stroke-width="1.3"/>
  <circle cx="541" cy="356" r="4" fill="#FFFFFF" stroke="#1A1A1E" stroke-width="1.1"/>

  <!-- la parada de autobús (on the corner) -->
  <polyline points="236,348 236,312 278,312" fill="none" stroke="#9A6207" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(277,337)">
    <rect x="-22" y="-17" width="44" height="6" fill="#DED8CE" stroke="#1A1A1E" stroke-width="1.2"/>
    <rect x="-20" y="-11" width="40" height="20" fill="#FFFFFF" stroke="#1A1A1E" stroke-width="1.2"/>
    <rect x="-15" y="-7" width="30" height="12" rx="3" fill="#E7EFF2" stroke="#1A1A1E" stroke-width="1.1"/>
    <rect x="-12" y="-4" width="5" height="5" fill="#FFFFFF" stroke="#1A1A1E" stroke-width="0.9"/>
    <rect x="-4" y="-4" width="5" height="5" fill="#FFFFFF" stroke="#1A1A1E" stroke-width="0.9"/>
    <rect x="4" y="-4" width="5" height="5" fill="#FFFFFF" stroke="#1A1A1E" stroke-width="0.9"/>
    <circle cx="-8" cy="6" r="2" fill="#1A1A1E"/>
    <circle cx="8" cy="6" r="2" fill="#1A1A1E"/>
    <line x1="-20" y1="9" x2="-20" y2="15" stroke="#1A1A1E" stroke-width="1.4"/>
    <line x1="20" y1="9" x2="20" y2="15" stroke="#1A1A1E" stroke-width="1.4"/>
  </g>
  <text x="306" y="331" font-size="10.5" fill="#1A1A1E"><tspan fill="#A62466" font-weight="bold">la</tspan> parada de autobús</text>

  <!-- ================= POSITION PHRASES ================= -->

  <!-- enfrente de : el museo <-> el parque, across the vertical street -->
  <line x1="183" y1="104" x2="247" y2="104" stroke="#125C82" stroke-width="2"/>
  <polygon points="172,104 184,99 184,109" fill="#125C82"/>
  <polygon points="258,104 246,99 246,109" fill="#125C82"/>
  <rect x="175" y="67" width="82" height="18" rx="9" fill="#FFFFFF" stroke="#125C82" stroke-width="1.2"/>
  <text x="216" y="79.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#125C82">enfrente de</text>

  <!-- al lado de : el supermercado <-> el banco -->
  <line x1="412" y1="250" x2="444" y2="250" stroke="#125C82" stroke-width="2"/>
  <polygon points="402,250 414,245 414,255" fill="#125C82"/>
  <polygon points="454,250 442,245 442,255" fill="#125C82"/>
  <rect x="390" y="213" width="76" height="18" rx="9" fill="#FFFFFF" stroke="#125C82" stroke-width="1.2"/>
  <text x="428" y="225.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#125C82">al lado de</text>

  <!-- en la esquina : points back to the bus stop on the corner -->
  <line x1="322" y1="355" x2="302" y2="355" stroke="#9A6207" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="324" y="346" width="84" height="18" rx="9" fill="#FFFFFF" stroke="#9A6207" stroke-width="1.2"/>
  <text x="366" y="358.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#9A6207">en la esquina</text>

  <!-- ================= THE ROUTE ================= -->

  <!-- alternative: carry on and take the second street on the left (dashed) -->
  <polyline points="210,294 210,156 152,156" fill="none" stroke="#9A6207" stroke-width="2.4" stroke-dasharray="8 6" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="138,156 153,150 153,162" fill="#9A6207"/>
  <rect x="28" y="147" width="100" height="18" rx="9" fill="#FFFFFF" stroke="#9A6207" stroke-width="1.2"/>
  <text x="78" y="159.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#9A6207">a la izquierda</text>

  <!-- main route: straight on, then first right (solid) -->
  <polyline points="210,354 210,294 336,294" fill="none" stroke="#A0182A" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="350,294 334,288 334,300" fill="#A0182A"/>
  <g transform="translate(228,326) rotate(-90)">
    <text x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#A0182A">todo recto</text>
  </g>
  <rect x="356" y="285" width="88" height="18" rx="9" fill="#FFFFFF" stroke="#A0182A" stroke-width="1.2"/>
  <text x="400" y="297.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#A0182A">a la derecha</text>
  <rect x="44" y="285" width="112" height="18" rx="9" fill="#FFFFFF" stroke="#A0182A" stroke-width="1.2"/>
  <text x="100" y="297.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#A0182A">la primera calle</text>

  <!-- start point -->
  <circle cx="210" cy="354" r="4.5" fill="#A0182A" stroke="#FFFFFF" stroke-width="1.2"/>
  <rect x="178" y="357" width="76" height="18" rx="9" fill="#FFFFFF" stroke="#1A1A1E" stroke-width="1.2"/>
  <text x="216" y="369.5" text-anchor="middle" font-size="10" fill="#1A1A1E">Estás aquí</text>

  <!-- ===== legend ===== -->
  <line x1="20" y1="390" x2="620" y2="390" stroke="#DED8CE" stroke-width="0.9"/>
  <text x="20" y="406" font-size="9.5" fill="#1A1A1E"><tspan font-weight="bold">a la derecha</tspan> = right · <tspan font-weight="bold">a la izquierda</tspan> = left · <tspan font-weight="bold">todo recto</tspan> = straight on · <tspan font-weight="bold">la primera calle</tspan> = the first street</text>
  <text x="20" y="422" font-size="9.5" fill="#1A1A1E"><tspan font-weight="bold">enfrente de</tspan> = opposite · <tspan font-weight="bold">al lado de</tspan> = next to · <tspan font-weight="bold">en la esquina</tspan> = on the corner</text>
  <text x="620" y="422" text-anchor="end" font-size="9.5" font-style="italic" fill="#6E6C72">«Está en la esquina.»</text>
</svg>
