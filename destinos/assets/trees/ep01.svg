    <path d="M266 26 H313"/>
    <!-- their children -->
    <path d="M289 26 V84 M140 84 H440 M140 84 V94 M240 84 V94 M340 84 V94 M440 84 V94"/>
  </g>
  <g font-family="Charis" font-size="13" font-weight="700" fill="#1d1b18" text-anchor="middle">
    <text x="70" y="30">Rosario</text>
    <text x="215" y="30" fill="#a63d2a">don Fernando</text>
    <text x="345" y="30">Carmen</text>
    <text x="455" y="30">Pedro</text>
    <text x="140" y="110" font-weight="400">Ramón</text>
    <text x="240" y="110" font-weight="400">Carlos</text>
    <text x="340" y="110" font-weight="400">Juan</text>
    <text x="440" y="110" font-weight="400">Mercedes</text>
  </g>
  <g font-family="Plex" font-size="7.2" font-weight="500" fill="#6d665c" text-anchor="middle" letter-spacing="0.9">
    <text x="70" y="43">PRIMERA ESPOSA</text>
    <text x="70" y="53">EN ESPAÑA</text>
    <text x="215" y="43">CASTILLO SAAVEDRA</text>
    <text x="215" y="53">LA GAVIA, MÉXICO</text>
    <text x="345" y="43">SEGUNDA ESPOSA</text>
    <text x="455" y="43">SU HERMANO</text>
    <text x="134" y="20" font-family="Charis" font-size="10" font-weight="700" fill="#a63d2a" letter-spacing="0">¿?</text>
    <text x="296" y="66" text-anchor="start">SUS HIJOS</text>
  </g>
