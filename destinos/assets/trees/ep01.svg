    <path d="M323 26 V80 M150 80 H450 M150 80 V90 M250 80 V90 M350 80 V90 M450 80 V90"/>
  </g>
  <g font-family="Charis" font-size="13" font-weight="700" fill="#1d1b18" text-anchor="middle">
    <text x="80" y="30">Rosario</text>
    <text x="236" y="30" fill="#a63d2a">don Fernando</text>
    <text x="395" y="30">Carmen</text>
    <text x="150" y="106" font-weight="400">Ramón</text>
    <text x="250" y="106" font-weight="400">Carlos</text>
    <text x="350" y="106" font-weight="400">Juan</text>
    <text x="450" y="106" font-weight="400">Mercedes</text>
  </g>
  <g font-family="Plex" font-size="7.2" font-weight="500" fill="#6d665c" text-anchor="middle" letter-spacing="0.9">
    <text x="80" y="43">PRIMERA ESPOSA</text>
    <text x="80" y="53">MUY MISTERIOSA</text>
    <text x="236" y="43">EL PATRIARCA</text>
    <text x="236" y="53">DE ESPAÑA · LA GAVIA</text>
    <text x="395" y="43">SU ESPOSA</text>
    <text x="395" y="53">YA ESTÁ MUERTA</text>
    <text x="350" y="119">PROFESOR DE LITERATURA</text>
    <text x="450" y="119">LA HIJA</text>
    <text x="150" y="40" font-family="Charis" font-size="10" font-weight="700" fill="#a63d2a" letter-spacing="0" dy="-20">¿?</text>
    <text x="331" y="62" text-anchor="start">SUS HIJOS</text>
