# Ejercicios · Episodio 2 · El secreto
# Practice for the sheet in episodes/ep02.yaml. New items, written for this book.

episode: 2
title: El secreto
title_en: The secret

sets:
  - type: words
    title: Palabras
    en: Words
    instr: Write the Spanish word with **el, la, los** or **las**.
    items:
      - ["parents", "los padres"]
      - ["brother", "el hermano"]
      - ["aunt", "la tía"]
      - ["wife", "la esposa"]
      - ["city", "la ciudad"]
      - ["world", "el mundo"]
      - ["office", "la oficina"]
      - ["marriage", "el matrimonio"]

  - type: fill
    title: Artículos
    en: The
    instr: Write **el, la, los** or **las**.
    items:
      - ["___ mujer", "la"]
      - ["___ hombres", "los"]
      - ["___ universidad", "la"]
      - ["___ idioma", "el (one of the two masculine nouns in -a)"]
      - ["___ lecciones", "las"]
      - ["___ patriarca", "el"]
      - ["___ relación", "la"]
      - ["___ secretos", "los"]

  - type: words
    title: Plurales
    en: More than one
    instr: Write the plural, with its article.
    items:
      - ["el hijo", "los hijos"]
      - ["la ciudad", "las ciudades"]
      - ["el profesor", "los profesores"]
      - ["la lección", "las lecciones (no accent)"]
      - ["una carta", "unas cartas"]
      - ["un secreto", "unos secretos"]

  - type: fill
    title: Posesivos
    en: My, your, his…
    instr: Write the possessive. The hint says which one.
    items:
      - ["Tengo dos hermanos. ___ hermanos viven en Madrid. [my]", "Mis"]
      - ["Don Fernando tiene una hija. ___ hija se llama Mercedes. [his]", "Su"]
      - ["¿Dónde viven ___ padres? [your, to a friend]", "tus"]
      - ["Tenemos una casa. ___ casa es grande. [our]", "Nuestra"]
      - ["Ramón y Consuelo tienen una hija. ___ hija se llama Maricarmen. [their]", "Su"]
      - ["___ esposa se llama Carmen. [my]", "Mi"]

  - type: choose
    title: Elige
    en: Choose
    instr: Circle the right word.
    items:
      - ["¿___ son tus hermanos?", ["Quién", "Quiénes"], "Quiénes"]
      - ["Mi madre ya no vive; está ___.", ["muerto", "muerta"], "muerta"]
      - ["Su padre ___ Pablo Picasso.", ["fue", "fueron"], "fue"]
      - ["Don Fernando tiene ___ hijo en Miami.", ["otro", "un otro"], "otro"]
      - ["___ días.", ["Buenos", "Buenas"], "Buenos"]
      - ["___ noches.", ["Buenos", "Buenas"], "Buenas"]

  - type: error
    title: Un solo error
    en: One mistake
    instr: Each sentence has **one** mistake. Write it correctly.
    items:
      - ["Mis hermano vive en Miami.", "**Mi** hermano vive en Miami."]
      - ["El ciudad es muy grande.", "**La** ciudad es muy grande."]
      - ["Tengo un otro hermano.", "Tengo **otro** hermano."]
      - ["Los lecciones son fáciles.", "**Las** lecciones son fáciles."]

  - type: translate
    title: Traduce
    en: Into Spanish
    instr: Write it in Spanish.
    items:
      - ["I have two brothers and one sister.", "Tengo dos hermanos y una hermana."]
      - ["Ramón's wife is called Consuelo.", "La esposa de Ramón se llama Consuelo."]
      - ["I don't have children.", "No tengo hijos."]
      - ["Good afternoon!", "¡Buenas tardes!"]

  - type: fill
    title: Repaso
    en: From earlier episodes
    instr: Fill in the gap.
    items:
      - ["Raquel ___ abogada. [ser]", "es", 1]
      - ["¿Quiénes ___? [ser]", "son", 1]
      - ["En la carta ___ un secreto.", "hay", 1]
      - ["*La librería* means ___ in English.", "bookstore", 1]

  - type: write
    title: Tú
    en: About you
    instr: Say it out loud first, then write it.
    prompt: "Describe your family in four sentences: *Mi familia es…*, *Tengo…*, *Mi madre se llama…*, *Vive en…*"
    lines: 4
    model: "Mi familia es grande. Tengo dos hermanos y una hermana. Mi madre se llama Ana y vive en Sevilla. No tengo hijos."
