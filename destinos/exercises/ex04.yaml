# Ejercicios · Episodio 4 · Perdido
# Practice for the sheet in episodes/ep04.yaml. New items, written for this book.

episode: 4
title: Perdido
title_en: Lost

sets:
  - type: words
    title: Palabras
    en: Words
    instr: Write the Spanish word, with **el, la, los** or **las** for the nouns.
    items:
      - ["chemistry", "la química"]
      - ["business (the subject)", "el comercio"]
      - ["accounting", "la contabilidad"]
      - ["physical education", "la educación física"]
      - ["subject (at school)", "la asignatura · la materia"]
      - ["bird", "el pájaro"]
      - ["fish (two of them)", "los peces"]
      - ["still, yet", "todavía"]

  - type: words
    title: Contrarios
    en: Opposites
    instr: Write the opposite.
    items:
      - ["pequeño", "grande"]
      - ["lento", "rápido"]
      - ["inteligente", "tonto"]
      - ["cariñoso", "indiferente"]
      - ["dependiente", "independiente"]
      - ["paciente", "impaciente (**im-** before p)"]

  - type: fill
    title: Adjetivos
    en: Describing
    instr: Write the adjective in the form that agrees with the noun.
    items:
      - ["Mis abuelas son muy ___. [cariñoso]", "cariñosas"]
      - ["Mi profesora de español es muy ___. [paciente]", "paciente"]
      - ["Los perros son animales ___. [fiel]", "fieles"]
      - ["Tengo dos peces ___. [negro]", "negros"]
      - ["Elena es una mujer muy ___. [hablador]", "habladora (*hablador* adds -a)"]
      - ["Las tortugas son muy ___. [lento]", "lentas"]
      - ["Mi gato es muy ___. [egoísta]", "egoísta (one form for both)"]

  - type: fill
    title: Yo tomo, ella toma
    en: Verb forms
    instr: "Write the verb in the right form: **-o** for *yo*, **-a / -e** for one other person, **-an** for two or more."
    items:
      - ["Yo ___ inglés y biología. [tomar]", "tomo"]
      - ["Mi amiga ___ química y cálculo. [tomar]", "toma"]
      - ["Miguel y Jaime ___ en un colegio de Sevilla. [estudiar]", "estudian"]
      - ["Raquel ___ a Pedro por teléfono. [llamar]", "llama"]
      - ["Los chicos ___ por la calle. [caminar]", "caminan"]
      - ["Yo ___ un pájaro para mi abuela. [comprar]", "compro"]
      - ["Raquel ___ viajar a Madrid. [decidir]", "decide"]

  - type: choose
    title: Elige
    en: Choose
    instr: Circle the right word. **—** means nothing goes in the gap.
    items:
      - ["Jaime es un ___ estudiante.", ["bueno", "buen"], "buen (before a masculine noun)"]
      - ["Es el ___ año de Miguel en el colegio.", ["primero", "primer"], "primer"]
      - ["___ Jaime no le gusta la escuela.", ["A", "—"], "A"]
      - ["Elena ___ sabe nada.", ["no", "—"], "no (*no … nada*)"]
      - ["___ yo vivo, hay muchos perros.", ["Donde", "Dónde"], "Donde (not a question)"]
      - ["Tengo un ___.", ["perro negro", "negro perro"], "perro negro (the adjective goes after the noun)"]
      - ["___ son mis amigas Ana y Lola.", ["Éste", "Ésta", "Éstos", "Éstas"], "Éstas"]
      - ["___ es el señor Ruiz.", ["Éste", "Ésta", "Éstos", "Éstas"], "Éste"]

  - type: error
    title: Un solo error
    en: One mistake
    instr: Each sentence has **one** mistake. Write it correctly.
    items:
      - ["Éste son mis padres.", "**Éstos** son mis padres."]
      - ["Los gatos son animales muy inteligente.", "Los gatos son animales muy **inteligentes**."]
      - ["Yo toma inglés y arte.", "Yo **tomo** inglés y arte."]
      - ["Me gustaría visito Sevilla.", "Me gustaría **visitar** Sevilla."]

  - type: translate
    title: Traduce
    en: Into Spanish
    instr: Write it in Spanish.
    items:
      - ["This is my sister, and these are my parents.", "Ésta es mi hermana, y éstos son mis padres. (also without accents: *Esta…, estos…*)"]
      - ["Jaime doesn't like to study.", "A Jaime no le gusta estudiar."]
      - ["I would like to have a dog.", "Me gustaría tener un perro."]
      - ["Dogs are loyal animals, but they aren't very independent.", "Los perros son animales fieles, pero no son muy independientes."]

  - type: fill
    title: Repaso
    en: From earlier episodes
    instr: Fill in the gap.
    items:
      - ["¿Dónde ___ los peces? [estar]", "están", 3]
      - ["Elena vive con ___ hijos. [her]", "sus", 2]
      - ["En el colegio hay ___ profesores. [21]", "veintiún", 3]
      - ["Ustedes ___ de Madrid, ¿verdad? [ser]", "son", 1]
      - ["Raquel tiene ___ amiga en Sevilla. [another]", "otra", 2]

  - type: write
    title: Tú
    en: About you
    instr: Say it out loud first, then write it.
    prompt: "Introduce someone you know (*Éste es… / Ésta es…*) and describe them with two or three adjectives. Then say what they study or like doing (*toma…, le gusta…*) and what you would like to do (*Me gustaría…*)."
    lines: 4
    model: "Ésta es mi amiga Lucía. Es inteligente y muy habladora. Toma biología y química en la universidad. Le gusta estudiar, pero no le gusta la informática. Me gustaría tomar una clase de biología con ella."
