# Ejercicios · Episodio 1 · La carta
# Practice for the sheet in episodes/ep01.yaml. New items, written for this book.

episode: 1
title: La carta
title_en: The letter

sets:
  - type: words
    title: Palabras
    en: Words
    instr: Write the Spanish word with **el** or **la**.
    items:
      - ["lawyer (a woman)", "la abogada"]
      - ["client", "el cliente"]
      - ["letter", "la carta"]
      - ["man", "el hombre"]
      - ["woman", "la mujer"]
      - ["estate", "la hacienda"]
      - ["story", "la historia"]
      - ["secret", "el secreto"]

  - type: fill
    title: El verbo ser
    en: Verb forms
    instr: Write the right form of **ser**.
    items:
      - ["Raquel ___ abogada.", "es"]
      - ["Yo ___ estudiante de español.", "soy"]
      - ["Carlos y Juan ___ hijos de don Fernando.", "son"]
      - ["¿Tú ___ de México?", "eres"]
      - ["Juan, Carlos y yo ___ hermanos.", "somos"]
      - ["Don Fernando ___ de España.", "es"]
      - ["Vosotros ___ de Madrid, ¿verdad?", "sois"]
      - ["¿Quién ___ Rosario?", "es"]

  - type: choose
    title: Elige
    en: Choose
    instr: Circle the right word. **—** means nothing goes in the gap.
    items:
      - ["Raquel es ___ abogada.", ["una", "—"], "— (no *una* before a job)"]
      - ["¿___ es don Fernando?", ["Quién", "Quiénes"], "Quién"]
      - ["¿___ son Carlos y Juan?", ["Quién", "Quiénes"], "Quiénes"]
      - ["En la carta ___ un secreto.", ["es", "hay"], "hay"]
      - ["Don Fernando es ___ España.", ["de", "en"], "de"]
      - ["Raquel vive ___ Los Ángeles.", ["de", "en"], "en"]

  - type: words
    title: Cognados
    en: Words you already know
    instr: "What do they mean in English? Two of them are false friends."
    items:
      - ["la universidad", "university"]
      - ["la información", "information"]
      - ["misterioso", "mysterious"]
      - ["histórico", "historic"]
      - ["la librería", "bookstore (false friend: a library is *la biblioteca*)"]
      - ["el colegio", "high school (false friend: a college is *la universidad*)"]

  - type: error
    title: Un solo error
    en: One mistake
    instr: Each sentence has **one** mistake. Write it correctly.
    items:
      - ["Raquel es una abogada.", "Raquel es abogada."]
      - ["Carlos y Juan es hijos de don Fernando.", "Carlos y Juan **son** hijos de don Fernando."]
      - ["Yo es estudiante de español.", "Yo **soy** estudiante de español."]
      - ["¿Quiénes es Rosario?", "¿**Quién** es Rosario?"]

  - type: translate
    title: Traduce
    en: Into Spanish
    instr: Write it in Spanish.
    items:
      - ["I'm a student of Spanish.", "Soy estudiante de español."]
      - ["Don Fernando is from Spain, but he lives in Mexico.", "Don Fernando es de España, pero vive en México."]
      - ["There is a secret in the letter.", "En la carta hay un secreto. · Hay un secreto en la carta."]
      - ["Who are they?", "¿Quiénes son?"]

  - type: write
    title: Tú
    en: About you
    instr: Say it out loud first, then write it.
    prompt: "Three or four sentences with **ser**: your name, what you are, where you are from and where you live."
    lines: 4
    model: "Me llamo Pablo. Soy estudiante de español. Soy de Chile, pero vivo en Madrid."
