# Ejercicios · Episodio 6 · ¿Maestra?
# Practice for the sheet in episodes/ep06.yaml. New items, written for this book.
# A review lesson: the present tense, ir and the time (Episode 5) come back in most sets.

episode: 6
title: "¿Maestra?"
title_en: Teacher?

sets:
  - type: words
    title: Palabras
    en: Words
    instr: Write it in Spanish, with **el** or **la** before a noun.
    items:
      - ["winner (a woman)", "la ganadora"]
      - ["prize", "el premio"]
      - ["grade-school teacher", "el maestro · la maestra"]
      - ["reporter (a man)", "el reportero"]
      - ["roommate (a man)", "el compañero de cuarto"]
      - ["luck", "la suerte"]
      - ["early", "temprano"]
      - ["right now", "ahora mismo"]

  - type: fill
    title: El presente
    en: Verb forms
    instr: Write the verb in the present tense.
    items:
      - ["Nosotras ___ en la cafetería a la una. [comer]", "comemos"]
      - ["¿___ vosotros que Raquel es la ganadora? [creer]", "Creéis"]
      - ["Señores, ¿___ Uds. la pregunta? [comprender]", "comprenden"]
      - ["Yo ___ de casa a las siete y media. [salir]", "salgo"]
      - ["Hoy yo no ___ clase de química. [tener]", "tengo"]
      - ["Luego mi amigo y yo ___ a la biblioteca. [ir]", "vamos"]

  - type: fill
    title: ¿Qué pregunta?
    en: Question words
    instr: Write the question word that asks for the answer given.
    items:
      - ["¿___ trabaja tu madre? —En un hospital.", "Dónde"]
      - ["¿___ se llama tu compañero de cuarto? —Pablo.", "Cómo"]
      - ["¿___ es tu apellido? —Ruiz.", "Cuál"]
      - ["¿___ cenas los domingos? —Con mis abuelos.", "Con quién"]
      - ["¿___ es tu clase de inglés? —A las diez.", "A qué hora"]
      - ["¿___ no comes? —Porque no tengo tiempo.", "Por qué"]

  - type: fill
    title: De… a…
    en: From… to…
    instr: Write it in Spanish, with the times in words.
    items:
      - ["Elena trabaja en la oficina ___. [9:00–1:30]", "de las nueve a la una y media"]
      - ["Los lunes estudio en la biblioteca ___. [12:00–1:00]", "de las doce a la una"]
      - ["La tienda está cerrada ___. [1:30–4:30]", "de la una y media a las cuatro y media"]
      - ["Vamos a la universidad ___. [Monday to Friday]", "de lunes a viernes"]
      - ["El rápido sale para Madrid ___. [at 7:15 a.m.]", "a las siete y cuarto de la mañana"]
      - ["Los sábados trabajo ___. [in the afternoon, no clock time]", "por la tarde"]

  - type: choose
    title: Elige
    en: Choose
    instr: Circle the right word.
    items:
      - ["¿A qué hora vas ___?", ["a casa", "en casa"], "a casa"]
      - ["Los domingos como ___ con mi familia.", ["a casa", "en casa"], "en casa"]
      - ["Elena, ¿vas al mercado ___? —Sí, voy contigo.", ["conmigo", "contigo"], "conmigo"]
      - ["¿___ es la capital de España? —Madrid.", ["Qué", "Cuál"], "Cuál"]
      - ["¿___ es la ONCE? —Una organización de ciegos.", ["Qué", "Cuál"], "Qué (it asks what the ONCE is)"]
      - ["Yo ___ de casa muy temprano.", ["salo", "salgo"], "salgo"]

  - type: error
    title: Un solo error
    en: One mistake
    instr: Each sentence has **one** mistake. Write it correctly.
    items:
      - ["¿Qué es tu materia favorita?", "¿**Cuál** es tu materia favorita?"]
      - ["¿Quién estudia con tú?", "¿Quién estudia **contigo**?"]
      - ["Trabajo de lunes a viernes, de una a las cinco.", "Trabajo de lunes a viernes, de **la** una a las cinco."]
      - ["Uds. vivís en una casa grande.", "Uds. **viven** en una casa grande. · **Vosotros** vivís en una casa grande."]
      - ["¿Donde vive tu compañera de cuarto?", "¿**Dónde** vive tu compañera de cuarto?"]

  - type: translate
    title: Traduce
    en: Into Spanish
    instr: Write it in Spanish.
    items:
      - ["I have class at eight, so I leave home at seven.", "Tengo clase a las ocho; por eso salgo de casa a las siete."]
      - ["What's the winner's name?", "¿Cómo se llama la ganadora? · ¿Cómo se llama el ganador? · ¿Cuál es el nombre de la ganadora?"]
      - ["On weekends we work from nine to two.", "Los fines de semana trabajamos de las nueve a las dos."]
      - ["Are you going home now? (to friends, in Spain)", "¿Vais a casa ahora?"]

  - type: fill
    title: Repaso
    en: From earlier episodes
    instr: Fill in the gap.
    items:
      - ["Raquel ___ muy contenta hoy. [estar]", "está", 3]
      - ["¿Qué hora es? —___ la una y veinte.", "Es", 5]
      - ["Jaime es el hijo ___ señor Ruiz.", "del", 3]
      - ["El sábado mis amigos y yo ___ a ir a un partido. [ir]", "vamos", 5]
      - ["Raquel y ___ madre viven en Los Ángeles. [her]", "su", 2]
      - ["En mi barrio ___ dos mercados y una iglesia.", "hay", 3]

  - type: write
    title: Tú
    en: About you
    instr: Say it out loud first, then write it.
    prompt: "A typical weekday in four or five sentences. Use **salgo**, **tengo**, **de… a…**, **en casa** or **a casa**, and **con** + a person."
    lines: 4
    model: "Salgo de casa a las ocho menos cuarto. Tengo clase de las nueve a la una. Como en la cafetería con una amiga. Por la tarde estudio en casa. Ceno con mi familia a las nueve y media."
