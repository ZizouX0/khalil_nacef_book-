# Ejercicios · Episodio 10 · Cuadros
# Practice for the sheet in episodes/ep10.yaml. New items, written for this book.
# The full verb tables are in Episode 9: these sets practise the nosotros and vosotros forms,
# describing people, ser and estar, and the farewells.

episode: 10
title: Cuadros
title_en: Paintings

sets:
  - type: words
    title: Palabras
    en: Opposites
    instr: "Write the opposite."
    items:
      - ["alto", "bajo"]
      - ["pelo largo", "pelo corto"]
      - ["joven", "viejo · vieja"]
      - ["delgada", "gordita (*gorda* is blunt)"]
      - ["guapo", "feo"]
      - ["grande", "pequeño · pequeña"]
      - ["ojos claros", "ojos oscuros"]
      - ["temprano", "tarde"]

  - type: words
    title: Nacionalidades
    en: Where they are from
    instr: "Write the nationality so it agrees with the person or people. No capital letter."
    items:
      - ["Miguel y Elena · Spain", "españoles (a mixed group: masculine)"]
      - ["Emma y Lucy · England", "inglesas"]
      - ["Hans · Germany", "alemán"]
      - ["Marie · France", "francesa"]
      - ["Kenji y Yuki · Japan", "japoneses"]
      - ["Paulo · Portugal", "portugués"]

  - type: fill
    title: Nosotros y vosotros
    en: We and you all
    instr: "Write the **nosotros** or **vosotros** form. No stem change here, and a *-se* verb takes **nos** or **os**."
    items:
      - ["Mi hermano y yo ___ ir a México este verano. [querer]", "queremos"]
      - ["¿A qué hora ___ a casa vosotros? [volver]", "volvéis"]
      - ["Los domingos mi familia y yo ___ muy tarde. [levantarse]", "nos levantamos"]
      - ["¿Por qué no ___ aquí, con nosotros? [vosotros · sentarse]", "os sentáis"]
      - ["En la cafetería, siempre ___ un café con leche. [nosotros · pedir]", "pedimos"]
      - ["Después de la clase, ___ del profesor. [nosotros · despedirse]", "nos despedimos"]

  - type: fill
    title: ¿Ser o estar?
    en: To be
    instr: "Write the right form of **ser** or **estar**, or **hay**."
    items:
      - ["Mi madre ___ de Sevilla, pero vive en Madrid.", "es (where from)"]
      - ["Hoy no voy a clase porque ___ muy mal.", "estoy (how you feel)"]
      - ["Los cuadros de Velázquez ___ en el Museo del Prado.", "están (where)"]
      - ["¿Cómo ___ vosotros? — Muy bien, gracias.", "estáis"]
      - ["Nosotros ___ mexicanos, de Guadalajara.", "somos (nationality)"]
      - ["En el museo ___ una exposición de Picasso.", "hay (*there is*)"]

  - type: choose
    title: Elige
    en: Choose
    instr: "Circle the right word."
    items:
      - ["Mi hermano es ___ y mi hermana es alta.", ["bajo", "corto"], "bajo (*corto* is for length)"]
      - ["Pedro y Miguel son muy ___.", ["optimistas", "optimistos"], "optimistas (*-ista*: one form for men and women)"]
      - ["El Greco es un ___ pintor.", ["gran", "grande"], "gran (= great, before the noun)"]
      - ["Vive en una casa muy ___.", ["gran", "grande"], "grande (= big, after the noun)"]
      - ["Don Fernando es una persona muy ___.", ["simpático", "simpática"], "simpática (it agrees with *la persona*)"]
      - ["María es rubia: tiene pelo ___.", ["rubio", "rubia"], "rubio (it agrees with *el pelo*)"]
      - ["Federico y yo vamos a ___ en el verano.", ["casarse", "casarnos"], "casarnos"]
      - ["Adiós, Sr. Díaz. Que ___ un buen viaje.", ["tengas", "tenga"], "tenga (to *usted*)"]

  - type: error
    title: Un solo error
    en: One mistake
    instr: "Each sentence has **one** mistake. Write it correctly."
    items:
      - ["Nosotros quieremos ir al museo.", "Nosotros **queremos** ir al museo."]
      - ["Raquel es en Madrid ahora.", "Raquel **está** en Madrid ahora."]
      - ["Pedro y yo vamos a casarse en junio.", "Pedro y yo vamos a **casarnos** en junio."]
      - ["El Sr. Díaz es un persona muy reservada.", "El Sr. Díaz es **una** persona muy reservada."]
      - ["Mi hermana es baja y tiene pelo corta.", "Mi hermana es baja y tiene pelo **corto**."]

  - type: translate
    title: Traduce
    en: Into Spanish
    instr: "Write it in Spanish."
    items:
      - ["She's tall and thin, and she has long black hair.", "Es alta y delgada, y tiene (el) pelo largo y negro. · … pelo negro y largo."]
      - ["We'd like to visit the Prado on Sunday.", "Nos gustaría visitar el Prado el domingo."]
      - ["My parents are Mexican, but they're in Seville now.", "Mis padres son mexicanos, pero ahora están en Sevilla. · … pero están en Sevilla ahora."]
      - ["Have a good trip, Raquel! (to a friend)", "¡Que tengas (un) buen viaje, Raquel!"]

  - type: fill
    title: Repaso
    en: From earlier episodes
    instr: "Fill in the gap."
    items:
      - ["¿___ a la novia de Federico? [tú · conocer]", "Conoces", 7]
      - ["Mi cumpleaños es ___ 8 de octubre.", "el", 9]
      - ["Mañana ___ a ver los cuadros de Goya. [nosotros · ir]", "vamos", 5]
      - ["Antes de un viaje, yo ___ las maletas. [hacer]", "hago", 7]
      - ["___ zapatos que llevas son muy bonitos. [near you]", "Esos", 9]

  - type: write
    title: Tú
    en: About you
    instr: "Say it out loud first, then write it."
    prompt: "Describe someone you know well in four or five sentences: *Es…*, *Tiene…*, *Es de…*, *Está en…*. End with one thing you do together (*nosotros*)."
    lines: 4
    model: "Mi amiga Sara es de Valencia, pero ahora está en Londres. Es alta y delgada, y tiene pelo castaño y largo. Tiene ojos oscuros y muy expresivos. Es optimista y muy simpática. Los sábados vamos al cine y nos acostamos muy tarde."
