# Ejercicios · Episodio 5 · La despedida
# Practice for the sheet in episodes/ep05.yaml. New items, written for this book.

episode: 5
title: La despedida
title_en: The farewell

sets:
  - type: words
    title: ¿Qué hora es?
    en: Telling time
    instr: Write the time in words, starting with **Es la…** or **Son las…**
    items:
      - ["2:10", "Son las dos y diez."]
      - ["1:15", "Es la una y cuarto. · Es la una y quince."]
      - ["7:30", "Son las siete y media."]
      - ["11:05", "Son las once y cinco."]
      - ["9:20", "Son las nueve y veinte."]
      - ["5:45", "Son las seis menos cuarto."]
      - ["12:40", "Es la una menos veinte."]
      - ["3:55", "Son las cuatro menos cinco."]

  - type: fill
    title: ¿Cuándo?
    en: At what time, on what day
    instr: Write it in Spanish. The hint says what goes in the gap.
    items:
      - ["El tren para Madrid sale ___. [at 1:30 p.m.]", "a la una y media de la tarde"]
      - ["Llego a la oficina ___. [at 7:45 a.m.]", "a las ocho menos cuarto de la mañana"]
      - ["¿___ es el partido de fútbol? —A las ocho. [at what time]", "A qué hora"]
      - ["___ vamos a una fiesta. [on Friday]", "El viernes"]
      - ["Mi abuela va al mercado ___. [on Thursdays]", "los jueves"]
      - ["Elena trabaja ___. [in the afternoon, no clock time]", "por la tarde"]

  - type: fill
    title: El verbo ir
    en: To go
    instr: Write the right form of **ir**.
    items:
      - ["Mañana yo ___ a Madrid en tren.", "voy"]
      - ["¿Adónde ___ tú el sábado?", "vas"]
      - ["Señora, ¿___ usted a la estación ahora?", "va"]
      - ["Mi hermano y yo ___ a cenar en un restaurante.", "vamos"]
      - ["Chicos, ¿___ vosotros a la iglesia el domingo?", "vais (no accent)"]
      - ["¿___ Uds. a ver la Giralda mañana?", "Van"]

  - type: fill
    title: Nosotros, vosotros, ustedes
    en: We and you all
    instr: Write the verb in the present tense. The hint gives it in English.
    items:
      - ["Los domingos mi familia y yo ___ con los abuelos. [to have dinner]", "cenamos (*cenar*)"]
      - ["Mis amigos y yo ___ por el parque los sábados. [to run]", "corremos (*correr*)"]
      - ["Mi hermana y yo ___ en una casa pequeña. [to live]", "vivimos (*vivir*)"]
      - ["Chicos, ¿dónde ___ vosotros hoy? [to work]", "trabajáis (*trabajar*)"]
      - ["¿___ vosotros la lección? [to understand]", "Comprendéis (*comprender*)"]
      - ["Vosotras ___ muchas cartas, ¿no? [to write]", "escribís (*escribir*)"]
      - ["Señores, ¿___ Uds. cupones de la lotería? [to sell]", "venden (*vender*)"]

  - type: choose
    title: Elige
    en: Choose
    instr: Circle the right word. **—** means nothing goes in the gap.
    items:
      - ["¿___ van tus padres mañana? —A Madrid.", ["Dónde", "Adónde"], "Adónde (with *ir*)"]
      - ["Raquel sale ___ Sevilla para Madrid.", ["de", "a"], "de"]
      - ["Jaime busca ___ Osito por todas partes.", ["a", "—"], "a (Osito is a pet)"]
      - ["Raquel visita ___ la Alhambra.", ["a", "—"], "— (a place takes no *a*)"]
      - ["No voy a la fiesta ___ tengo un examen.", ["porque", "por qué"], "porque"]
      - ["Raquel va a ver a Elena mañana y dice: «¡___!»", ["Hasta mañana", "Buenos días"], "Hasta mañana"]

  - type: error
    title: Un solo error
    en: One mistake
    instr: Each sentence has **one** mistake. Write it correctly.
    items:
      - ["Son la una y media.", "**Es** la una y media."]
      - ["Mañana voy estudiar con Miguel.", "Mañana voy **a** estudiar con Miguel."]
      - ["¿Dónde vivís ustedes?", "¿Dónde **viven** ustedes? · ¿Dónde vivís **vosotros**?"]
      - ["Trabajo en el lunes y el martes.", "Trabajo el lunes y el martes. (no *en*)"]

  - type: translate
    title: Traduce
    en: Into Spanish
    instr: Write it in Spanish.
    items:
      - ["What time is it? —It's a quarter to nine.", "¿Qué hora es? —Son las nueve menos cuarto."]
      - ["We're going to have dinner at ten at night.", "Vamos a cenar a las diez de la noche."]
      - ["On Saturdays I work in the morning.", "Los sábados trabajo por la mañana."]
      - ["The blind man sells lottery tickets.", "El ciego vende cupones de (la) lotería. · El ciego vende billetes de lotería."]

  - type: fill
    title: Repaso
    en: From earlier episodes
    instr: Fill in the gap.
    items:
      - ["Mis hermanas son muy ___. [inteligente]", "inteligentes", 4]
      - ["Chicos, ¿dónde viven ___ padres? [your, to friends in Spain]", "vuestros", 2]
      - ["___ es mi amiga Carmen. [this]", "Ésta · Esta", 4]
      - ["¿___ son los hijos de Elena? —Miguel y Jaime.", "Quiénes", 1]
      - ["Son las nueve de la mañana. —¡Buenos ___, señora!", "días", 2]
      - ["Miguel es un ___ estudiante. [bueno]", "buen", 4]

  - type: write
    title: Tú
    en: About you
    instr: Say it out loud first, then write it.
    prompt: "Your week in four or five sentences: what you do on certain days and at what time, and one thing you are going to do this weekend. Use **los lunes…**, **a las…** and **voy a…**"
    lines: 4
    model: "Los lunes y los miércoles llego a la universidad a las nueve de la mañana. Los martes trabajo por la tarde. Ceno a las nueve y media de la noche. El sábado voy a ir a una fiesta con mis amigos."
