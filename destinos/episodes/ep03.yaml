cognates:
  rule: "Lección 2 gave you **-ción, -sión, -dad**. Here are three more endings, and **es-** + consonant again. Nouns in **-ía** are almost all feminine, with the stress on the **í**: *la teoría*."
  patterns:
    - ["-oso · -osa", "-ous", "famoso, riguroso, maravilloso", "famous, rigorous, marvellous"]
    - ["-ía", "-y", "filosofía, teoría, biología", "philosophy, theory, biology"]
    - ["-mente", "-ly", "frecuentemente, rápidamente", "frequently, rapidly"]
    - ["es-", "s-", "escuela, estatua, estudiante", "school, statue, student"]
  harder:
    - ["la cortesía", "courtesy", "-ía = -y"]
    - ["la profecía", "prophecy", "-ía = -y, and *f* for *ph*"]
    - ["estudioso", "studious", "two patterns: es- = s-, -oso = -ous"]

sounds:
  - title: "Short, tense, always the same"
    body: "Spanish vowels are always pronounced and almost always sound the same. No glide at the end: *lo* is not English *low*, *de* is not *day*."
  - title: "a · e"
    body: "**a** like *father*, but short: *padre, carta, gata*. **e** like *they*, without the y: *Pepe, trece, bebé*."
  - title: "i · o · u"
    body: "**i** like *machine*, but short: *Mimi, Trini, Pili*. **o** like *home*, without the w: *como, poco, somos*. **u** like *rule*, but short: *Lulú, tutú, gurú*."
  - title: "No *uh* sound"
    body: "English blurs unstressed vowels into *uh*. Spanish never does: say every vowel clearly in *canal, motor, Ana*."
  - title: "Silent u"
    body: "The exception: in **que** and **qui** the u is silent: Ra**que**l, ¿**qué**?, **qui**nce."
  - title: "The accent mark shows the stress"
    body: "*bebé, número, rápidamente, dieciséis*: lean on the vowel with the mark."

phrases:
  - ["¿Dónde está la calle Pureza?", "Where is Pureza Street?"]
  - ["¿Está lejos? · Está un poco lejos.", "Is it far? · It's a bit far."]
  - ["¿Cuántos turistas hay en el grupo?", "How many tourists are there in the group?"]
  - ["Toman un taxi para ir al barrio de Triana.", "They take a taxi to go to the Triana district."]
  - ["Busca a la señora Teresa Suárez.", "He / she is looking for Mrs. Teresa Suárez."]
  - ["¿Con quién viven tus amigos?", "Who do your friends live with?"]
  - ["¿Dónde trabaja tu padre?", "Where does your father work?"]

culture:
  - title: "Sr. · Sra. · Srta."
    body: "**señor** = Mr. · **señora** = Mrs. (any married woman, often any middle-aged woman) · **señorita** = Miss (young or single). No *Ms.* in Spanish. Capital only when abbreviated: *el señor · el Sr.*"
  - title: "Spanish in Spain"
    body: "Sevillanos speak fast and run words together. In most of Spain, **z** and **c** before e or i sound like English *th*: *cero, cinco, doce, diez*. Elsewhere, and on the course tape, they sound like *s*."
  - title: "Two last names: los apellidos"
    body: "Most Hispanics have two surnames: the **father's** first, then the **mother's**. Use both, or the first alone, never the second alone. A married woman may add **de** + her husband's surname; in Spain most women simply keep their own."
    rows:
      - ["Castillo Saavedra", "*la familia Castillo* or *la familia Castillo Saavedra*: both correct"]
      - ["Ruiz Ramírez", "**Ruiz** (father) + **Ramírez** (mother): *Miguel Ruiz*, never ~~Miguel Ramírez~~"]
      - ["Ramírez de Ruiz", "a married name: *Elena Ramírez de Ruiz*, or in Spain just *Elena Ramírez*"]
  - title: "España, un país de contrastes"
    body: "**North**: mountains, forests, industry. **South** (Andalucía): drier, less industry, Arab influence."
    rows:
      - ["la capital", "Madrid"]
      - ["el gobierno", "monarquía constitucional · el rey Felipe VI (in the book, Juan Carlos I)"]
      - ["la organización", "17 comunidades autónomas (self-governing regions)"]
      - ["el idioma oficial", "el español, also called el castellano"]
      - ["otros idiomas", "el catalán (Cataluña) · el gallego (Galicia) · el vascuence, today el euskera (el País Vasco)"]
      - ["la población", "39.000.000 in the book, about 48.000.000 today: Spain writes dots where English writes commas"]
