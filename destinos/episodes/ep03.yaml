# Episodio 3 · El comienzo
# Sources: Textbook Lección 3 (pp. 28–37) and Workbook/Study Guide Lección 3 (pp. 19–31).
# Words in vocab.core are the two books' own Vocabulario lists (verbs given as infinitives).
# The numbers 0–21 (Vocabulario del tema) and the forms of estar are grammar points with tables.
# "Spanish in Spain" (a workbook Nota cultural about pronunciation) is a culture note.

episode: 3
title: El comienzo
title_en: The beginning
pages: "Textbook pp. 28–37 · Workbook pp. 19–31"

essentials:
  - "**Numbers 0–21**: 11 to 15 end in **-ce** (*once, doce*), 16 to 19 are **dieci-** + number (*dieciséis*), 21 is *veintiuno*. Before a noun, *uno* becomes **un / una**: *veintiún clientes, veintiuna oficinas*."
  - "**Talking about someone else**: the verb ends in **-a** (-ar verbs) or **-e** (-er, -ir verbs): *habla, cree, vive*. Add **-n** for two or more: *hablan, creen, viven*. After *debe, desea, necesita*, the next verb stays in the infinitive: *Necesita hablar con Elena*."
  - "**Estar** (to be) says how someone is and where: *¿Cómo está usted?* (formal) · *¿Cómo estás?* (informal) · *Raquel está en Sevilla*. **Hay** = there is / there are, and never changes."
  - "**Meeting someone**: *Me llamo… / Soy…* · *Mucho gusto.* · *Igualmente.*"

greetings:
  - ["Mucho gusto.", "Pleased to meet you.", "When you meet someone for the first time."]
  - ["Igualmente.", "Likewise.", "The reply to *Mucho gusto*."]
  - ["Me llamo ___.", "My name is ___.", "Saying who you are. *Soy ___*, or just your name, also works."]
  - ["¿Cómo está usted?", "How are you?", "Formal: someone you don't know well, or to show respect."]
  - ["¿Cómo estás?", "How are you?", "Informal: family and friends."]
  - ["Bien. · Muy bien. · Mal.", "Fine. · Very well. · Not well.", "The answers."]
  - ["Mucho tiempo sin verte.", "Long time no see.", "To a friend or relative you haven't seen for a while."]

grammar:
  - title: "Two jobs for estar"
    rule: "*Ser* says who or what someone is. **Estar** says how they are and where they are."
    uses:
      - label: "how?"
        text: "How someone **is** or feels."
        examples:
          - ["¿Cómo está usted?", "How are you? (formal)"]
          - ["Yo, bien, pero papá está muy mal.", "I'm fine, but Dad is very unwell."]
      - label: "where?"
        text: "Where someone or something **is**."
        examples:
          - ["África está al sur de España.", "Africa is to the south of Spain."]
          - ["¿Dónde están Carlitos y Juanita?", "Where are Carlitos and Juanita?"]
    trap: "**usted** or **tú**? *¿Cómo está usted?* to someone you don't know well or want to show respect to; *¿Cómo estás?* to family and friends. When in doubt, use *usted*."

  - title: "Numbers 0–21"
    rule: "Learn 0 to 15 by heart (they are in the word list below). From 16 on, the numbers are built: **dieci-** is *diez y* (ten and), **veinti-** is *veinte y* (twenty and)."
    table:
      head: ["", "pattern", "numbers"]
      rows:
        - ["11–15", "**-ce**", "on**ce**, do**ce**, tre**ce**, cator**ce**, quin**ce**"]
        - ["16–19", "**dieci-**", "**dieci**séis, **dieci**siete, **dieci**ocho, **dieci**nueve"]
        - ["20–21", "**veinti-**", "veinte, **veinti**uno"]
        - ["uno + noun", "**un** · **una**", "**un** hijo, **una** carta · **veintiún** clientes, **veintiuna** oficinas"]
    trap: "16 to 19 and 21 can also be written as three words: *diez y seis, veinte y uno*. Watch the accents: dieci**séis**, veinti**ún**."

  - title: "hay: there is, there are"
    rule: "**Hay** means both *there is* and *there are*, and it never changes form. **No hay** = there isn't, there aren't. **¿Hay…?** = is there…? are there…?"
    examples:
      - ["En Sevilla hay muchos mercados y tiendas.", "In Seville there are many markets and shops."]
      - ["Pero no hay muchas fábricas.", "But there aren't many factories."]
      - ["¿Qué hay en tu ciudad?", "What is there in your city?"]
    trap: "*Hay* says that something exists; *está / están* says where a known thing is: *Hay un mercado en Triana.* · *El mercado está en Triana.*"

  - title: "Talking about others: habla, cree, vive"
    rule: "To say what someone else does, drop **-ar, -er, -ir** from the infinitive and add **-a** (-ar verbs) or **-e** (-er and -ir verbs). For two or more people, add **-n**."
    table:
      head: ["", "hablar", "creer", "vivir"]
      rows:
        - ["stem", "habl-", "cre-", "viv-"]
        - ["él · ella · usted", "habl**a**", "cre**e**", "viv**e**"]
        - ["ellos · ellas · ustedes", "habl**an**", "cre**en**", "viv**en**"]
    examples:
      - ["Raquel vive en Los Ángeles. Viaja a España.", "Raquel lives in Los Angeles. She is travelling to Spain."]
      - ["Raquel y el taxista hablan en la plaza.", "Raquel and the taxi driver talk in the square."]
    trap: "**ellos** = they (men, or men and women together) · **ellas** = they (women only)."

  - title: "Verb + infinitive: debe, desea, necesita"
    rule: "The infinitive is the *to* form, and it always ends in **-ar, -er** or **-ir**. After **debe** (should, must), **desea** (wants) and **necesita** (needs), the second verb stays in the infinitive."
    examples:
      - ["Raquel debe hablar con Miguel Ruiz.", "Raquel should speak with Miguel Ruiz."]
      - ["Desea encontrar a Rosario.", "She wants to find Rosario."]
      - ["Necesita saber dónde vive la Sra. Suárez.", "She needs to know where Mrs. Suárez lives."]
    trap: "Only the first verb changes: *Miguel y Jaime necesit**an** buscar a su madre*, never ~~necesitan buscan~~."

rules:
  - ["**ser**: who, what, where from · **estar**: how and where", "Es abogada. Es de España. · Está bien. Está en Sevilla."]
  - ["**No** goes right before the verb.", "Raquel no explica el misterio. · No hay muchas fábricas."]
  - ["No *he, she, they* needed once we know who it is.", "Elena Ruiz vive en Sevilla. No trabaja en una oficina."]
  - ["One Spanish form, two English ones.", "Explica la historia. = She explains / is explaining the story."]
  - ["**a** before a specific person: no English equivalent.", "Busca a Rosario. · Visita a su abuela."]
  - ["**a + el = al** · **de + el = del**. No other article contracts.", "para ir al barrio · el nombre del hijo · a la iglesia · de los abuelos"]
  - ["**le gusta** + verb = he / she likes (to)…", "Le gusta ser el centro de atención."]

verbs:
  table:
    verb: estar
    meaning: to be (how, where)
    irregular: true
    forms:
      - ["estoy", "I am"]
      - ["estás", "you are"]
      - ["está", "he, she is · you are"]
      - ["estamos", "we are"]
      - ["estáis", "you are"]
      - ["están", "they are · you are"]
    hook: "*Estoy* ends in **-oy**, like *soy*. Every other form leans on the **a**: est**á**s, est**á**, est**a**mos, est**á**is, est**á**n."
  notes:
    - label: In this lesson
      text: "You mostly need **está** (one person or thing) and **están** (two or more)."
  met:
    - ["sabe · no sabe nada", "saber", "knows · doesn't know anything"]
    - ["va a viajar · para ir", "ir", "is going to travel · (in order) to go"]
    - ["conoce", "conocer", "meets"]
    - ["desea encontrar", "encontrar", "wants to find"]
    - ["le gusta", "gustar", "he / she likes"]
    - ["estudia", "estudiar", "studies"]
    - ["se llevan bien", "llevarse", "they get along well"]
    - ["escribió", "escribir", "wrote"]

