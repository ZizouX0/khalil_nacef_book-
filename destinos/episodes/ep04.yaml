cognates:
  rule: "Most of the new subject names are cognates: swap the ending and you have the English word. The book itself asks you to find *business, foreign languages, accounting* and *chemistry* in the list. It also spells psychology two ways, *psicología* and *sicología*: both are correct."
  patterns:
    - ["-ía", "-y", "biología, filosofía, sociología", "biology, philosophy, sociology"]
    - ["-ión", "-ion", "religión, comunicación", "religion, communication"]
    - ["-ura", "-ure", "literatura, arquitectura", "literature, architecture"]
  harder:
    - ["el comercio", "business", "think *commerce*"]
    - ["la contabilidad", "accounting", "think *count*"]
    - ["la química", "chemistry", "think *chemical*"]
    - ["la lengua extranjera", "foreign language", "think *linguist*, *stranger*"]
  false_friends:
    - ["el colegio", "school", "college", "la universidad"]

phrases:
  - ["Yo tomo ___, ___ y ___.", "I'm taking ___, ___ and ___."]
  - ["Mi amiga toma ___.", "My friend is taking ___."]
  - ["¿Cuál es su materia favorita?", "What's his / her favourite subject?"]
  - ["Donde yo vivo, los chicos estudian ___.", "Where I live, children study ___."]
  - ["No sabe todavía cuál es su campo.", "He / she doesn't know yet what his / her field is."]
  - ["Tengo un perro. Se llama ___.", "I have a dog. Its name is ___."]
  - ["No tengo ningún animal.", "I don't have any animals."]
  - ["En general, los perros son ___. Pero los gatos son ___.", "In general, dogs are ___. But cats are ___."]
  - ["No está de acuerdo.", "He / she doesn't agree."]
  - ["Desea hablar con Raquel por teléfono.", "She wants to speak to Raquel on the phone."]
  - ["Ya hablé con ella.", "I've already spoken to her."]

culture:
  - title: "El colegio"
    body: "In Spain a *colegio* is a grade school or high school, not a college. Many, like the Colegio de San Francisco de Paula in the episode, are linked to a religious order, and *religión* is a school subject. A subject is *la asignatura* in Spain; *la materia* is used all over the Spanish-speaking world."
  - title: "University in Hispanic countries"
    body: "After the **bachillerato** (the high-school diploma), students choose their major as soon as they enter university and follow a set programme with few electives. Courses usually last a full year and end with a compulsory exam."
  - title: "Pets"
    body: "In the US pets are often treated like members of the family. Some Hispanics find that unusual, because in many Hispanic settings animals are given less importance."
  - title: "Sevilla"
    body: "In this city of Andalucía, Jewish, Arab and Christian cultures lived side by side for centuries, and all three still show. It is famous for its **Semana Santa** (Holy Week): brotherhoods (*cofradías*) carry huge floats (*pasos*) with scenes from the life of Christ through the streets."
