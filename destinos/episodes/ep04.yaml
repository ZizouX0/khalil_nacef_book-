# Episodio 4 · Perdido
# Sources: Textbook Lección 4 (pp. 38–50) only. The Workbook/Study Guide Lección 4 is not
# included yet: add its Vocabulario, pronunciation and cognate sections when it arrives.
# Words in vocab.core are the textbook's own Vocabulario list.

episode: 4
title: Perdido
title_en: Lost
pages: "Textbook pp. 38–50"

essentials:
  - "**Adjectives agree** with their noun, like the articles: *Osito es pequeño y negro*, *los perros son inteligentes y fieles*. Plural: vowel + **s** (*inteligentes*), consonant + **es** (*fieles*)."
  - "**Introducing people**: *Éste es…* (a man), *Ésta es…* (a woman), *Éstos son…* (men, or a mixed group), *Éstas son…* (women only)."
  - "**School subjects** are mostly cognates: *la biología, la filosofía, la literatura*. Some need a second look: *la química* = chemistry, *el comercio* = business. And *el colegio* is a school, not a college."
  - "**Le gusta** + verb = he / she likes to… (*No le gusta estudiar*). **Me gustaría** + verb = I would like to…"

grammar:
  - title: "Describing: adjectives agree"
    rule: "An adjective matches its noun in gender and number, just like *el · la · los · las*. Adjectives in **-o** have four forms; those in **-e** or a consonant have one form for both genders and only add the plural. Describing adjectives usually come **after** the noun: *un perro inteligente*."
    table:
      head: ["", "masc. · one", "masc. · more", "fem. · one", "fem. · more"]
      rows:
        - ["-o", "pequeñ**o**", "pequeñ**os**", "pequeñ**a**", "pequeñ**as**"]
        - ["-e", "inteligent**e**", "inteligent**es**", "inteligent**e**", "inteligent**es**"]
        - ["consonant", "fiel", "fiel**es**", "fiel", "fiel**es**"]
    examples:
      - ["Osito es pequeño y negro.", "Osito is small and black."]
      - ["Es muy inteligente y cariñoso.", "He's very intelligent and affectionate."]
      - ["Los perros son animales muy inteligentes. También son muy fieles.", "Dogs are very intelligent animals. They are also very loyal."]
      - ["Algunas personas creen que los gatos son más listos.", "Some people think cats are brighter."]
    trap: "*Hablador* ends in a consonant but adds **-a** for a woman: *habladora*. *Egoísta* ends in -a but is the same for both: *un perro egoísta, una persona egoísta*."

  - title: "Introducing people: éste es…"
    rule: "Choose the form that matches the person or people you are introducing."
    table:
      head: ["", "one person", "more than one"]
      rows:
        - ["male", "**Éste** es…", "**Éstos** son…"]
        - ["female", "**Ésta** es…", "**Éstas** son…"]
    examples:
      - ["Éste es mi padre.", "This is my father."]
      - ["Ésta es mi profesora de español.", "This is my Spanish teacher."]
      - ["Éstos son mis hijos.", "These are my children."]
      - ["Éstas son mis hijas.", "These are my daughters."]
    trap: "A mixed group takes **éstos**, like *los hijos*. Before a noun, no accent: *este semestre*. Newer spelling rules drop it in *éste es* too."

  - title: "Likes: le gusta, me gustaría"
    rule: "Likes and dislikes use the verb **gustar**. The book teaches it later; for now, learn these set phrases."
    examples:
      - ["Le gusta estudiar.", "He / she likes to study."]
      - ["No le gusta estudiar.", "He / she doesn't like to study."]
      - ["A Jaime no le gusta la escuela.", "Jaime doesn't like school."]
      - ["Me gustaría visitar la Catedral y la Giralda.", "I would like to visit the Cathedral and the Giralda."]
    trap: "To name the person who likes, put **a** in front: *a Jaime le gusta…*"

rules:
  - ["**-ar** verbs: **-o** I · **-a** he, she · **-an** they", "Yo tomo inglés. Mi amigo toma arte. Otros amigos toman química."]
  - ["**tomar** = to take (a course), to have (a drink)", "Toma inglés. · Toma un fino."]
  - ["**bueno · primero** lose the -o before a masculine singular noun.", "Es buen estudiante. · el primer año"]
  - ["**in- · im-** make opposites (**im-** before p and b).", "dependiente · independiente, paciente · impaciente"]
  - ["**-z** plural: z becomes **c** + es, same sound.", "el pez · los peces"]
  - ["**no** … **nada** = nothing: two negatives are normal.", "Miguel no sabe nada."]
  - ["**donde** = where, in a statement · **¿dónde?** with an accent, in a question", "Donde yo vivo, los chicos estudian inglés."]

verbs:
  met:
    - ["estudia · estudian", "estudiar", "he / she studies · they study"]
    - ["tomo · toma · toman", "tomar", "I take · he / she takes · they take"]
    - ["compra", "comprar", "he / she buys"]
    - ["llama", "llamar", "he / she calls"]
    - ["lleva", "llevar", "he / she takes (someone somewhere)"]
    - ["caminan", "caminar", "they walk"]
    - ["decide", "decidir", "he / she decides"]
    - ["acepta", "aceptar", "he / she accepts"]
    - ["sabe · no sabe", "saber", "he / she knows · doesn't know"]
    - ["hablé · habló", "hablar", "I spoke · he / she spoke"]
    - ["se pierde", "perderse", "he / she gets lost"]
    - ["vaya", "ir", "go"]
    - ["me gustaría", "gustar", "I would like"]

