cognates:
  rule: "Neither book has ¡Aumenta tu vocabulario! in this lesson. The new words still have English relatives: link them and they stick. And three words look English but aren't."
  false_friends:
    - ["el taller", "workshop", "taller", "más alto"]
    - ["la tuna", "student music group", "tuna", "el atún"]
    - ["recordar", "to remember", "to record", "grabar"]
  harder:
    - ["desayunar", "to have breakfast", "*des-* + *ayunar* (to fast): break + fast"]
    - ["aprender", "to learn", "think *apprentice*"]
    - ["levantarse", "to get up", "think *elevate*, *lever*"]
    - ["dormirse", "to fall asleep", "think *dormitory*, *dormant*"]
    - ["vestirse", "to get dressed", "think *vest*, *vestment*, and *el vestido* (Episode 7)"]
    - ["verde · azul", "green · blue", "think *verdant*, *azure*"]
    - ["el baile", "dance", "think *ball*, a formal dance: *un baile de gala*"]

sounds:
  - title: "j: never the English j"
    body: "Spanish **j** never sounds like *Jane* or *John*. In some places it is like English *h*; in others, especially Spain, it is rougher, made at the back of the mouth where you say *k*: *taco · Tajo, carro · jarro*. Say: **J**aime, **j**unio, **j**ulio, extran**j**ero, mu**j**er, hi**j**o."
  - title: "ge, gi sound like j"
    body: "Before **e** or **i**, **g** has the j sound: **g**eneral, inteli**g**ente, **g**eografía, reli**g**ión, psicolo**g**ía. So *Jorge* has it twice."
  - title: "Hard g, as in *go*"
    body: "At the start of a phrase or after **n**: **g**ato, **g**usto, **g**uerra, **g**racias, **g**ris, ten**g**o, ven**g**o."
  - title: "Soft g everywhere else"
    body: "The back of the tongue almost touches the roof of the mouth and lets air through; English has no such sound: a**g**osto, abo**g**ado, hasta lue**g**o, si**g**o. As with b and d (Episodes 7, 8), the word before decides: *gato · el gato, gusto · mucho gusto*."
  - title: "gue, gui: a silent u"
    body: "To keep g hard before e or i, Spanish writes **gu**, and the u is silent, as in *que, qui* (Episode 3): **gu**erra, **gu**itarra, si**gu**e, se**gu**ir. That is why *seguir* drops the u in **sigo**. In **gua** you do hear it: *len**gua**, i**gua**lmente*."
  - title: "Say it"
    body: "*Hasta luego, Gerardo.* (soft g, then j) · *El gusto es mío, doña Julia.* (soft g, j)"

phrases:
  - ["¿A qué hora te levantas? · Me levanto a las ocho y cuarto.", "What time do you get up? · I get up at a quarter past eight."]
  - ["Me acuesto temprano y me duermo inmediatamente.", "I go to bed early and fall asleep right away."]
  - ["¿Cuál es tu estación favorita? ¿Por qué?", "What's your favourite season? Why?"]
  - ["Hoy llevo ___. · Me gustaría llevar ___.", "Today I'm wearing ___. · I'd like to wear ___."]
  - ["¿Ve Ud. aquel vestido rojo? ¿No lo tiene en rosado?", "Do you see that red dress over there? Don't you have it in pink?"]
  - ["Un café solo, por favor. · Un café con leche, por favor.", "A black coffee, please. · A coffee with milk, please."]
  - ["Quiero comprar esta blusa de color salmón, por favor.", "I'd like to buy this salmon-coloured blouse, please."]
  - ["No, gracias, no necesito blusas. · ¿Me permite verlas?", "No, thank you, I don't need any blouses. · May I see them?"]
  - ["¿Qué colores prefieres?", "What colours do you prefer?"]
  - ["Recuerdo muy bien a todos mis maestros de primaria.", "I remember all my primary-school teachers very well."]
  - ["El gusto es mío.", "The pleasure is mine."]

culture:
  - title: "Un café, por favor"
    body: "**Un café** (*nada más*) or **un café solo** is very strong black coffee, almost like espresso. **Un café con leche** mixes that strong coffee with warm or hot milk, *la leche*; in many places the milk comes on the side and you add it to taste."
  - title: "La tuna"
    body: "A group of university students who sing and play guitars, lutes and tambourines in the street, dressed in old-style black student capes. The tradition is centuries old."
  - title: "La música española"
    body: "Spain's variety shows in its music and dances. Its best-known folk music is probably Andalucía's, and **el flamenco** is part of it: songs and dances with deep Eastern, Arab and Romani (*gitano*) roots, with hand-clapping (*palmas*), guitars and shouts of **¡olé!** **La zarzuela** is Spain's own light opera, mixing speech, song and dance, about the customs of each region. Classical composers: **Isaac Albéniz** (*Iberia*) and **Manuel de Falla** (*El amor brujo*, *El sombrero de tres picos*). Opera singers: Montserrat Caballé, Plácido Domingo, José Carreras. Young people listen mostly to *rock* and to imported music; in pop, the book names **Julio Iglesias**, the Catalan **Joan Manuel Serrat** and the group **Mecano** (which broke up in the 1990s)."
