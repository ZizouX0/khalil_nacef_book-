place:
  name: La Gavia
  facts:
    - ["Es una hacienda de la época colonial.", "A colonial-era estate."]
    - ["Está al suroeste de la Ciudad de México, cerca de Toluca.", "Southwest of Mexico City, near Toluca."]
    - ["Es la residencia principal de don Fernando.", "Don Fernando's main home."]
    - ["Don Fernando compró La Gavia en ruinas, para restaurarla.", "He bought it in ruins, to restore it."]
    - ["Tiene una entrada majestuosa, una capilla muy bonita, un patio muy agradable y una biblioteca impresionante.", "A grand entrance, a pretty chapel, a pleasant courtyard and an impressive library."]
  timeline:
    - ["XVI", "construcción", "built"]
    - ["XVII", "gran esplendor", "its golden age"]
    - ["XVIII", "los jesuitas", "the Jesuits move in"]
    - ["XIX", "la Independencia", "a centre of the independence movement"]
    - ["XX", "la Revolución de 1910", "partly destroyed"]
  note: "*Siglo* means **century**, and Spanish writes centuries in Roman numerals: *el siglo XVI* = the 16th century."

verbs:
  table:
    verb: ser
    meaning: to be
    irregular: true
    forms:
      - ["soy", "I am"]
      - ["eres", "you are"]
      - ["es", "he, she is · you are"]
      - ["somos", "we are"]
      - ["sois", "you are"]
      - ["son", "they are · you are"]
    hook: "The plural forms all start with **s-**: **s**omos, **s**ois, **s**on."
  notes:
    - label: Four ways to say *you are*
      text: "**eres** to one friend (*tú*), **es** to one person politely (*usted*), **sois** to a group in Spain (*vosotros*), **son** to a group (*ustedes*). The lessons ahead explain each one."
  met:
    - ["tiene", "tener", "he / she has"]
    - ["vive · vivo", "vivir", "he / she lives · I live"]
    - ["necesita", "necesitar", "he / she needs"]
    - ["hay", "haber", "there is · there are"]
    - ["habla", "hablar", "he / she speaks"]

grammar:
  - title: "Two jobs for ser"
    uses:
      - label: "A = B"
        text: "Say what someone **is**."
        examples:
          - ["Raquel es abogada.", "Raquel = abogada"]
          - ["Don Fernando es cliente.", "don Fernando = cliente"]
      - label: "ser de"
        text: "Say where someone is **from**."
        examples:
          - ["Raquel es de los Estados Unidos.", "Raquel is from the United States."]
          - ["Don Fernando es de España.", "Don Fernando is from Spain."]
rules:
    - ["*Yo* is optional: the verb already says who.", "(Yo) soy de México."]
    - ["No *un / una* before a job.", "Raquel es abogada. Juan es profesor de literatura."]
    - ["**-s** means more than one, and *es* becomes *son*.", "Juan es mexicano. · Juan y Ramón son mexicanos."]
    - ["*… y yo* (… and I) takes **somos**.", "Carlos, Juan y yo somos hijos de don Fernando."]
    - ["**Hay** = there is / there are.", "En la carta hay un secreto."]
    - ["**un / una** = a, an · **el / la** = the", "una carta · el patriarca"]
    - ["**¿Quién?** for one person, **¿Quiénes?** for more.", "¿Quién es don Fernando? ¿Quiénes son?"]

