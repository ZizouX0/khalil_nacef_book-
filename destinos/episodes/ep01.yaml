verbs:
  table:
    verb: ser
    meaning: to be (who or what someone is)
    forms: [soy, eres, es, somos, sois, son]
    irregular: true
  met:
    - ["llamarse", "me llamo · se llama", "to be called"]
    - ["vivir", "vive", "to live"]
    - ["trabajar", "trabaja", "to work"]
    - ["escribir", "escribe", "to write"]
    - ["creer", "cree", "to believe"]
    - ["querer", "quiere", "to want; e becomes ie"]
    - ["saber", "no sé · sabe", "to know (a fact)"]
    - ["ir a + verb", "va a investigar", "is going to …"]

grammar:
  - title: "Ser: saying who someone is"
    rule: >-
      Use **ser** to say who someone is, what they do and where they come from.
      Spanish usually drops the subject: *Soy Raquel* is more natural than *Yo soy Raquel*,
      because the ending already tells you who.
      Did you notice *está enfermo*? For how someone **is right now** (ill, tired, happy),
      Spanish switches to **estar**. That contrast comes back in later episodes.
    examples:
      - ["Raquel es abogada.", "Raquel is a lawyer."]
      - ["Teresa Suárez es de España.", "Teresa Suárez is from Spain."]
      - ["Ramón y Carlos son hermanos.", "Ramón and Carlos are brothers."]
    trap: >-
      No *un/una* before a job: **Raquel es abogada**, not ~~Raquel es una abogada~~.
      The article comes back only when you add an adjective: *Es una abogada muy buena.*

  - title: "El or la: every noun has a gender"
    rule: >-
      Learn every noun with its article. Most nouns in **-o** are masculine, most in **-a**
      are feminine, but the article is what you can trust: *el viaje*, *la verdad*.
      A masculine plural covers a mixed group, so *los hijos de don Fernando* includes his daughter Mercedes.
    examples:
      - ["el hijo · los hijos", "the son · the children"]
      - ["la carta · las cartas", "the letter · the letters"]
      - ["el abogado · la abogada", "the lawyer (man · woman)"]
    trap: >-
      *Los padres* means **parents**, not only fathers. *Mis padres* = my mother and my father.

  - title: "Asking: ¿Quién? ¿Dónde? ¿De dónde?"
    rule: >-
      The narrator keeps asking you questions, and you can answer them out loud.
      Question words carry an accent, and a question opens with **¿**.
    examples:
      - ["¿Quién es Rosario?", "Who is Rosario?"]
      - ["¿Dónde vive don Fernando?", "Where does don Fernando live?"]
      - ["¿De dónde es Teresa?", "Where is Teresa from?"]
    trap: >-
      No *'s* in Spanish. Possession goes with **de**: *la carta de Teresa*, *el hermano de don Fernando*.

phrases:
  - ["Me llamo Raquel.", "My name is Raquel."]
  - ["¿Cómo se llama?", "What is his / her / your name?"]
  - ["Es de Los Ángeles.", "She's from Los Angeles."]
  - ["Vive en México.", "He lives in Mexico."]
  - ["Es el hermano de don Fernando.", "He is don Fernando's brother."]
  - ["¿Quién es?", "Who is it? / Who is he / she?"]
  - ["No sé.", "I don't know."]
  - ["Quiere saber la verdad.", "He wants to know the truth."]

sound:
  title: "R at the start of a word"
  body: >-
    An **r** at the start of a word is rolled, just like **rr**. Every name in this episode
    is practice: **R**aquel, **R**odríguez, **R**osario, and *gue**rr**a*. Between vowels a single **r** is
    one quick tap: *Te**r**esa*, *prime**r**a*. Say *pero* (but) and *perro* (dog) until they sound different.

culture:
  title: "Don, doña, and two surnames"
  body: >-
    *Don* and *doña* go before a **first name** to show respect to an older person: *don Fernando*, never
    ~~don Castillo~~. And Spanish speakers carry two surnames, father's first and mother's second:
    *Fernando **Castillo Saavedra***. After the Civil War (1936–1939), Mexico took in thousands of refugees from Spain.

