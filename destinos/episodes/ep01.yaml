# Episodio 1 · La carta
# Sources: Textbook Lección 1 (pp. 4–10) and Workbook/Study Guide Lección 1 (pp. 3–8).
# Words in vocab.core are the two books' own Vocabulario lists.

episode: 1
title: La carta
title_en: The letter
setting: La Gavia, México
stop: mexico
pages: "Textbook pp. 4–10 · Workbook pp. 3–8"

essentials:
  - "**Ser** means *to be*: soy, eres, es, somos, sois, son. Use it to say **who** someone is (*Raquel es abogada*) and **where they are from** (*Don Fernando es de España*)."
  - "**Cognates**: a Spanish word that looks like an English word usually means the same thing (*historia, importante, misterioso*). Watch for false friends: *librería* = bookstore, *colegio* = high school."
  - "**The story**: Raquel, a lawyer in Los Angeles, takes a special case for don Fernando, the head of a family in Mexico. His letter from Spain hides a secret."
  - "**How to watch**: follow the narrator and Raquel's summary at the end. Get the gist, guess from context, and skip the words you don't know."

story:
  - es: "Raquel Rodríguez es abogada. Es mexicoamericana y vive en Los Ángeles."
    en: "Raquel Rodríguez is a lawyer. She is Mexican-American and lives in Los Angeles."
  - es: "Don Fernando Castillo Saavedra es el patriarca de la familia Castillo. Es de España, pero vive en México, en La Gavia."
    en: "Don Fernando Castillo Saavedra is the head of the Castillo family. He is from Spain, but he lives in Mexico, at La Gavia."
  - es: "Don Fernando necesita un doctor. Es paciente de Julio, el médico."
    en: "Don Fernando needs a doctor. He is the patient of Julio, the doctor."
  - es: "Don Fernando tiene una carta muy importante. Es de una señora de Sevilla, España: Teresa Suárez."
    en: "Don Fernando has a very important letter. It is from a woman in Seville, Spain: Teresa Suárez."
  - es: "En la carta hay un secreto. Es sobre Rosario, la primera esposa de don Fernando, una persona muy misteriosa."
    en: "There is a secret in the letter. It is about Rosario, don Fernando's first wife, a very mysterious person."
  - es: "Don Fernando es el cliente de Raquel en un caso especial."
    en: "Don Fernando is Raquel's client in a special case."

