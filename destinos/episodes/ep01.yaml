# Episode 1 — written before the textbook pages arrived.
# Check vocabulary and grammar against Lección 1 when the books are in.

episode: 1
title: La carta
title_en: The letter
setting: La Gavia, México
stop: mexico


story:
  - es: "Raquel Rodríguez es abogada. Vive y trabaja en Los Ángeles."
    en: "Raquel Rodríguez is a lawyer. She lives and works in Los Angeles."
  - es: "Don Fernando Castillo es un señor muy viejo y está enfermo. Vive en La Gavia, una hacienda en México."
    en: "Don Fernando Castillo is a very old man and he is ill. He lives at La Gavia, an estate in Mexico."
  - es: "Una señora de España, Teresa Suárez, le escribe una carta."
    en: "A woman from Spain, Teresa Suárez, writes him a letter."
  - es: "La carta habla de Rosario, la primera esposa de don Fernando. Él cree que Rosario murió en la Guerra Civil española."
    en: "The letter talks about Rosario, don Fernando's first wife. He believes Rosario died in the Spanish Civil War."
  - es: "Don Fernando quiere saber la verdad. Raquel va a investigar el caso, y su viaje empieza en Sevilla."
    en: "Don Fernando wants to know the truth. Raquel is going to investigate the case, and her journey starts in Seville."

