cognates:
  rule: "A **cognate** looks like an English word and means the same thing. Spanish is full of them, which is why you understood more of Episode 1 than you expected. When a word looks familiar, trust it; when it doesn't, guess from the words around it, or skip it."
  patterns:
    - ["-dad", "-ty", "universidad, cualidad", "university, quality"]
    - ["-ción", "-tion", "información, combinación", "information, combination"]
    - ["-oso · -osa", "-ous", "misterioso, delicioso", "mysterious, delicious"]
    - ["-ico · -ica", "-ic", "histórico, esquemático", "historic, schematic"]
    - ["es- + consonant", "s-", "España, estudiante, establo", "Spain, student, stable"]
  harder:
    - ["preocupado", "worried", "think *preoccupied*"]
    - ["la esposa", "wife", "think *spouse*"]
    - ["los datos", "information", "think *data*"]
  false_friends:
    - ["la librería", "bookstore", "library", "la biblioteca"]
    - ["el colegio", "high school", "college", "la universidad"]
  borrowed: "Words travel both ways: English took **patio, rodeo, canyon** from Spanish, and Spanish took **automóvil, computadora, radio** from English. Even the title is a cognate: *Destinos* means both **destinies** and **destinations**."

sounds:
  - title: "Cognates look alike but sound different"
    body: "Don't read *historia* or *importante* the English way. Copy the speaker on the audio, vowel by vowel."
  - title: "H is silent"
    body: "**h**acienda, **h**istoria, **h**ombre, **h**ay, **h**ispano: start straight on the vowel."
  - title: "The accent mark shows the strong syllable"
    body: "lec**ción**, tam**bién**, ¿**quién**?, Ro**drí**guez, jar**dín**."
  - title: "Five short vowels"
    body: "**a e i o u** always sound the same, short and clean: *sí, no, es, son, muy*."

phrases:
  - ["Soy estudiante de español.", "I'm a student of Spanish."]
  - ["Soy de ___. · Vivo en ___.", "I'm from ___. · I live in ___."]
  - ["Soy abogada. Don Fernando es mi cliente.", "I'm a lawyer. Don Fernando is my client."]
  - ["Carlos, Juan y yo somos hijos de don Fernando.", "Carlos, Juan and I are don Fernando's sons."]
  - ["¿Quién es? · ¿Quiénes son?", "Who is it? · Who are they?"]
  - ["¿Quién habla?", "Who is speaking?"]
  - ["En la carta hay un secreto.", "There is a secret in the letter."]
  - ["Es una persona muy misteriosa.", "He / she is a very mysterious person."]
  - ["Es una historia de aventuras, de secretos y de amor.", "It's a story of adventure, secrets and love."]
  - ["¿Y tú?", "And you?"]

culture:
  - title: "Don + first name"
    body: "*Don* is a title of respect for a man, always with his **first** name: *don Fernando*, never ~~don Castillo~~."
  - title: "Two surnames"
    body: "*Fernando **Castillo Saavedra***: Hispanic names have two family names. Lección 3 explains how they work."
  - title: "The envelope"
    body: "**Sra.** = señora · **Calle** = street · **México, D.F.** = Mexico City (*Distrito Federal*) · **Por avión** = air mail."
