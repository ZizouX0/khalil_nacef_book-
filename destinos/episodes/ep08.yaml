cognates:
  rule: "Neither book has a cognate section in this lesson, but its texts hide three classic traps for English speakers, and a few words you can work out from ones you know."
  false_friends:
    - ["embarazada", "pregnant", "embarrassed", "avergonzada"]
    - ["el pariente", "relative", "parent", "el padre · la madre"]
    - ["molestar", "to bother", "to molest", "abusar de"]
  harder:
    - ["el nacimiento", "birth", "*nacer* = to be born: think *natal*"]
    - ["agradecido", "grateful", "think *gracias*"]
    - ["la amabilidad", "kindness", "*amable* = kind: think *amiable*"]
    - ["desesperadamente", "desperately", "-mente = -ly (Episode 3)"]

sounds:
  - title: "b and v: one sound"
    body: "In most of the Spanish-speaking world **b** and **v** sound exactly the same, so *Barcelona* and *Valencia* start alike. Never use the English *v*, with the teeth on the lip."
  - title: "Hard b: at the start, or after m, n"
    body: "At the start of a phrase, or after m or n, the lips close, as in English *b*: **b**arrio, **v**iajar, **V**alencia, hom**b**re, miem**b**ro, Alham**b**ra, in**v**estigar."
  - title: "Soft b: everywhere else"
    body: "The lips almost touch and let air through; English has no such sound: ha**b**lar, tra**b**ajar, toda**v**ía, sá**b**ado, ha**b**itación, re**v**ela, Se**v**illa."
  - title: "One word, two sounds"
    body: "What comes before decides: **b**ueno · es **b**ueno, **v**iaje · el **v**iaje, **v**a · se **v**a, **b**ien · muy **b**ien, en **V**enezuela · de **V**enezuela. The first of each pair is hard, the second soft."
  - title: "Questions: falling or rising"
    body: "With a question word, the voice **falls** at the end: *¿Dónde vive Rosario?* With no question word, it **rises**: *¿Sabes la dirección?*"

phrases:
  - ["¿Es Ud. pariente de Fernando?", "Are you a relative of Fernando's?"]
  - ["Conozco bien a Pedro, el hermano de don Fernando.", "I know Pedro, don Fernando's brother, well."]
  - ["Eso era casi imposible cuando yo tenía su edad.", "That was almost impossible when I was your age."]
  - ["Mi madre está muy agradecida y quiere invitarla a cenar.", "My mother is very grateful and wants to invite you to dinner."]
  - ["No quiere ser una molestia.", "She doesn't want to be a bother."]
  - ["¿Cuándo naciste? · ¿Dónde naciste?", "When were you born? · Where were you born?"]
  - ["¿Cuánto tiempo vas a estar aquí?", "How long are you going to be here?"]
  - ["¿Cuántas lenguas hablas? · ¿Por qué estudias español?", "How many languages do you speak? · Why are you studying Spanish?"]
  - ["Siempre se olvida de su cartera.", "He / she always forgets his / her wallet."]

culture:
  - title: "Nos podemos tutear"
    body: "Raquel says *usted* to people she doesn't know well. When someone offers to **tutearse** or **tratarse de tú** (say *tú* to each other), switch to the *tú* forms: *trabaja* becomes *trabajas*. The welcome changes too: *Está en su casa* becomes **Estás en tu casa**, make yourself at home."
  - title: "Las tapas"
    body: "Small snacks: **las aceitunas** (olives), **la tortilla española** (potato omelette), **el jamón serrano** (cured ham), **los calamares fritos** (fried squid rings). A snack and a drink in the late afternoon is a popular Hispanic custom. Raise a *fino* with **¡Salud!** (To your health!). Bars have no bad image: children may go with their parents."
  - title: "Las diferencias regionales"
    body: "Spain has 17 *comunidades autónomas* (Episode 3), each with its own landscape and culture."
    rows:
      - ["Cataluña", "prosperous, industrial; *catalán*; Barcelona, Spain's second city"]
      - ["las dos Castillas", "the centre: La Mancha's windmills, Salamanca, Segovia's aqueduct"]
      - ["Andalucía", "the south: home of Picasso, Velázquez, Falla and García Lorca"]
      - ["el País Vasco", "industrial and rich; a language of unknown origin"]
      - ["Extremadura", "home of the explorers Cortés, Pizarro and Balboa"]
      - ["Asturias · Canarias", "*la Suiza española* · the Hawaii of the Atlantic, with el Teide"]
