cognates:
  rule: "From this lesson on, the books teach cognate **endings**: learn one and you can read hundreds of words. Every noun with these three endings is **feminine**, and the stress falls at the end."
  patterns:
    - ["-ción", "-tion", "la nación, la conversación, la solución", "nation, conversation, solution"]
    - ["-sión", "-sion", "la tensión, la expresión, la televisión", "tension, expression, television"]
    - ["-dad", "-ty", "la ciudad, la comunidad, la rivalidad", "city, community, rivalry"]

