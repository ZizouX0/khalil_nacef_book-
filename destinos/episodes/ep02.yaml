sounds:
  - title: "Two letters English doesn't have"
    body: "**ñ** (*España*) and **rr** (*Monterrey*), shaded above. Words starting with ñ have their own section in the dictionary, after n."
  - title: "Ch and ll"
    body: "They were separate letters until 1994. In an older dictionary, *coche* comes after *coco*, in its own ch section."

phrases:
  - ["Tengo una familia muy grande.", "I have a very big family."]
  - ["Tengo dos hermanos. · No tengo hijos.", "I have two brothers. · I don't have children."]
  - ["Mi madre se llama ___. Vive en ___.", "My mother's name is ___. She lives in ___."]
  - ["Mis padres son ___ y ___.", "My parents are ___ and ___."]
  - ["Es la esposa de Ramón.", "She is Ramón's wife."]
  - ["¿Quién es su padre?", "Who is his / her father?"]
  - ["Sé que es cierto. · Creo que es falso.", "I know it's true. · I think it's false."]
