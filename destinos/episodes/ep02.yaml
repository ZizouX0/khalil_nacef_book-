  - ["Llama a tus hermanos.", "Call your brothers and sisters."]
  - ["Hoy vino el médico.", "The doctor came today."]
  - ["Tiene que ver con…", "It has to do with…"]

culture:
  - title: "Hispanic families"
    body: "The extended family often lives under one roof: widowed grandparents, unmarried aunts and uncles, and grown children, sometimes even married ones, like Ramón. It is changing in cities, but families stay close."
  - title: "Abbreviations"
    body: "**Q.E.P.D.** = *Que en paz descanse* (rest in peace) · **S.A.** = *Sociedad Anónima*, the Spanish *Inc.*"
  - title: "La Guerra Civil española (1936–1939)"
    body: "The **republicanos**, most of them democrats, against the **nacionales**, allied with Hitler and Mussolini and led by General **Francisco Franco**, who became dictator of Spain in 1939. Picasso painted *Guernica* about the bombing; it now hangs in the Museo Reina Sofía, Madrid."
    rows:
      - ["1931–1936", "La Segunda República"]
      - ["18 julio 1936", "Franco's rebellion starts the war"]
      - ["1936", "The poet Federico García Lorca is killed in Granada"]
      - ["1937", "The bombing of Guernica"]
      - ["1 abril 1939", "The war ends"]
