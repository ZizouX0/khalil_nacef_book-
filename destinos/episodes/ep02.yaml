# Episodio 2 · El secreto
# Sources: Textbook Lección 2 (pp. 14–25) and Workbook/Study Guide Lección 2 (pp. 10–18).
# Words in vocab.core are the two books' own Vocabulario lists.
# Letter names in the alphabet are the standard Spanish ones; the books give the example names.

episode: 2
title: El secreto
title_en: The secret
pages: "Textbook pp. 14–25 · Workbook pp. 10–18"

essentials:
  - "**Family words**: the masculine plural covers the whole group. *Los padres* = parents, *los hijos* = children, *los hermanos* = brothers and sisters, *los tíos* = uncles and aunts."
  - "**Greetings**: *Hola* (any time), *Buenos días* (morning), *Buenas tardes* (afternoon), *Buenas noches* (evening)."
  - "**Every noun is masculine or feminine**, so learn it with its article: *el · los · un · unos* for masculine, *la · las · una · unas* for feminine."
  - "**Possession**: *de* + name (*la esposa de Ramón* = Ramón's wife), or *mi, tu, su, nuestro, vuestro*, which agree with the thing owned (*mis hijos*)."

greetings:
  - ["Hola.", "Hello.", "Almost any situation, but not usually to answer the phone."]
  - ["Buenos días.", "Good morning.", "In the morning."]
  - ["Buenas tardes.", "Good afternoon.", "In the afternoon."]
  - ["Buenas noches.", "Good evening.", "In the evening, and to say good night."]

grammar:
  - title: "The and a: el, la, un, una"
    rule: "Spanish articles change with the noun: masculine or feminine, one or more. *Unos / unas* means **some**."
    table:
      head: ["", "masc. · one", "masc. · more", "fem. · one", "fem. · more"]
      rows:
        - ["the", "**el** secreto", "**los** secretos", "**la** carta", "**las** cartas"]
        - ["a, an · some", "**un** secreto", "**unos** secretos", "**una** carta", "**unas** cartas"]

  - title: "Masculine or feminine?"
    uses:
      - label: "el"
        text: "Male people, and most nouns in **-o**."
        examples:
          - ["el hombre", "man"]
          - ["el hermano", "brother"]
          - ["el concepto", "concept"]
      - label: "la"
        text: "Female people, and nouns in **-a, -ión, -d**."
        examples:
          - ["la mujer", "woman"]
          - ["la compañía", "company"]
          - ["la relación", "relationship"]
          - ["la universidad", "university"]
    trap: "Other endings have no rule, so learn the article with the word: *el español, la serie*. And two words in **-a** are masculine: *el patriarca, el idioma*."

  - title: "One person, two forms"
    table:
      head: ["", "masculine", "feminine"]
      rows:
        - ["-o becomes -a", "el hij**o** · el espos**o**", "la hij**a** · la espos**a**"]
        - ["consonant + a", "el profesor · el director", "la profesor**a** · la director**a**"]
        - ["one form only", "**el** estudiante", "**la** estudiante"]

  - title: "Plurals"
    table:
      head: ["", "one", "more than one"]
      rows:
        - ["vowel + s", "hijo · carta", "hijo**s** · carta**s**"]
        - ["consonant + es", "profesor · ciudad", "profesor**es** · ciudad**es**"]
        - ["-ión drops its accent", "lección · relación", "lecci**ones** · relaci**ones**"]
    trap: "The masculine plural covers a mixed group: *los hijos de don Fernando* includes Mercedes."

  - title: "Possession: de, mi, su…"
    rule: "There is no *'s* in Spanish. Use **de** + name: *la familia **de** Fernando* = Fernando's family. Or use a possessive, which agrees with the thing owned, not with the owner: *mis hijos* = my sons."
    table:
      head: ["", "one thing", "several things"]
      rows:
        - ["my", "**mi** hijo · **mi** hija", "**mis** hijos · **mis** hijas"]
        - ["your (tú)", "**tu** hijo", "**tus** hijos"]
        - ["his, her, its · your (usted)", "**su** hijo", "**sus** hijos"]
        - ["our", "**nuestro** hijo · **nuestra** hija", "**nuestros** hijos · **nuestras** hijas"]
        - ["your (vosotros)", "**vuestro** hijo · **vuestra** hija", "**vuestros** hijos · **vuestras** hijas"]
        - ["their · your (ustedes)", "**su** hijo", "**sus** hijos"]
    trap: "*Su* can mean his, her, its, their or your: the sentence tells you which. *Ramón vive con su esposa* = his wife. And **tu** (your) has no accent; **tú** (you) does."

rules:
  - ["**¿Quién?** for one person, **¿Quiénes?** for more.", "¿Quiénes fueron sus hijos?"]
  - ["**fue · fueron** = was · were: the past of *es · son*.", "Su padre fue Pablo Picasso."]
  - ["**ya** = already · **ya no** = no longer", "Su madre ya no vive."]
  - ["**está muerto / muerta** = is dead · **ya murió** = already died", "Mi esposa Carmen ya murió; está muerta."]
  - ["**otro / otra** = another, with no *un* in front.", "Don Fernando tiene otro hijo."]
  - ["**Tengo** = I have · **No tengo…** = I don't have…", "Tengo tres hermanos. No tengo hijos."]

verbs:
  met:
    - ["tengo · tiene · tienen", "tener", "I have · he / she has · they have"]
    - ["se llama · se llaman", "llamarse", "he / she is called · they are called"]
    - ["vive · viven", "vivir", "he / she lives · they live"]
    - ["trabajan", "trabajar", "they work"]
    - ["fue · fueron", "ser", "was · were"]
    - ["murió", "morir", "died"]
    - ["sé · no sé", "saber", "I know · I don't know"]
    - ["creo", "creer", "I believe, I think"]
    - ["llama · va a llamar", "llamar", "call! · is going to call"]
    - ["dice", "decir", "says"]
    - ["¿puedes…?", "poder", "can you…?"]

