sounds:
  - title: "ch: as in church"
    body: "**ch** sounds like English *ch* in *church*: mu**ch**o, **ch**ampiñones, le**ch**uga, **ch**ocolate, **ch**ico, ano**ch**e, **ch**orizo. It used to be a letter of its own (Episode 2)."
  - title: "Say it"
    body: "*Los muchachos escuchan a Charo. · Chela es una chica chilena.*"

phrases:
  - ["Hace unos pocos días que te conozco… y parece como si hiciera muchos años.", "I've known you for a few days… and it's as if it had been many years."]
  - ["Te voy a extrañar. —Yo también a ti.", "I'm going to miss you. —I'll miss you too."]
  - ["Ángel es el único pariente que tengo.", "Ángel is the only relative I have."]
  - ["Debería tomar el primer vuelo. No puedo tardarme mucho.", "I should take the first flight. I can't take long."]
  - ["Salgo mal en las fotos.", "I don't come out well in photos."]
  - ["Yo también tengo una sorpresa para ti.", "I have a surprise for you too."]

culture:
  - title: "Otras ciudades argentinas"
    body: "**Córdoba**, in the centre, founded in 1573, with the country's oldest university · **Rosario**, a busy port on the Paraná river · **Mendoza**, at the foot of the Andes, famous for its wine · **Mar del Plata**, on the Atlantic, the great beach resort: summer there is December to February."
