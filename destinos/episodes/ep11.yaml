phrases:
  - ["¿A qué hora te levantas durante la semana? · Me levanto a las siete menos cuarto.", "What time do you get up during the week? · I get up at a quarter to seven."]
  - ["¿A qué hora sales de casa para ir a la universidad?", "What time do you leave home to go to the university?"]
  - ["¿Conoces a muchos estudiantes aquí?", "Do you know many students here?"]
  - ["Los sábados me gusta levantarme tarde.", "On Saturdays I like to get up late."]
  - ["Queremos pasarlo bien.", "We want to have a good time."]
  - ["¿Te sientes cansado cuando vuelves de la universidad?", "Do you feel tired when you get back from the university?"]
  - ["Me gustaría pasar unos días más en Madrid. ¡Hay tanto que ver!", "I'd like to spend a few more days in Madrid. There's so much to see!"]
  - ["La agencia no puede confirmar su reservación.", "The agency can't confirm her reservation."]

culture:
  - title: "Las fiestas de España"
    body: "The guide's list: **el Día del Año Nuevo** (1 January), **el Día de los Reyes Magos** (6 January, the day Spanish children traditionally get their presents), **la Semana Santa** (Holy Week, in spring), **la Feria de Sevilla** (April), **la noche de San Juan** (the night of 23 June), **la fiesta de San Fermín** (July, in Pamplona) and **la Navidad** (December)."
