sounds:
  - title: "p and t: no puff of air"
    body: "Like Spanish *k* (Episode 10): say *p* and *t* as in English *spin, stan*, not *pin, tan*. **p**adre, **p**rofesor, es**p**erar · **t**arde, **t**em**p**rano, his**t**oria."
  - title: "t: tongue on the teeth"
    body: "For Spanish **t** the tip of the tongue touches the back of the upper front teeth, not the ridge above them: *tarde, tú, también, actividad*."
  - title: "Say it"
    body: "*Su primer esposo es pintor. · ¿Tienes que trabajar en el taller? · También investigan teorías matemáticas.*"

phrases:
  - ["¿Hay una habitación disponible?", "Is there a room available?"]
  - ["Tengo una suite. —Está bien. La tomo.", "I have a suite. —All right. I'll take it."]
  - ["Mi nombre es Raquel Rodríguez. —Encantado. ¿En qué la puedo servir?", "My name is Raquel Rodríguez. —Pleased to meet you. How may I help you?"]
  - ["Para mí es un gusto conocerla.", "It's a pleasure for me to meet you."]
  - ["¿Podemos tutearnos? —De acuerdo.", "Can we say tú to each other? —All right."]
  - ["Es mi medio hermano. Lleva el apellido de su padre.", "He's my half-brother. He has his father's surname."]
  - ["Raquel toca a la puerta y un joven desconocido contesta.", "Raquel knocks on the door and a young man she doesn't know answers."]
  - ["No conozco a nadie.", "I don't know anyone."]

culture:
  - title: "La Pampa y los gauchos"
    body: "**La Pampa** is the great plain in the middle of Argentina, cattle country. Its **estancias** are huge ranches, and the **gaucho**, the horseman who herded the cattle, is Argentina's folk hero, like the American cowboy. His national poem is *Martín Fierro* (1872), by José Hernández."
