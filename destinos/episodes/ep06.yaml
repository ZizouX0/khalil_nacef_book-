# Episodio 6 · ¿Maestra?
# Sources: Textbook Lección 6 (pp. 64–68) and Workbook/Study Guide Lección 6 (pp. 56–61).
# A review lesson. Words in vocab.core are the textbook's own Vocabulario list; the workbook has none.
# The workbook's Resumen de gramática (Lecciones 1–5) is a pointer table; the present tense and
# telling the time are grammar points with tables. Neither book has Pronunciación, ¡Aumenta tu
# vocabulario! or a Nota cultural for this lesson: the culture note on the ONCE is added.

episode: 6
title: "¿Maestra?"
title_en: Teacher?
pages: "Textbook pp. 64–68 · Workbook pp. 56–61"

essentials:
  - "**A review lesson.** The present tense of all regular verbs and *ir* (Episode 5) come back in every exercise: if *hablamos, coméis, viven, vamos* don't come instantly, go back to Episode 5."
  - "**Question words** always carry an accent: *¿dónde?, ¿cómo?, ¿cuál?, ¿qué?, ¿quién?*. *What is your…?* is **¿Cuál es…?**, not *¿Qué es…?*"
  - "**From… to…**: *de las tres y media a las seis* · *de lunes a viernes*."
  - "**Small words**: *a casa* (home) · *en casa* (at home) · *conmigo* (with me) · *contigo* (with you). And two more odd *yo* forms: *tengo, salgo*."

verbs:
  met:
    - ["salgo · sale", "salir", "I leave · he / she leaves"]
    - ["tengo", "tener", "I have"]
    - ["encuentra", "encontrar", "he / she finds"]
    - ["quieren", "querer", "they want"]
    - ["¿qué pasa?", "pasar", "what happens? what's going on?"]
    - ["voy, vas, va…", "ir", "the verb card is in Episode 5"]

grammar:
  - title: "The present tense, in use"
    rule: "The table of all six forms is in **Episode 5**. Here are the workbook's own sentences to read until the endings come without thinking."
    examples:
      - ["Tú escribes mucho en la clase de inglés.", "You write a lot in English class."]
      - ["A veces yo estudio en la cafetería.", "Sometimes I study in the cafeteria."]
      - ["Los fines de semana nosotras trabajamos en un restaurante.", "On weekends we (women) work in a restaurant."]
      - ["Vosotros debéis comprar dos libros para la clase de historia.", "You (all) must buy two books for history class."]
    trap: "**Ud. · Uds.** take the same form as *él · ellos*: *Uds. los profesores explic**an** bien las lecciones*. And **nosotras, vosotras** are for groups of women only."

  - title: "Question words"
    rule: "Every question word carries an accent, and the question opens with **¿**. A little word like *con* or *a* goes in front: *¿con quién?, ¿a qué hora?*"
    examples:
      - ["**¿Dónde** vives?", "Where do you live?"]
      - ["**¿Cuál** es tu clase favorita?", "What is your favourite class?"]
      - ["**¿Qué** estudias ahora mismo?", "What are you studying right now?"]
      - ["**¿Quién** estudia contigo?", "Who studies with you?"]
      - ["**¿Cómo** pasas los sábados?", "How do you spend Saturdays?"]
      - ["**¿Con quién** cenas, generalmente?", "Who do you usually have dinner with?"]
    trap: "*What is your…?* is **¿Cuál es…?**, not ~~¿Qué es tu clase favorita?~~ (*¿Qué es…?* asks for a definition). And a name is asked with **¿Cómo?** (*how*): *¿Cómo se llama?*"

  - title: "From… to…: de… a…"
    rule: "Telling the time and *a la · a las* are in **Episode 5**. New here: **de** … **a** … for a stretch of time, with the article on both clock times."
    examples:
      - ["Trabajo de las tres y media a las seis y cuarto.", "I work from half past three to quarter past six."]
      - ["Tengo clase de química a las ocho.", "I have chemistry class at eight."]
      - ["¿A qué hora es tu primera clase?", "What time is your first class?"]
    trap: "Keep the article on both times: *de **la** una **a las** dos* (from one to two), never ~~de una a dos~~."

  - title: "Review: already in your notebook"
    rule: "The workbook opens with a summary of Lecciones 1–5. Nothing in it is new: if a line feels shaky, go back to that episode."
    table:
      head: ["", "in one line", "see"]
      rows:
        - ["ser", "who or what someone is, where from: *Mi padre es abogado. Yo soy de California.*", "Ep.\u00a01"]
        - ["articles", "*los, unos* for men or a mixed group; *las, unas* for women only", "Ep.\u00a02"]
        - ["mi, tu, su…", "agree with the thing owned: *mi hijo, su carta · mis guitarras, sus padres*", "Ep.\u00a02"]
        - ["hay · no hay", "there is, there are · there isn't, there aren't", "Ep.\u00a03"]
        - ["estar", "where and how: *Mi hermana está en Europa. Ella está muy contenta.*", "Ep.\u00a03"]
        - ["a + person", "*El profesor busca a la estudiante.*", "Ep.\u00a03"]
        - ["adjectives", "agree with the noun: *unos perros negros, las casas pequeñas, unos amigos fieles*", "Ep.\u00a04"]
        - ["ir · the time · the days", "*voy, vas, va…* · *es la una, son las dos* · *el lunes, los lunes*", "Ep.\u00a05"]
        - ["present tense", "*hablo, hablas, habla, hablamos, habláis, hablan*", "Ep.\u00a05"]

rules:
  - ["Odd *yo* forms: **-oy** in *soy, estoy, voy*; **-go** in *tengo, salgo*.", "Tengo clase a las ocho. · Salgo de casa temprano."]
  - ["**a casa** = (to) home · **en casa** = at home: no article.", "¿A qué hora vas a casa? · ¿Dónde comes? En casa."]
  - ["**conmigo** = with me · **contigo** = with you (*tú*)", "¿Quién estudia contigo?"]
  - ["**maestro · maestra** teach grade school; a **profesor · profesora** usually teaches older students.", "Es maestra de primaria."]

