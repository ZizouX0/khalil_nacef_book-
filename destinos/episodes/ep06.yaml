cognates:
  rule: "The textbook's tip for this lesson: when a word is new, **guess from the context**. Once you know *su buena suerte* = *your good luck*, *la ganadora del premio* can only be *the winner of the prize*. Many of the other new words follow patterns you already know."
  harder:
    - ["entrevistar", "to interview", "*entre* = inter-, *vista* = view"]
    - ["el compartimiento", "compartment", "-miento = -ment"]
    - ["acompañar", "to accompany", "think *compañero*, companion"]
    - ["la lotería", "lottery", "-ía = -y, as in Episode 3"]
    - ["generalmente · finalmente", "generally · finally", "-mente = -ly, as in Episode 3"]

phrases:
  - ["Perdone, pero no sé de qué habla.", "Excuse me, but I don't know what you're talking about."]
  - ["Ud. estará muy contenta de su buena suerte.", "You must be very happy about your good luck."]
  - ["Vivo en la residencia. · No tengo compañera de cuarto.", "I live in the dorm. · I don't have a roommate."]
  - ["Estudio para la clase de inglés.", "I'm studying for English class."]
  - ["Es muy temprano, pero tengo clase.", "It's very early, but I have class."]
  - ["Conversamos de muchas cosas.", "We talk about lots of things."]
  - ["Ceno con mi compañero de cuarto.", "I have dinner with my roommate."]
  - ["Mi clase de ___ es a las ___.", "My ___ class is at ___."]
  - ["Debo escribir muchos trabajos.", "I have to write a lot of papers."]
  - ["Deseo hablar por teléfono con ___.", "I want to talk on the phone with ___."]

culture:
  - title: "El cupón de la ONCE"
    body: "The *Organización Nacional de Ciegos* in the lesson is Spain's national organisation for the blind, the **ONCE** (*Organización Nacional de Ciegos Españoles*). It runs its own lottery: the tickets, **los cupones**, are sold in the street by blind sellers and other people with disabilities, which gives them work."
