cognates:
  rule: "One new ending, **-ante · -ente**, and **-ura** again from Episode 4. Adjectives with the new ending have one form for men and women: *un restaurante elegante, una persona inteligente*."
  patterns:
    - ["-ante", "-ant", "elegante, tolerante", "elegant, tolerant"]
    - ["-ente", "-ent", "inteligente, excelente", "intelligent, excellent"]
    - ["-ante · -ente", "-ing", "interesante, fascinante", "interesting, fascinating"]
    - ["-ura", "-ure", "cultura, escultura", "culture, sculpture"]
  harder:
    - ["la pintura", "painting", "think *paint*: here -ura is not -ure"]
    - ["desgraciadamente", "unfortunately", "think *disgrace*, and -mente = -ly"]
    - ["la convivencia", "living together", "*con* + *vivir*"]
    - ["el horario", "schedule, timetable", "think *hour*"]
  false_friends:
    - ["el fútbol", "football, soccer", "American football", "el fútbol americano"]

sounds:
  - title: "Rule 1: vowel, -n or -s"
    body: "Stress the next-to-last syllable: **hi**jo, Fer**nan**do, fasci**nan**te, **ce**nan, e**xa**men, a**bue**los."
  - title: "Rule 2: any other consonant"
    body: "Stress the last syllable: pregun**tar**, universi**dad**, direc**tor**, Ra**quel**, espa**ñol**, cultu**ral**."
  - title: "Rule 3: exceptions get an accent"
    body: "A word that breaks Rules 1 and 2 marks its stress: **sá**bado, in**glés**, reli**gión**, Ra**món**, **Suá**rez, tam**bién**, **miér**coles, **mú**sica."
  - title: "Why lección loses its accent"
    body: "In *lecciones* the stress falls where Rule 1 puts it, so no mark is needed (Episode 2). An accent can also change the word: *esta* = this, *está* = is."
  - title: "An accent on i or u splits the vowels"
    body: "The marked **í** or **ú** becomes a syllable of its own: psicolo**gí**a, sociolo**gí**a, Andalu**cí**a, desa**fí**o."
  - title: "a, e, o never blend"
    body: "Two of them side by side are two syllables: a·e·ro·puer·to, re·or·ga·ni·zar, ca·os, pa·e·lla."

phrases:
  - ["¿Qué hora es? · Son las diez y media.", "What time is it? · It's half past ten."]
  - ["¿A qué hora…? · A la una. · A las once y media.", "At what time…? · At one. · At half past eleven."]
  - ["¿Dónde nos encontramos?", "Where shall we meet?"]
  - ["Llego a la universidad a las ocho de la mañana.", "I get to the university at eight in the morning."]
  - ["Trabaja hasta muy tarde.", "She works until very late."]
  - ["El sábado mis amigos y yo vamos a un partido de fútbol americano.", "On Saturday my friends and I are going to a football game."]
  - ["El domingo mi padre no va a salir de casa.", "On Sunday my father isn't going to leave the house."]
  - ["salir de casa · ver una película · ir a una fiesta · ir a la casa de ___", "leave home · see a film · go to a party · go to ___'s house"]
  - ["¡Qué día hemos pasado!", "What a day we've had!"]
  - ["Vamos a ver…", "We'll see… · Let's see…"]

culture:
  - title: "Hablando de la hora"
    body: "Lunch is around 2:00, dinner at 10:00 or later, so **la tarde** lasts until dinner: *las ocho de la tarde* is 8 in the **evening**. Timetables and TV use the **24-hour clock**: **15:00** = 3 p.m."
  - title: "Memory hook: the names of the days"
    body: "Most come from the Moon and the planets, like *Monday*: **lunes** la Luna, **martes** Marte (Mars), **miércoles** Mercurio, **jueves** Júpiter, **viernes** Venus. **Sábado** is the Sabbath; **domingo**, the Lord's day."
  - title: "La España árabe (711–1492)"
    body: "Arab influence is strongest in **Andalucía**. Arab art never shows the human figure: it uses curved lines and geometric designs. For long periods Christians, Arabs and Jews lived and worked side by side: *la convivencia*. Three great monuments: **la Mezquita de Córdoba**, a mosque that is today a cathedral; **la Alhambra de Granada**, palace of the Moorish kings; **el Alcázar de Sevilla**, in *mudéjar* style (Arab decoration on Christian architecture)."
    rows:
      - ["711", "The Arabs invade the Iberian Peninsula; within seven years they rule it all except the Basque Country and part of Asturias."]
      - ["1492", "The Catholic Monarchs, Isabel de Castilla and Fernando de Aragón, take Granada, the last Moorish kingdom. Jews who will not convert must leave Spain. Columbus sails to the New World."]
