# Episodio 5 · La despedida
# Sources: Textbook Lección 5 (pp. 51–63) and Workbook/Study Guide Lección 5 (pp. 43–55).
# Words in vocab.core are the two books' own Vocabulario lists, under their own headings.
# Telling time (the textbook's "¿Qué hora es?" box) and the days of the week are grammar points with tables.
# Farewells (Conversaciones: Las despedidas) are in greetings. The verb card is ir (workbook Gramática 14).
# The note on where the day names come from is not in the books: it is added as a memory hook.

episode: 5
title: La despedida
title_en: The farewell
pages: "Textbook pp. 51–63 · Workbook pp. 43–55"

essentials:
  - "**Telling time**: *¿Qué hora es?* · **Es la una** (only one o'clock is singular) · **Son las** dos, tres… Add minutes with **y** up to the half hour (*y cuarto, y media*), take them off the next hour with **menos** after it (*las cinco menos cuarto*). *¿A qué hora?* · *A las ocho de la mañana.*"
  - "**Days and good-byes**: the days take no capital and the week starts on *lunes*. *El lunes* = on Monday, *los lunes* = on Mondays. Leaving: *Adiós* · *Hasta luego* · *Hasta mañana*."
  - "**Ir** (to go): *voy, vas, va, vamos, vais, van*. **Ir a** + place = to go to (*Voy a Madrid*); **ir a** + infinitive = to be going to do (*Voy a buscar a la Sra. Suárez*)."
  - "**We** ends in **-amos, -emos, -imos**: *hablamos, creemos, vivimos*. **You all** is *ustedes* (*hablan*) for any group, but in Spain friends and family get *vosotros* (*habláis*)."

greetings_title: ["Despedidas", "Good-byes"]
greetings:
  - ["Adiós.", "Good-bye.", "The general good-bye; the one to use if you may not see the person again."]
  - ["Hasta luego.", "See you later.", "Someone you expect or hope to see again, even a person you have just met."]
  - ["Hasta mañana.", "See you tomorrow.", "Someone you will see tomorrow, like a friend or a classmate."]

verbs:
  table:
    verb: ir
    meaning: to go
    irregular: true
    forms:
      - ["voy", "I go"]
      - ["vas", "you go"]
      - ["va", "he, she goes · you go"]
      - ["vamos", "we go"]
      - ["vais", "you go"]
      - ["van", "they go · you go"]
    hook: "Put **v-** in front of the -ar endings: v**as**, v**a**, v**amos**, v**ais**, v**an**. Only *voy* is odd, and it rhymes with *soy* and *estoy*."
  notes:
    - label: Four ways to say *you go*
      text: "**vas** to a friend (*tú*), **va** politely (*usted*), **vais** to friends in Spain (*vosotros*), **van** to any group (*ustedes*). *Vais* has no accent: it is one syllable."
  met:
    - ["encontramos", "encontrar", "we find"]
    - ["nos encontramos", "encontrarse", "we meet"]
    - ["cenamos · cenan", "cenar", "we have dinner · they have dinner"]
    - ["no comprendo", "comprender", "I don't understand"]
    - ["corre", "correr", "he / she runs"]
    - ["vende", "vender", "he / she sells"]
    - ["comienza", "comenzar", "he / she begins"]
    - ["se escapa", "escaparse", "he / she runs away"]
    - ["asisto a", "asistir", "I attend"]
    - ["hemos pasado", "pasar", "we have spent (a day)"]
    - ["veo", "ver", "I see: irregular, taught in Lección 6"]

grammar:
  - title: "Telling time: ¿Qué hora es?"
    rule: "One o'clock is singular, **es la una**; every other hour is plural, **son las dos, son las tres**: the *la · las* stands for *la hora*. Up to the half hour, add the minutes with **y**. After it, take them off the next hour with **menos**."
    table:
      head: ["", "Spanish", "time"]
      rows:
        - ["one o'clock", "**Es la** una.", "1:00"]
        - ["other hours", "**Son las** dos. · **Son las** seis.", "2:00 · 6:00"]
        - ["minutes past", "Son las dos **y** veinte. · Son las nueve **y** diez.", "2:20 · 9:10"]
        - ["quarter, half", "Son las ocho **y cuarto**. · Son las diez **y media**.", "8:15 · 10:30"]
        - ["minutes to", "Es la una **menos** diez. · Son las cinco **menos cuarto**.", "12:50 · 4:45"]
    trap: "Still singular with minutes: *Es la una y media.* And the **¿Qué horas son?** you heard in the episode is the Mexican way of asking, also used by people of Mexican descent in the US."

  - title: "At what time: a las…, de la mañana"
    rule: "To say **at** a time, use **a la** or **a las**: *¿A qué hora…?* · *a la una* · *a las once y media*. To be precise, add the part of the day."
    table:
      head: ["", "Spanish", "English"]
      rows:
        - ["a.m.", "… **de la mañana**", "in the morning"]
        - ["p.m., until dinner", "… **de la tarde**", "in the afternoon, early evening"]
        - ["p.m., later", "… **de la noche**", "in the evening, at night"]
    examples:
      - ["Son las ocho y media de la mañana.", "It's eight thirty in the morning."]
      - ["Son las tres menos cuarto de la tarde.", "It's a quarter to three in the afternoon."]
      - ["Raquel y Jaime llegan tarde a la Giralda, a las doce.", "Raquel and Jaime get to the Giralda late, at 12:00."]
    trap: "**tarde** alone means *late*; **la tarde** is the afternoon. In the same way, **mañana** = tomorrow and **la mañana** = the morning."

  - title: "Days of the week: el lunes, los lunes"
    rule: "The days take **no capital**, and the week starts on **lunes**, as calendars show. Use **el** for *on* and **los** for *every*."
    table:
      head: ["", "on one day", "every week"]
      rows:
        - ["lunes to viernes", "**el** lunes · **el** viernes", "**los** lunes · **los** viernes"]
        - ["sábado, domingo", "**el** sábado · **el** domingo", "**los** sábado**s** · **los** domingo**s**"]
    examples:
      - ["Muchas personas van a la iglesia el domingo.", "Many people go to church on Sunday."]
      - ["Los lunes, a las ocho de la mañana, asisto a mi clase de geografía.", "On Mondays, at eight in the morning, I attend my geography class."]
    trap: "The article alone means *on*: never ~~en el lunes~~. *Lunes* to *viernes* already end in -s, so their plural doesn't change."

  - title: "Two jobs for ir"
    rule: "*Ir* (verb card above) is almost always followed by **a**."
    uses:
      - label: "ir a + place"
        text: "Where someone is **going**."
        examples:
          - ["Voy a Madrid en tren.", "I'm going to Madrid by train."]
          - ["¿Por qué no vamos al Alcázar?", "Why don't we go to the Alcázar?"]
      - label: "ir a + inf."
        text: "What someone is **going to do**: the near future."
        examples:
          - ["Voy a buscar a la Sra. Suárez.", "I'm going to look for Mrs. Suárez."]
          - ["Tu papá y yo vamos a llevarla a la estación.", "Your dad and I are going to take her to the station."]
    trap: "Keep the **a**: *Voy a estudiar*, never ~~Voy estudiar~~. And **a + el = al** (Episode 3): *vamos al mercado*."

  - title: "The whole present tense: hablar, creer, vivir"
    rule: "This lesson completes the present tense of regular verbs. New are **we** (*nosotros*) and **you all** in Spain (*vosotros*). Drop -ar, -er, -ir and add the ending."
    table:
      head: ["", "hablar", "creer", "vivir"]
      rows:
        - ["yo", "habl**o**", "cre**o**", "viv**o**"]
        - ["tú", "habl**as**", "cre**es**", "viv**es**"]
        - ["él · ella · usted", "habl**a**", "cre**e**", "viv**e**"]
        - ["nosotros/as · new", "habl**amos**", "cre**emos**", "viv**imos**"]
        - ["vosotros/as · new", "habl**áis**", "cre**éis**", "viv**ís**"]
        - ["ellos · ellas · ustedes", "habl**an**", "cre**en**", "viv**en**"]
    examples:
      - ["Jaime y yo vivimos en el Barrio de Triana. Estudiamos en la escuela San Francisco de Paula.", "Jaime and I live in the Triana district. We study at St. Francis of Paula school."]
      - ["Mamá dice que debemos estudiar más… y yo no comprendo.", "Mom says that we should study more… and I don't understand."]
    trap: "Every *we* form ends in **-mos** (*somos, estamos, vamos*), so *nosotros* is usually left out. And -er and -ir verbs differ only here: cre**emos** · viv**imos**, cre**éis** · viv**ís**."

  - title: "You all: vosotros or ustedes?"
    rule: "Most Spanish speakers, Raquel included, say **ustedes** (Uds.) to any group, friends or strangers. In Spain, **vosotros/as** is for friends and family and **ustedes** is formal. The books use *Uds.*"
    table:
      head: ["", "one person", "a group in Spain", "a group elsewhere"]
      rows:
        - ["informal", "**tú**", "**vosotros/as**", "**ustedes**"]
        - ["formal", "**usted** (Ud.)", "**ustedes** (Uds.)", "**ustedes**"]
    examples:
      - ["Elena: ¿Dónde deseáis cenar hoy?", "Where do you want to have dinner today? (*vosotros*)"]
      - ["Raquel: ¿Dónde desean cenar hoy?", "The same question, with *ustedes*."]
      - ["¿Qué creen Uds.?", "What do you all think?"]
    trap: "**Ustedes** takes the *they* form (*desean, creen, viven*), so speakers often keep the word *ustedes* to make clear they mean *you*."

rules:
  - ["Personal **a** (Episode 3) also goes before a pet, but not before a place or a thing.", "Jaime busca a Osito. · Raquel visita España. Va a visitar a Teresa Suárez."]
  - ["**¿Adónde?** = where to? (with *ir*) · **¿Dónde?** = where?", "¿Adónde van? · ¿Dónde vive esa persona?"]
  - ["**salir de** = to leave (a place) · **salir para** = to leave for", "Raquel sale de México para Sevilla."]
  - ["**en** + transport = by", "Voy a Madrid en tren."]
  - ["**por la mañana · por la tarde · por la noche** when no clock time is given", "Trabaja por la noche. · El sábado por la noche…"]
  - ["**más que** = more than", "Jaime necesita estudiar mucho más que yo."]
  - ["**¿por qué?** = why? · **por eso** = that's why · **porque** = because", "¿Por qué no vamos? · Por eso Raquel debe ir a Madrid."]

