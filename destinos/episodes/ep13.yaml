sounds:
  - title: "s, z, ci, ce: one sound in Latin America"
    body: "**s**, **z**, and **c** before *e, i* all sound like English *s*: *ciudad, cenar, azul, arroz, conozco, mariscos*. Keep it a hiss: *casa, presidente*, never the *z* of English *rose*."
  - title: "z, ci, ce in Spain: th"
    body: "In most of Spain **z** and **c** before *e, i* sound like *th* in *think*, while **s** stays *s*: *Santa Susana* · *el ciego, la voz, dicen, merluza*. Both are correct: choose one and keep to it."
  - title: "s at the end of a syllable"
    body: "In relaxed speech in Argentina, the Caribbean and southern Spain an **s** before a consonant or at the end of a word turns into a soft *h* or drops: *lo(h) mejillone(h)*. Learn to hear it; say the full *s* yourself."

phrases:
  - ["Disculpe la molestia.", "Sorry to bother you."]
  - ["La última vez que vi a mi hermano fue aquí.", "The last time I saw my brother was here."]
  - ["Llegué a Buenos Aires y tomé un taxi a mi hotel.", "I arrived in Buenos Aires and took a taxi to my hotel."]
  - ["Arturo me ha invitado a cenar.", "Arturo has invited me to dinner."]
  - ["Estudié y también vi la televisión anoche.", "I studied and also watched television last night."]
  - ["¿Ya probaste la parrillada?", "Have you tried the mixed grill yet?"]
  - ["Conoce a todo el mundo.", "He knows everybody."]
  - ["Perdimos contacto hace muchos años.", "We lost touch many years ago."]

culture:
  - title: "La Argentina, país de contrastes"
    body: "From the tropical north (the **cataratas del Iguazú**, 275 waterfalls on the border with Brazil) to **Ushuaia** in Tierra del Fuego, the southernmost city in the world: the **Pampa**, the vineyards of **Mendoza**, the **Andes** with the **Aconcagua** (6,959 m, the highest peak in the Americas), ski resorts such as **Bariloche**, and the glaciers and lakes of **Patagonia**."
