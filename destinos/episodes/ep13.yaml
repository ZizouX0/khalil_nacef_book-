# Episodio 13 · La búsqueda
# Sources: Textbook Lección 13 (pp. 129–139) and Workbook/Study Guide Lección 13 (pp. 128–139, 307–308).
# Words in vocab.core are the two books' own Vocabulario lists. The buscar verb card and the
# -qué / -gué / -cé table follow the workbook's Gramática 37; me, te, nos, os its 38; verbs with
# and without se, and each other, its 39. The shop phrases are the Conversaciones: En una tienda.
# Added: today's spelling deme (the books write déme), and the cooking words from the workbook's
# Vocabulario del tema, Actividad B, as a rule.

episode: 13
title: La búsqueda
title_en: The search
pages: "Textbook pp. 129–139 · Workbook pp. 128–139"
# the word list is long: it goes last, so the rules, sounds and phrases fill page 3
vocab_last: true

essentials:
  - "**The past for I and you**: *-ar* **-é, -aste**, *-er* and *-ir* **-í, -iste**: *llegué, llegaste · decidí, decidiste*. The *yo* form changes its spelling: bus**qué**, lle**gué**, almor**cé**. And *ver* has no accents: **vi, vio**."
  - "**me, te, nos, os** = me, you, us, you all: *Arturo **me** invitó. · ¡José! **Te** buscan.* To *usted*: **lo** to a man, **la** to a woman: *¿En qué puedo servir**la**?*"
  - "**In a shop**: **Deme…** = give me, **Cóbreme** = ring it up: *Deme medio kilo de calamares, por favor.* **me gustan** + plural: *Me gustan los mariscos.*"
  - "**se** in the plural can mean *each other*: *Nos llamamos* = we call each other · *se comprenden* = they understand each other."

greetings_title: ["En una tienda", "In a shop"]
greetings:
  - ["Deme un kilo de calamares, por favor.", "Give me a kilo of squid, please.", "Direct, and normal in a shop. *por favor* makes it softer. The books write **déme**; today's spelling is **deme**."]
  - ["Deme medio kilo de manteca.", "Let me have half a kilo of butter.", "**un kilo · medio kilo**: the metric system. *manteca* is butter in Argentina; elsewhere **mantequilla** (*manteca* = lard)."]
  - ["Cóbreme esto, por favor.", "Ring this up for me, please.", "From *cobrar* = to charge."]
  - ["¿Necesitan algo más?", "Do you need anything else?", "What the clerk asks."]

verbs:
  table:
    verb: buscar
    meaning: looked for · the past
    forms:
      - ["bus**qué**", "I looked for"]
      - ["busc**aste**", "you looked for"]
      - ["busc**ó**", "he, she looked for · you looked for"]
      - ["busc**amos**", "we looked for"]
      - ["busc**asteis**", "you looked for"]
      - ["busc**aron**", "they looked for · you looked for"]
    hook: "Only the *yo* form changes its spelling: **qu** before *é* keeps the *k* sound, as in *que* (Episode 3). No *for* after *buscar*: *Busqué la dirección* = I looked for the address."
  met:
    - ["llegué · tomé", "llegar · tomar", "I arrived · I took"]
    - ["resolví · subí", "resolver · subir", "I solved · I went up"]
    - ["descansé · salí", "descansar · salir", "I rested · I left"]
    - ["volví · volviste", "volver", "I went back · you went back"]
    - ["llamé · hablé", "llamar · hablar", "I called · I spoke"]
    - ["vi · vio", "ver", "I saw · he / she saw"]
    - ["probaste", "probar (ue)", "you tried, tasted"]

grammar:
  - title: "The past for yo: -qué, -gué, -cé"
    rule: "The full table of endings is in **Episode 12**. To keep the stem's sound before **-é**, three groups of *-ar* verbs change their spelling, in the *yo* form only:"
    table:
      head: ["", "infinitive", "yo", "the others"]
      rows:
        - ["-car: **-qué**", "buscar", "bus**qué**", "buscaste, buscó…"]
        - ["-gar: **-gué**", "llegar", "lle**gué**", "llegaste, llegó…"]
        - ["-zar: **-cé**", "almorzar", "almor**cé**", "almorzaste, almorzó…"]
    examples:
      - ["**Llegué** a Buenos Aires y **tomé** un taxi a mi hotel.", "I arrived in Buenos Aires and took a taxi to my hotel."]
      - ["Yo **volví** al hotel y tú **volviste** a casa. Luego **llamé** a México.", "I went back to the hotel and you went home. Then I called Mexico."]
      - ["**Empecé** la búsqueda de Ángel con Arturo.", "I started the search for Ángel with Arturo."]
      - ["¿**Encontraste** a Héctor?", "Did you find Héctor?"]
    trap: "The others you know: **-car** *dedicarse, explicar, sacar* · **-gar** *investigar* · **-zar** *comenzar, empezar* (empe**cé**). And **ver** has no accents: *vi, viste, vio*. *yo* and *él* differ only in the last vowel: lle**gué** (I) · lle**gó** (he)."

  - title: "me, te, nos, os: me, you, us"
    rule: "The full set of words for *me, you, him, her, it, us, them*. *lo, la, los, las* are in **Episode 12**; **me, te, nos, os** only ever mean people, so they have no masculine or feminine."
    table:
      head: ["", "one", "more than one"]
      rows:
        - ["I · we", "**me** = me", "**nos** = us"]
        - ["you, familiar", "**te** = you (*tú*)", "**os** = you (*vosotros*)"]
        - ["you, formal · he, she, they", "**lo · la** = you (*Ud.*), him, her, it", "**los · las** = you (*Uds.*), them"]
    examples:
      - ["Arturo **me** ha invitado a cenar.", "Arturo has invited me to dinner."]
      - ["¡José! **Te** buscan.", "José! Someone's looking for you."]
      - ["¿No **me** invitas a pasar?", "Aren't you going to invite me in?"]
      - ["**Te** invito a probar una parrillada en mi casa.", "Come and try a mixed grill at my house."]
    trap: "To **usted**, choose by the person: *¿En qué puedo servir**la**, señora?* · *¿En qué puedo servir**lo**, señor?* Same place as always: before the verb, or joined to an infinitive."

  - title: "With or without se"
    rule: "Many verbs with *se* (Episode 9) also work without it. Without *se*, you do the action **to someone else**:"
    table:
      head: ["", "to someone else", "to yourself"]
      rows:
        - ["despertar(se)", "El teléfono **despertó** a Raquel.", "Raquel **se despertó** a las seis."]
        - ["vestir(se)", "Elena **vistió** a Jaime…", "…y después **se vistió** también."]
        - ["a new meaning", "**dormir** = to sleep · **ir** = to go", "**dormirse** = to fall asleep · **irse** = to go away (Episodes 8–9)"]
    examples:
      - ["**Nos llamamos** por teléfono con frecuencia.", "We call each other often."]
      - ["¿Crees que Raquel y Arturo **se comprenden**?", "Do you think Raquel and Arturo understand each other?"]
    trap: "In the plural, **nos, os, se** can also mean **each other**: *Mis padres y yo nos visitamos con frecuencia.* Learn to recognise it."

rules:
  - ["**me gustan** + a plural noun; **no me gusta nada** = I don't like it at all (Episode 4)", "Me gustan mucho los calamares. · No me gusta nada el atún."]
  - ["**Entre** … **y** …, **prefiero** … = of … and …, I prefer …", "Entre el salmón y el atún, prefiero el salmón."]
  - ["Cooking: **a la plancha** (grilled), **al horno** (baked), **frito** (fried), **asado** (roast), **al ajillo** (in garlic and oil)", "¿Cómo te gusta el pescado? —A la plancha."]
  - ["**la primera vez · la última vez** = the first time · the last time", "La última vez que vi a mi hermano fue aquí."]
  - ["**la Argentina, el Brasil, el Uruguay, el Paraguay** take *el, la*; **Chile, Bolivia, Colombia** don't. Not every speaker keeps this.", "Raquel está en la Argentina."]

