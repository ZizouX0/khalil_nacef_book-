cognates:
  rule: "Neither book has ¡Aumenta tu vocabulario! in this lesson, but its adjectives follow two easy patterns, three of its words are classic traps, and the new describing words have English relatives."
  patterns:
    - ["-ista", "-ist(ic)", "realista, optimista, idealista", "realistic, optimistic, idealistic"]
    - ["-ivo · -iva", "-ive", "expresivo, agresivo, imaginativo", "expressive, aggressive, imaginative"]
  false_friends:
    - ["largo", "long", "large", "grande"]
    - ["simpático", "nice, pleasant", "sympathetic", "comprensivo"]
    - ["sensible", "sensitive", "sensible", "sensato"]
  harder:
    - ["la barba", "beard", "think *barber*"]
    - ["joven", "young", "think *juvenile*"]
    - ["alto", "tall; high", "think *altitude*"]
    - ["corto", "short", "think *curt*, *curtail*"]
    - ["oscuro", "dark", "think *obscure*"]
    - ["delgado", "thin", "from Latin *delicatus*: think *delicate*"]
    - ["castaño", "brown (hair)", "*la castaña* is a chestnut"]
    - ["real", "royal (also real)", "*la familia real* = the royal family"]

sounds:
  - title: "Spanish k: no puff of air"
    body: "Say *k* as in *s**k**it, s**c**an, s**c**old*, not as in *kit, can, cold*: English adds a puff of air after the *k*, Spanish doesn't. Hold your hand in front of your mouth: you shouldn't feel a breath."
  - title: "c or qu?"
    body: "Before **e** and **i** the k sound is written **qu**, and the *u* is silent: ¿**qu**é?, ¿**qu**ién?, a**qu**í, por**qu**e, **qu**iero, **qu**isiera. Everywhere else, **c**: **c**asa, **c**orto, **c**astaño, **c**urioso, os**c**uro, bus**c**a, do**c**tor."
  - title: "k only in borrowed words"
    body: "**k**ilo, **k**ilogramo, **k**ilómetro, **k**erosén, **k**arate. And **c** before **e** or **i** is not a k sound at all (*cena, cinco*): that is why *que, qui* need the u."
  - title: "Say it: bold = k"
    body: "¿**Qu**ién **qu**iere correr en el par**qu**e? · ¿De **qu**é **c**olor es tu **c**orbata? · Ri**c**ardo tiene pelo **c**astaño y **c**orto. · **C**armen tiene ojos os**c**uros."

phrases:
  - ["¿Cómo es? · Es alto y delgado, y tiene pelo castaño.", "What is he like? · He's tall and thin, and he has brown hair."]
  - ["¿Tiene pelo largo o corto? ¿De qué color?", "Does she have long or short hair? What colour?"]
  - ["¿Estás mal? ¿Qué tienes?", "Are you unwell? What's wrong?"]
  - ["¡Qué lástima!", "What a shame!"]
  - ["¿A qué hora se acuestan Uds.? · Nos acostamos a las once.", "What time do you go to bed? · We go to bed at eleven."]
  - ["¿Vamos a la galería? Hay una exposición de arte moderno.", "Shall we go to the gallery? There's a modern art exhibition."]
  - ["Es una buena idea, pero no puedo ir.", "It's a good idea, but I can't go."]
  - ["Estoy un poco enferma del estómago.", "My stomach is a bit upset."]
  - ["Seguro que voy a estar mejor mañana.", "I'm sure I'll be better tomorrow."]
  - ["Todo depende del dinero.", "It all depends on money."]
  - ["Mis pintores favoritos son Goya y Velázquez.", "My favourite painters are Goya and Velázquez."]

culture:
  - title: "Dos besos"
    body: "In Spain people often say hello and good-bye with **two kisses**: cheeks touch lightly, first on one side, then the other, with a soft kissing sound. Women do it with women and men with women, depending on how close they are; men don't usually kiss each other. In other parts of the Hispanic world **one kiss** is more common. Whether to hug as well is up to how comfortable you feel with the person."
  - title: "Los grandes maestros de la pintura española"
    body: "**Goya and Picasso** have a lot in common: a huge, varied body of work; both denounced the political and social abuses of their time, witnessed the cruelty of war, painted reality in an expressionist, not realist, way, made etchings (**grabados**) as well as paintings, and died in France. El Greco, Velázquez and Goya hang in **el Museo del Prado**, Madrid."
    rows:
      - ["El Greco · 1541–1614", "Doménikos Theotokópoulos, *the Greek*, born in Crete, died in Toledo. Religious subjects, sombre, dark colours, long, stretched figures: *San Andrés y San Francisco*."]
      - ["Velázquez · 1599–1660", "Born in Seville, died in Madrid. Light and perspective, bright colours, real life, portraits of the royal family: *Las Meninas* (the ladies-in-waiting)."]
      - ["Goya · 1746–1828", "Born in the province of Zaragoza, died in France. First, royal portraits with a critical eye; in his *período negro* (dark period), grotesque forms. A forerunner of modern painting."]
      - ["Picasso · 1881–1973", "Born in Málaga, died in France. First realist paintings, from his blue and rose periods; then the father of **cubism**, which shows several sides of a subject at once. A huge influence on modern art. *Guernica*: Episode 2."]
