# Episodio 10 · Cuadros
# Sources: Textbook Lección 10 (pp. 104–113) and Workbook/Study Guide Lección 10 (pp. 95–106).
# Words in vocab.core are the two books' own Vocabulario lists, merged under their own headings
# (both books have Los verbos, Los adjetivos, Más despedidas and Las palabras adicionales).
# The verb card is sentirse, one of the six verbs workbook Gramática 29 conjugates in full (despertarse,
# the theme verb, is too long for the card's columns and sits in the routine table). The nosotros and vosotros
# forms of stem-changing verbs and verbs with se (textbook Un poco de gramática, Gramática 29), adjectives
# (Gramática 27) and ser · estar (Gramática 28) are grammar points with tables. Describing people
# (textbook Vocabulario del tema) is a grammar point with a table; the "Tiene…" phrases point to it.
# Farewells (Conversaciones: Más despedidas) use the greetings table. Neither book has ¡Aumenta tu
# vocabulario! here: the cognate patterns, false friends and memory hooks are added.

episode: 10
title: Cuadros
title_en: Paintings
pages: "Textbook pp. 104–113 · Workbook pp. 95–106"

essentials:
  - "**Describing people**: **es** + adjective (*Es alto y delgado*), **tiene** + hair, eyes, a beard (*Tiene pelo castaño y ojos oscuros*). Short is **bajo** in height, **corto** in length. Before a noun, *grande* becomes **gran** = great: *un gran pintor*."
  - "**We and you all** (tables in Episode 9): stem-changing verbs keep the infinitive's vowel, *qu**ie**ro* but **queremos**, *p**ue**do* but **podemos**; verbs with se take **nos** and **os**, *nos levantamos, os acostáis*. After another verb the pronoun still matches: *Vamos a casar**nos**.*"
  - "**Ser or estar?** **Ser**: who or what, what someone is like, nationality, origin and owner (*de*), who it's for (*para*), the time. **Estar**: where (*en*) and how someone feels. *Madrid es la capital de España y está en el centro.*"
  - "**Farewells**: *Que tengas un buen viaje* to *tú*, *Que tenga un buen viaje* to *usted* = Have a good trip. Also *Que te vaya bien* (all the best) and *Que lo pases bien* (have a good time). Learn them as set phrases: the forms come later."

greetings_title: ["Más despedidas", "Wishing someone well"]
greetings:
  - ["Que tengas un buen viaje.", "Have a good trip.", "To someone you call *tú*. The *un* is optional."]
  - ["Que tenga un buen viaje.", "Have a good trip.", "To someone you call *usted*."]
  - ["Que te vaya bien.", "All the best.", "Fits any farewell, not only a trip. To *usted*: **Que le vaya bien**."]
  - ["Que lo pases bien.", "Have a good time.", "To *usted*: **Que lo pase bien**."]

verbs:
  table:
    verb: sentirse
    meaning: to feel
    forms:
      - ["me s**ie**nto", "I feel"]
      - ["te s**ie**ntes", "you feel"]
      - ["se s**ie**nte", "he, she feels · you feel"]
      - ["nos sentimos", "we feel"]
      - ["os sentís", "you feel"]
      - ["se s**ie**nten", "they feel · you feel"]
    hook: "The boot again (Episode 8): **ie** only where the stem is stressed; *nos sentimos, os sentís* keep the **e**. The little word matches the person: **me, te, se, nos, os, se**. *¡Nos sentimos muy felices!*"
  met:
    - ["que tengas · que tenga", "tener", "(may you) have: to *tú* · to *usted*"]
    - ["que te vaya bien", "ir", "(may it) go well for you"]
    - ["que lo pases bien", "pasar", "(may you) have a good time"]
    - ["pintó", "pintar", "he / she painted"]
    - ["murieron", "morir", "they died"]
    - ["lucharon", "luchar", "they fought"]
    - ["ha leído", "leer", "he / she has read"]
    - ["no se pierde", "perderse", "he / she never misses (a show)"]

grammar:
  - title: "We and you all: no stem change"
    rule: "The full six-form table is in **Episode 9**. This lesson practises the two forms that **don't** change: in **nosotros** and **vosotros** the stress falls on the ending, so the stem keeps the infinitive's vowel, like a regular verb: *queremos, podemos, pedimos, volvemos*."
    examples:
      - ["Pensamos ir a Los Ángeles algún día.", "We're planning to go to Los Angeles some day."]
      - ["Queremos casarnos pronto.", "We want to get married soon."]
      - ["Si podemos, vamos a ir. Todo depende del dinero.", "If we can, we'll go. It all depends on money."]
      - ["Recordamos una cena muy agradable con Raquel.", "We remember a very pleasant dinner with Raquel."]
      - ["Jaime y yo siempre le pedimos dinero a papá para ir al cine.", "Jaime and I always ask Dad for money to go to the cinema."]
    trap: "Never carry the change into *we*: ~~quieremos~~, ~~puedemos~~. Say *queremos, podemos*."

  - title: "Verbs with se: nos for we, os for you all"
    rule: "The pronoun table and the daily-routine verbs are in **Episode 9**. Here they are used with *we* and *you all*: **nos** levantamos, **nos** acostamos, **os** casáis, keeping the infinitive's vowel as above. One new routine verb: **despedirse (i) de** = to say good-bye to: *me desp**i**do* · *nos despedimos*."
    examples:
      - ["Los sábados nos levantamos muy tarde.", "On Saturdays we get up very late."]
      - ["¿Cuándo os casáis, por fin? · Nos gustaría casarnos este verano.", "When are you two getting married, at last? · We'd like to get married this summer."]
      - ["Federico y yo vamos a casarnos este verano. ¡Nos sentimos muy felices!", "Federico and I are going to get married this summer. We feel very happy!"]
      - ["Salimos a la calle y nos despedimos.", "We go out and say good-bye."]
      - ["Nos acostamos tarde y al día siguiente nos despertamos tarde.", "We go to bed late and the next day we wake up late."]
      - ["Nos dormimos inmediatamente.", "We fall asleep straight away."]
    trap: "The pronoun goes before a conjugated verb, or is joined to an infinitive, still matching the person: *vamos a casarnos* (we), *me gustaría casarme* (I). Never ~~vamos a casarse~~."

  - title: "Adjectives: -ista, nationalities, mixed groups"
    rule: "Episode 4 had the basics. New: adjectives in **-ista** (and other singulars in -a, like *hipócrita*) have **one form** for men and women. Nationalities have **four forms**, even those ending in a consonant, and take no capital letter. A mixed group takes the **masculine** plural."
    table:
      head: ["", "masc. · one", "masc. · more", "fem. · one", "fem. · more"]
      rows:
        - ["-ista", "realist**a**", "realist**as**", "realist**a**", "realist**as**"]
        - ["nationality in -o", "mexican**o**", "mexican**os**", "mexican**a**", "mexican**as**"]
        - ["nationality in a consonant", "español", "español**es**", "español**a**", "español**as**"]
        - ["-án, -és lose the accent", "inglés", "ingles**es**", "ingles**a**", "ingles**as**"]
    examples:
      - ["Velázquez fue un pintor realista.", "Velázquez was a realist painter."]
      - ["Ramón y Mercedes son mexicanos.", "Ramón and Mercedes are Mexican."]
      - ["Raquel es optimista. Miguel Ruiz y Elena Ramírez son españoles.", "Raquel is optimistic. Miguel Ruiz and Elena Ramírez are Spanish."]
      - ["El Sr. Díaz es una persona muy reservada.", "Mr. Díaz is a very reserved person."]
    trap: "**la persona** is feminine even for a man: *Don Fernando es una persona muy simpática.* The accent drops the same way in *alemán · alemana, francés · francesa*."

  - title: "Describing people: es… · tiene…"
    rule: "**Ser** + adjective says what someone is like; **tener** + noun gives the hair, the eyes, a beard. The adjective agrees with the person (Episode 4)."
    table:
      head: ["", "Spanish", "English"]
      rows:
        - ["height", "Es **alto** · **bajo** · de **mediana estatura**.", "tall · short · of average height"]
        - ["build", "Es **delgado** · **gordito**.", "thin · plump"]
        - ["looks", "Es **guapo** · **feo**. · Es **bonita**.", "handsome · ugly · (she is) pretty"]
        - ["age", "Es **joven** · **viejo**.", "young · old"]
        - ["hair colour", "Tiene pelo **rubio** · **castaño** · **negro** · **blanco** · **canoso**.", "blond · brown · black · white · grey hair"]
        - ["hair length", "Tiene pelo **largo** · **corto**.", "long · short hair"]
        - ["eyes", "Tiene ojos **claros** · **oscuros** · **expresivos**.", "light · dark · expressive eyes"]
        - ["beard", "Tiene **barba**. · sin barba", "a beard · without a beard"]
    examples:
      - ["La princesa es bonita. Tiene pelo rubio.", "The princess is pretty. She has blond hair."]
      - ["Ricardo tiene pelo castaño y corto. Carmen tiene ojos oscuros.", "Ricardo has short brown hair. Carmen has dark eyes."]
      - ["San Andrés es viejo. Tiene pelo blanco.", "Saint Andrew is old. He has white hair."]
      - ["¿Es alta, baja o de estatura mediana?", "Is she tall, short or of average height?"]
    trap: "Two *shorts*: **bajo** (height), **corto** (length): *Es baja y tiene pelo corto.* After *pelo, ojos* the adjective agrees with them: *Ella es rubia* but *tiene pelo rubio*."

  - title: "Ser or estar: the full picture"
    rule: "Both mean *to be* (verb cards: **ser** in Episode 1, **estar** in Episode 3). **Ser** tells what someone or something *is*; **estar** tells *where* it is and *how* someone is feeling. *There is · there are* is **hay** (Episode 3)."
    table:
      head: ["", "use", "example"]
      rows:
        - ["ser", "who or what", "Raquel **es** abogada."]
        - ["", "what someone is like", "Raquel **es** persistente y muy curiosa."]
        - ["", "nationality", "**Es** mexicoamericana."]
        - ["", "**de**: where from", "**Es de** Los Ángeles."]
        - ["", "**de**: whose", "La carta **es de** la Sra. Suárez."]
        - ["", "**para**: who it's for", "**Es para** Rosario."]
        - ["", "the time", "**Son** las cinco."]
        - ["", "**es** + adjective: general statements", "**Es** muy importante encontrar a Rosario."]
        - ["estar", "**en**: where", "Don Fernando **está en** el hospital."]
        - ["", "how someone is, feels", "**Está** muy mal."]
    examples:
      - ["Madrid es la capital y está en el centro.", "Madrid is the capital and is in the centre."]
      - ["Hay un secreto. El secreto está en una carta.", "There is a secret. The secret is in a letter."]
      - ["Hay un problema. Teresa Suárez ya no está en Sevilla.", "There is a problem. Teresa Suárez is no longer in Seville."]
      - ["Madrid es la capital de España y está en el centro del país.", "Madrid is the capital of Spain and is in the centre of the country."]
      - ["Los pintores son personas interesantes, ¿no?", "Painters are interesting people, aren't they?"]
    trap: "Where **from** is *ser de*, where **now** is *estar en*: *Raquel es de Los Ángeles, pero está en España.*"

rules:
  - ["**gran** before a noun = great · **grande** after it = big (like *buen, primer*: Episode 4)", "El Greco es un gran pintor. · un cuadro grande"]
  - ["**bonito** = pretty: women, things · **guapo** = good-looking: men, women", "una chica bonita · unos bailes bonitos · un hombre guapo"]
  - ["**-ito · -ita** makes a word smaller or gentler · **un poco** softens too", "gordo (fat) · gordito (plump) · Es un poco gordita."]
  - ["**despedirse (i) de** = to say good-bye **to**", "¿Va a despedirse de la Sra. Suárez?"]
  - ["**nos gustaría** + inf. = we would like to (*me gustaría*: Episode 4)", "Nos gustaría casarnos este verano."]
  - ["**el novio · la novia** = boyfriend · girlfriend; also fiancé(e), and at a wedding the groom · the bride", "Federico y su novia van a casarse este verano."]

