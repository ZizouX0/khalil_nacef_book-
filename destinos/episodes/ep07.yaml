# Episodio 7 · La cartera
# Sources: Textbook Lección 7 (pp. 70–81) and Workbook/Study Guide Lección 7 (pp. 62–70).
# Words in vocab.core are the two books' own Vocabulario lists, under their own headings; where both
# books use the same heading (Los verbos, La cortesía, Las palabras adicionales) the lists are merged.
# The lesson conjugates twelve verbs: tener is the verb card; saber · conocer (workbook Gramática 17)
# and the other irregular verbs (Gramática 18, 19) are grammar points with tables. The numbers 21–99
# (textbook Vocabulario del tema) and polite requests (Conversaciones: Algo sobre la cortesía) are
# grammar points with tables; the requests also feed the phrases. Neither book has ¡Aumenta tu
# vocabulario! here: the cognate notes (English relatives of the new verbs) are added as memory hooks.

episode: 7
title: La cartera
title_en: The wallet
pages: "Textbook pp. 70–81 · Workbook pp. 62–70"

essentials:
  - "**Saber or conocer?** Both mean *to know*. **Saber** = facts, and + infinitive = know how to (*No sé dónde vive.* · *Sabe usar una computadora.*). **Conocer** = people and places, and to meet (*Conozco a Raquel.* · *Conozco Madrid.*). The *yo* forms are odd: **sé**, **conozco**."
  - "**Odd yo forms**: *hago, pongo, salgo, traigo, doy, veo*; the other forms are regular. **Tener, venir, decir, oír** also change the stem: *tengo, tienes · vengo, vienes · digo, dices · oigo, oyes*. **Tener que** + inf. = to have to: *Tengo que ir a Madrid.*"
  - "**Numbers 21–99**: *veintiuno … veintinueve* in one word; from 31, three words joined by **y**: *treinta y uno, noventa y nueve*. Don't mix up **sesenta** (60, *s* as in *seis*) and **setenta** (70, *t* as in *siete*)."
  - "**Clothes and courtesy**: *¿Qué llevas?* (**llevar** = to wear) · *Llevo pantalones y una camisa.* To ask politely, use **¿Podría…?, Quisiera…, Me gustaría…** + infinitive, or **¿Me permite…?** + a thing."

verbs:
  table:
    verb: tener
    meaning: to have
    irregular: true
    forms:
      - ["tengo", "I have"]
      - ["tienes", "you have"]
      - ["tiene", "he, she has · you have"]
      - ["tenemos", "we have"]
      - ["tenéis", "you have"]
      - ["tienen", "they have · you have"]
    hook: "Only *yo* ends in **-go**. The **ie** is in t**ie**nes, t**ie**ne, t**ie**nen, not in *tenemos, tenéis*. **Venir** (to come) works the same way: *vengo, vienes…*"
  notes:
    - label: tener que + inf.
      text: "= to have to: *Tengo que ir a Madrid.* = I have to go to Madrid."
    - label: tener … años
      text: "= to be … years old: *Mi padre tiene cincuenta años.*"
  met:
    - ["deje", "dejar", "please leave (*usted*)"]
    - ["se aloja", "alojarse", "he / she is staying (at a hotel)"]
    - ["sigue", "seguir", "he / she follows"]
    - ["ganó", "ganar", "he / she won"]

grammar:
  - title: "Two verbs for to know: saber · conocer"
    rule: "They don't swap. Only *yo* is irregular; the rest are regular -er forms (Episode 5)."
    table:
      head: ["", "saber", "conocer"]
      rows:
        - ["use for", "facts, information · + inf. = know **how to**", "people, places, things · **to meet**"]
        - ["yo", "**sé**", "**conozco**"]
        - ["tú", "sabes", "conoces"]
        - ["él · ella · usted", "sabe", "conoce"]
        - ["nosotros/as", "sabemos", "conocemos"]
        - ["vosotros/as", "sabéis", "conocéis"]
        - ["ellos · ellas · ustedes", "saben", "conocen"]
    examples:
      - ["Raquel no **sabe** dónde vive Rosario.", "Raquel doesn't know where Rosario lives."]
      - ["Raquel **sabe** usar una computadora.", "Raquel knows how to use a computer."]
      - ["Sólo Teresa Suárez **conoce** a Rosario.", "Only Teresa Suárez knows Rosario."]
      - ["Teresa va a **conocer** a Raquel pronto.", "Teresa is going to meet Raquel soon."]
      - ["Raquel ahora **conoce** Madrid.", "Raquel now knows Madrid."]
    trap: "Quick test: a question word or *que* next (*dónde, quién, que…*) means **saber**; a person next means **conocer a** (Episode 3). **Sé** = I know; *se* without an accent is another word."

  - title: "Odd only in the yo form: hacer, poner, salir, traer, dar, ver"
    rule: "The other forms take the regular endings (Episode 5). Four *yo* forms end in **-go**, like *tengo* (*salgo* was in Episode 6). **Doy** rhymes with *soy, estoy, voy*; **veo** keeps the *e* of *ver*."
    table:
      head: ["", "yo", "the other forms"]
      rows:
        - ["hacer · to make, do", "**hago**", "haces, hace, hacemos, hacéis, hacen"]
        - ["poner · to put", "**pongo**", "pones, pone, ponemos, ponéis, ponen"]
        - ["salir · to leave", "**salgo**", "sales, sale, salimos, salís, salen"]
        - ["traer · to bring", "**traigo**", "traes, trae, traemos, traéis, traen"]
        - ["dar · to give", "**doy**", "das, da, damos, dais, dan"]
        - ["ver · to see", "**veo**", "ves, ve, vemos, veis, ven"]
    examples:
      - ["El reportero sale del hotel.", "The reporter leaves the hotel."]
      - ["Pongo toda la ropa en la cama.", "I put all my clothes on the bed."]
      - ["Ayudo a los clientes con las maletas y ellos me dan una propina.", "I help the guests with their bags and they give me a tip."]
    trap: "**traer** = to bring (here) · **llevar** = to take (there): *¿Traes tu libro a la universidad?* · *¿Llevas muchas maletas?* And *ver* + a person takes the personal **a**: *No veo **a** Alfredo.*"

  - title: "-go and a stem change: decir, oír, venir"
    rule: "A **-go** *yo* form **and** a change in the stem: **e** becomes **i** in *decir*, **ie** in *venir* (like *tener*, the verb card), and *oír* adds a **y**. *Nosotros* and *vosotros* stay regular. Lección 8 covers these stem-changing verbs."
    table:
      head: ["", "decir · to say, tell", "oír · to hear", "venir · to come"]
      rows:
        - ["yo", "**digo**", "**oigo**", "**vengo**"]
        - ["tú", "d**i**ces", "o**y**es", "v**ie**nes"]
        - ["él · ella · usted", "d**i**ce", "o**y**e", "v**ie**ne"]
        - ["nosotros/as", "decimos", "oímos", "venimos"]
        - ["vosotros/as", "decís", "oís", "venís"]
        - ["ellos · ellas · ustedes", "d**i**cen", "o**y**en", "v**ie**nen"]
    examples:
      - ["Vengo al hotel en busca de una abogada norteamericana.", "I'm coming to the hotel in search of an American lawyer."]
      - ["¿Qué me va a decir la Sra. Suárez? ¿Me va a dar algo para don Fernando?", "What is Mrs. Suárez going to tell me? Is she going to give me something for don Fernando?"]
    trap: "**Decir** and **dar** usually come with **me, le**…: the person you tell or give to. *¿Qué le voy a decir a la abogada?* = What am I going to say to the lawyer? More on these little words in later lessons."

  - title: "Numbers 21–99"
    rule: "0–21 are in **Episode 3**. As there, *uno* becomes **un · una** before a noun: *treinta y un años, cuarenta y una personas*."
    table:
      rows:
        - ["21–29: one word", "veintiuno, veinti**dós**, veinti**trés**, veinticuatro, veinticinco, veinti**séis**, veintisiete, veintiocho, veintinueve"]
        - ["30–90: all **-nta**", "treinta, cuarenta, cincuenta, sesenta, setenta, ochenta, noventa"]
        - ["31–99: three words", "treinta **y** uno · cuarenta **y** cinco · noventa **y** nueve"]
        - ["years", "1993 = **mil novecientos** noventa y tres"]
    examples:
      - ["Mi padre tiene cuarenta y ocho años.", "My father is forty-eight."]
      - ["Mi número de teléfono es el 7-36-21-90.", "My phone number is 736 2190: say it in pairs, *siete, treinta y seis, veintiuno, noventa*."]
    trap: "A year is one number, not two pairs as in English: never ~~diecinueve noventa y tres~~. Today's years start with **dos mil**: 2026 = *dos mil veintiséis*. The book also allows *veinte y uno* in three words; one word is the norm today."

  - title: "Asking politely: ¿podría…?, quisiera…"
    rule: "*Deseo…* and *Necesito…* can sound blunt. These four are politer. Three of them take an infinitive: *Me gustaría **pagar** con tarjeta de crédito.*"
    table:
      head: ["", "Spanish", "English"]
      rows:
        - ["ask to do something", "**¿Podría** + inf.?", "Could I please…? Is it possible for me to…?"]
        - ["say what you'd like", "**Quisiera** + inf.", "I would really like to…"]
        - ["say what you'd like", "**Me gustaría** + inf.", "I would really like to… (Episode 4)"]
        - ["ask for a thing", "**¿Me permite…?**", "May I please have…?"]
    examples:
      - ["¿Podría pagar con tarjeta de crédito?", "Could I pay by credit card?"]
      - ["Quisiera hablar con Raquel.", "I would really like to talk to Raquel."]
      - ["¿Me permite su tarjeta de crédito?", "May I have your credit card?"]
    trap: "*¿Podría…?* also asks someone else (*usted*) to do something. Raquel's note: *¿Me podría llamar esta noche?* = Could **you** call me tonight?"

rules:
  - ["**llevar** = to wear (new) · to take somewhere (Episode 4)", "¿Qué llevas? · Llevo una falda y una blusa."]
  - ["**esperar** = to wait **for**: the *for* is built in, as in *buscar*. Personal **a** before a person.", "Raquel espera el tren. · Raquel espera a Jaime."]
  - ["**hacer un viaje** = to take a trip · **hacer las maletas** = to pack", "Antes de hacer un viaje, hago las maletas."]
  - ["**antes de** = before · **después de** = after, + noun or infinitive", "dos días después de su muerte"]
  - ["**unos · unas** = a few · **un par de** = a pair of", "unos calcetines · unas medias · un par de zapatos"]
  - ["**acerca de** = about", "Raquel busca información acerca de Rosario."]
  - ["**no** … **en ninguna parte** = not … anywhere", "No veo a Alfredo en ninguna parte."]

