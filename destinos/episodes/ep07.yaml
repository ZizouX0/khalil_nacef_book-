cognates:
  rule: "No ¡Aumenta tu vocabulario! this time, but the book's trick still works: if **dejar** = to leave, *dejar un mensaje* = to leave a **message**. The new verbs have English relatives too: link them and they stick."
  harder:
    - ["los pantalones", "trousers", "*pants* is short for *pantaloons*"]
    - ["el botones", "bellhop", "named after the buttons on the uniform"]
    - ["conocer", "to know", "think *recognise*"]
    - ["traer", "to bring", "think *tractor*, *attract*"]
    - ["decir", "to say", "think *dictate*"]
    - ["oír", "to hear", "think *audio*"]
    - ["dar", "to give", "think *data*: things given"]
    - ["hacer", "to make", "think *factory*: Latin *f* often became *h*"]
  false_friends:
    - ["la ropa", "clothes", "rope", "la cuerda"]
    - ["actual", "current", "actual", "real, verdadero"]
  borrowed: "**el suéter** and **el jersey** both come from English; *jersey* is used mainly in Spain."

sounds:
  - title: "Hard d, as in *dog*"
    body: "At the **start** of a phrase or sentence, and after **n** or **l**: **d**iez, **d**os, ¿**d**ónde?, ven**d**en, el **d**ía, el **d**octor."
  - title: "Soft d, like *th* in *another*"
    body: "**Everywhere else**: a**d**iós, uste**d**, ¿a**d**ónde?, to**d**o, buenos **d**ías, la **d**octora."
  - title: "The word before decides"
    body: "*el doctor* is hard (after l), *la doctora* soft (after a). *¿Dónde?* is hard, *¿adónde?* soft. After **s** it is soft too: *buenos días, más diez*."
  - title: "Say it: bold d = hard"
    body: "**D**on Julio es el **d**octor de don Fernan**d**o. · **D**os más diez son **d**oce. · ¿**D**ón**d**e está la ciudad de Madrid?"

phrases:
  - ["¡Qué pena lo de la cartera! · Ojalá la encuentre pronto.", "What a shame about the wallet! · I hope you find it soon."]
  - ["¿Me puede hacer el favor de dejar un mensaje?", "Could you do me the favour of leaving a message?"]
  - ["Por favor, deje mi cartera en la recepción.", "Please leave my wallet at reception."]
  - ["¿Me podría llamar esta noche?", "Could you call me tonight?"]
  - ["Tengo una habitación reservada.", "I have a room booked."]
  - ["La reserva está a nombre de ___.", "The booking is in the name of ___."]
  - ["Lo siento, no tengo mi cartera.", "I'm sorry, I don't have my wallet."]
  - ["Perdón, no oigo bien. ¿Puede repetir, por favor?", "Sorry, I can't hear well. Could you repeat that, please?"]
  - ["Me gustaría conocer a ___.", "I'd like to meet ___."]

culture:
  - title: "En el hotel"
    body: "**El botones** carries the bags and gets the tip, *la propina*; the receptionist doesn't. **Ptas.** on the hotel's laundry list = *pesetas*, Spain's money until the **euro** (2002)."
  - title: "De la dictadura a la democracia"
    body: "From 1939 to 1975 Spain was ruled by the dictator **Francisco Franco** (Episode 2). After his death came a peaceful **transición** to democracy. Spain is now a **monarquía constitucional**: as in Britain, the king has little political power. He is a symbol of the country and represents it at home and abroad. The head of government is **el presidente del gobierno**."
    rows:
      - ["22 noviembre 1975", "Two days after Franco's death, **Juan Carlos I**, the successor Franco had chosen, is proclaimed king, with **doña Sofía** as queen"]
      - ["1977", "The first democratic elections since 1936"]
      - ["diciembre 1978", "The people vote for a new Constitution. **Adolfo Suárez** becomes the first *presidente del gobierno* under it"]
      - ["1982", "A socialist government under **Felipe González**, re-elected in 1986 and 1989"]
      - ["1986", "Spain joins the European Economic Community, today's EU"]
      - ["today", "Juan Carlos I abdicated in 2014; his son **Felipe VI** is king"]
