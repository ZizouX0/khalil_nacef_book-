sounds:
  - title: "r: one tap"
    body: "A single **r** inside a word is one quick tap of the tongue, like *tt* in American *Betty* or *dd* in *ladder*: **pero, Sara, para, gracias, tarde, vivir**."
  - title: "rr: a trill"
    body: "**rr**, and **r** at the start of a word or after *n, l*, is trilled, several fast taps: **perro, barrio, correr, rojo, Rosario, Enrique**. It changes the word: *pero* (but) · *perro* (dog), *caro* (expensive) · *carro* (car)."
  - title: "Say it"
    body: "*R con R, guitarra; R con R, barril. Mira qué rápido corren los carros del ferrocarril.*"

phrases:
  - ["Se lo agradezco muchísimo. —No hay de qué.", "I'm very grateful to you. —Don't mention it."]
  - ["No recuerdo bien qué país era. No estoy seguro.", "I don't remember which country it was. I'm not sure."]
  - ["Necesito un par de días para buscar la carta.", "I need a couple of days to look for the letter."]
  - ["Ud. sabe dónde encontrarme.", "You know where to find me."]
  - ["¿Podemos hablar afuera? Con este ruido…", "Can we talk outside? With this noise…"]
  - ["Sí, estoy divorciado. Me organizo bastante bien solo.", "Yes, I'm divorced. I manage quite well on my own."]
  - ["Me preocupo porque estás sola.", "I worry because you're alone."]

culture:
  - title: "José de San Martín"
    body: "Argentina's national hero (1778–1850), the general who led the independence of **Argentina, Chile and Peru**: he crossed the Andes in 1817 with 5,200 men. In the north, **Simón Bolívar** freed Venezuela, Colombia and Ecuador. *Americano* here means *from the Americas*, not *from the United States*."
  - title: "Los brindis"
    body: "*¡Salud, dinero y amor! Y tiempo para disfrutarlos* (or *para gozarlos*). The short toast **¡Salud!** is fine even with water."
