sounds:
  - title: "ñ: like ny in canyon"
    body: "**ñ** is its own letter, after *n* in the dictionary. Say it like *ny* in *canyon*, which comes from Spanish *cañón*: a**ñ**o, se**ñ**ora, ma**ñ**ana, espa**ñ**ol, peque**ñ**o."
  - title: "n or ñ changes the word"
    body: "*cana* (grey hair) · *caña* (cane) · *sonar* (to ring) · *soñar* (to dream) · *pena* (sorrow) · *peña* (rock). **n** itself is as in English; before *b, v, p, m* it closes into an *m*: *u**n** beso, e**n** Perú*."
  - title: "Say it"
    body: "*La compañía del señor Muñoz está en España. · Los niños pequeños hablan español. · La señorita Ordóñez tiene veinte años.*"

phrases:
  - ["¿En qué piensas?", "What are you thinking about?"]
  - ["¿Te sientes bien? ¿Qué te pasa?", "Do you feel all right? What's the matter?"]
  - ["Tengo un mal presentimiento.", "I have a bad feeling about this."]
  - ["Ahora tengo ganas de comer una ensalada de fruta.", "Now I feel like eating a fruit salad."]
  - ["Todos nos están mirando.", "Everyone is looking at us."]
  - ["Lo pasaron muy bien.", "They had a very good time."]
  - ["Esta campera es para ti.", "This jacket is for you."]

culture:
  - title: "Buenos Aires"
    body: "Often called the most European city in Latin America: wide avenues, cafés and bookshops, and the **Teatro Colón**, one of the great opera houses. Most Argentines descend from European immigrants, above all Italians and Spaniards, who came from the mid-19th century on. Its people are the **porteños**, people of the port. The tango singer Carlos Gardel sang: *Buenos Aires… antes morir que olvidarte.*"
